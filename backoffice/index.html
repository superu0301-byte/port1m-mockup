/* ---------- how the head coach's plans have done ----------
   A plan's result in R: what it made against its own risk (from the middle of the Entry range to the first Stop Loss).
   At TP1 the plan sells half and moves the stop to Entry, so the rest ends at TP2, at that stop, or wherever it is now. */
function planR(p) {
  const e = (p.lo + p.hi) / 2, risk = e - p.sl; if (!(risk > 0)) return null;
  const tp1 = (p.sls || []).some(x => x.at <= now() && String(x.note || '').startsWith('ราคาถึง TP1')), live = planLive(p);
  if (live) return null;   // no live price: a plan's result is known once it is closed
  if (p.end.why !== 'tp2' && p.end.why !== 'sl') return null;   // closed by the coach: no price to measure it by
  const exit = p.end.why === 'tp2' ? p.tp2 : slAt(p, p.end.at), r = x => (x - e) / risk;
  return tp1 ? .5 * r(p.tp1) + .5 * r(exit) : r(exit);
}
// the clients a plan was told to: how many bought, how many stayed on the plan in every record, what they made on it
const planStat = p => memo('pst:' + p.id, () => {
  const ids = Object.keys(p.alloc || {}), n = now(), r = planR(p), live = planLive(p);
  let bought = 0, followed = 0, pl = 0;
  ids.forEach(id => {
    const recs = execsOf(id).filter(e => e.plan === p.id && e.at <= n); if (!recs.some(e => e.side === 'buy')) return;
    bought++; if (recs.every(e => e.ver !== 'ok' || allOk(checks(e)))) followed++;
    const pos = positions(id).find(x => x.plan === p.id); if (pos) pl += pos.realized + (pos.qty > 0 ? pos.upl : 0);
  });
  return { p, r, live, told: ids.length, bought, followed, pl, res: live ? 'live' : p.end.why === 'tp2' ? 'tp' : p.end.why === 'sl' ? (r > .05 ? 'be' : 'sl') : 'close' };
});
function planPerf(ps) {
  const st = ps.map(planStat), closed = st.filter(x => !x.live && x.r != null), wins = closed.filter(x => x.r > 0), sum = k => st.reduce((t, x) => t + x[k], 0);
  return { st, closed: closed.length, wins: wins.length, win: closed.length ? wins.length / closed.length : 0, avgR: closed.length ? closed.reduce((t, x) => t + x.r, 0) / closed.length : 0,
    told: sum('told'), bought: sum('bought'), followed: sum('followed'), pl: sum('pl'), live: st.filter(x => x.live).length };
}

}

// the coach updates the client's trading plan: a new version the client confirms; the old one is kept
function tpEditModal(id) {
  const c = client(id); if (!c || !canSee(id) || !isHead()) return;
  const tp = c.tp, base = tpBase(c);
  const box = openModal(mhead(`ปรับแผนเทรด · ${esc(cname(c))}`, `บันทึกเป็นฉบับที่ ${tp.no + 1} · ลูกค้าต้องยืนยันอีกครั้ง · ฉบับเดิมเก็บไว้เป็นหลักฐาน`) + `<div class="mbd" style="display:flex;flex-direction:column;gap:11px">
    <div class="field"><label for="tstr">กลยุทธ์</label><input id="tstr" maxlength="200" value="${esc(tp.strategy)}"></div>
    <div class="fgrid">${c.mks.map(m => `<div class="field"><label for="ta-${m}">วงเงิน${MARKETS[m][0]} (บาท)</label><input id="ta-${m}" type="number" min="0" step="100000" value="${tp.alloc[m] || 0}"></div>`).join('')}<div class="field"><label for="tcash">เงินสดสำรอง (บาท)</label><input id="tcash" type="number" min="0" step="100000" value="${tp.cash}"></div></div>
    <div class="f3"><div class="field"><label for="tmax">ขนาดสถานะสูงสุด (%)</label><input id="tmax" type="number" min="1" max="100" step="1" value="${tp.maxPos * 100}"></div><div class="field"><label for="trisk">ความเสี่ยงต่อครั้ง (%)</label><input id="trisk" type="number" min="0.1" max="10" step="0.1" value="${tp.risk * 100}"></div><div class="field"><label for="tstop">หยุดทบทวนเมื่อลดลง (%)</label><input id="tstop" type="number" min="1" max="50" step="1" value="${tp.stop * 100}"></div></div>
    <div class="xs muted" id="tsum"></div>
  </div><div class="mft"><span class="ferr" id="err"></span><span class="sp"></span><button class="btn ghost" data-act="close">ยกเลิก</button><button class="btn" id="save">${ic('check', 16)} บันทึกฉบับใหม่</button></div>`, 'mid');
  const num2 = k => parseFloat($('#' + k, box).value);
  const cur = () => ({ strategy: clean($('#tstr', box).value, 200), alloc: Object.fromEntries(c.mks.map(m => [m, Math.round(num2('ta-' + m))])), cash: Math.round(num2('tcash')), maxPos: num2('tmax') / 100, risk: num2('trisk') / 100, stop: num2('tstop') / 100 });
  const check = o => !o.strategy ? 'โปรดระบุกลยุทธ์' : Object.values(o.alloc).some(v => !Number.isFinite(v) || v < 0) || !Number.isFinite(o.cash) || o.cash < 0 ? 'วงเงินไม่ถูกต้อง' : !(o.maxPos >= .01 && o.maxPos <= 1) ? 'ขนาดสถานะต้องอยู่ระหว่าง 1–100%' : !(o.risk >= .001 && o.risk <= .1) ? 'ความเสี่ยงต่อครั้งต้องอยู่ระหว่าง 0.1–10%' : !(o.stop >= .01 && o.stop <= .5) ? 'ระดับหยุดทบทวนต้องอยู่ระหว่าง 1–50%' : Object.values(o.alloc).reduce((a, b) => a + b, 0) + o.cash > base * 1.001 ? `วงเงินรวมเกินเงินทุน ฿${baht(base)}` : '';
  const upd = () => { const o = cur(), tot = Object.values(o.alloc).reduce((a, b) => a + (b || 0), 0) + (o.cash || 0); $('#tsum', box).textContent = `รวมวงเงิน ฿${baht(tot)} จากเงินทุน ฿${baht(base)}`; $('#err', box).textContent = check(o); };
  box.addEventListener('input', upd); upd();
  $('#save', box).addEventListener('click', () => {
    const o = cur(), err = check(o); if (err) { $('#err', box).textContent = err; return; }
    (c.tpHist || (c.tpHist = [])).push({ ...tp });
    c.tp = { no: tp.no + 1, at: now(), by: ME().id, ok: null, ...o };
    pushFeed({ by: 'head', who: ME().id, coach: c.coach, cl: c.id, kind: 'tpu', text: `${ME().name} ปรับแผนเทรดของ${c.name} (ฉบับที่ ${c.tp.no}) รอลูกค้ายืนยัน` });
    if (!save()) return;
    closeModal(); render(); toast(`${ic('check', 18)}<div><b>บันทึกแผนเทรดฉบับที่ ${c.tp.no} แล้ว</b><div class="muted sm">${esc(c.name)} จะได้รับแจ้งให้ยืนยัน</div></div>`, 'ok');
  });
}

  menu = null;
  if (act === 'glogin') {
    const accs = [{ name: 'หัวหน้าโค้ช', email: S.head.email, id: 'head', color: '#6a1b9a' }, { name: 'ทีม CS', email: S.cs.email, id: 'cs', color: '#1565c0' }, ...S.coaches.map(c => ({ name: c.name, email: c.email, id: c.id, color: '#8d6e1f' })), { name: 'บัญชีส่วนตัว', email: 'someone@gmail.com', id: null, color: '#5f6368' }];
    return googleChooser(accs, acc => {
      if (!acc.id) return 'อีเมลนี้ไม่มีสิทธิ์เข้าระบบหลังบ้าน โปรดให้ทีม CS เพิ่มบัญชีก่อน';
      sessionStorage.setItem('p1m-bo', acc.id); sessionStorage.setItem(ACT, String(Date.now()));
      const me = ME(); me.seen = now(); pushFeed({ by: roleOf(), who: me.id, coach: isCoach() ? me.id : undefined, kind: 'login', text: `${me.name} เข้าสู่ระบบ` }); save();
      closeModal(); view = null; render();
    }, 'หลังบ้าน ปั้นพอร์ต 1 ล้าน');
  }
  if (act === 'logout') return logout();
  if (act === 'as') { sessionStorage.setItem('p1m-bo', id); sessionStorage.setItem(ACT, String(Date.now())); view = null; selCl = null; return render(); }
  if (act === 'reset') { resetData(); view = null; selCl = null; render(); return toast('รีเซ็ตข้อมูลตัวอย่างแล้ว'); }
  if (!ME()) return;
  if (act === 'slip') { const ex = execOf(id); if (!ex || !canSee(ex.cl)) return; return openModal(mhead(`${slogo(ex.sym, 28)}${verbEx(ex)} ${esc(ex.sym)} · ${fmt(ex.qty)} ${unitOf(ex)} @ ${px(ex.px)}`, esc(cname(client(ex.cl))) + ' · ' + dt(ex.at)) + `<div class="mbd" style="display:flex;justify-content:center"><div style="width:min(300px,100%);height:min(430px,70dvh)">${slipImg(ex, client(ex.cl)) || '<div class="empty">ไม่มีภาพ</div>'}</div></div>`, 'sm'); }
  if (act === 'open') { closeModal(); return openClient(id); }
  if (act === 'recnew') { closeModal(); return recNew({ cl: a.dataset.c, plan: a.dataset.p }); }
  if (act === 'vok') return verifyEx(id);
  if (act === 'vbulk') return bulkModal();
  if (act === 'tpedit') return tpEditModal(id);
  if (act === 'evid') return evidenceModal(id);
  if (act === 'tpview') { const c = client(id); if (!c || !canSee(id)) return; return openModal(mhead(`แผนเทรดเฉพาะบุคคล · ${esc(cname(c))}`, `ฉบับที่ ${c.tp.no}${c.tpHist?.length ? ` · ฉบับก่อนหน้าเก็บไว้ ${c.tpHist.length} ฉบับ` : ''}`) + `<div class="mbd">${tpDoc(c)}</div>`, 'mid'); }
  if (act === 'sessnew') return sessModal(id);
  if (act === 'behalf') return onBehalfModal(id, a.dataset.k);
  if (act === 'vfix') return verFixModal(id);
  if (act === 'asched') return appSchedModal(id);
  if (act === 'ares') return appResultModal(id, a.dataset.r);
  if (act === 'aenroll') { const x = appOf(id); if (!x || x.stage !== 'pass') return; return addClientModal(id); }
  if (act === 'miss') { closeModal(); return missModal(a.dataset.c, a.dataset.p); }
  if (act === 'cell') return cellModal(a.dataset.p, a.dataset.c);
  if (act === 'plannew') return planModal('new');
  if (act === 'plansl') return planModal('sl', id);
  if (act === 'planend') return planModal('end', id);
  if (act === 'viewex') { const ex = execOf(id); if (!ex || !canSee(ex.cl)) return; if (isCS()) { selCl = ex.cl; clTab = 'trd'; return go('client'); } selEx = id; rFilter = ex.ver === 'pend' ? 'pend' : ex.ver === 'fix' ? 'fix' : allOk(checks(ex)) ? 'rec' : 'dev'; go('record'); return pageOf('vq', `[data-sel="${CSS.escape(id)}"]`); }
  if (act === 'call') return callModal(a.dataset.k, a.dataset.cl);
  if (act === 'forward') {
    const c = client(a.dataset.cl); if (!isCS() || !c) return;
    const list = myAlerts().filter(x => x.cl === c.id), txt = list.map(x => x.title).join(' · ');
    S.notes.push({ id: nid('n'), cl: c.id, by: 'cs', role: 'cs', at: now(), text: `ส่งต่อให้โค้ช: ${txt}` });
    list.forEach(x => { S.done[x.k] = { by: 'cs', at: now(), note: 'ส่งต่อโค้ช' }; });
    pushFeed({ by: 'cs', who: 'cs', kind: 'forward', cl: c.id, coach: c.coach, text: `CS ส่งต่อเรื่องของ${c.name}ให้${coach(c.coach).name}: ${txt}` });
    if (!save()) return;
    render(); return toast(`${ic('send', 18)}<div><b>ส่งต่อให้${coach(c.coach).name} แล้ว</b><div class="muted sm">${esc(c.name)} · ${list.length} เรื่อง</div></div>`, 'ok');
  }
  if (act === 'flowrev') return flowModal(a.dataset.c, a.dataset.f);
  if (act === 'addnote') {
    if (!canSee(id)) return;
    const t = clean($('#newnote').value, 500); if (!t) return $('#newnote').focus();
    S.notes.push({ id: nid('n'), cl: id, by: ME().id, role: roleOf(), at: now(), text: t });
    pushFeed({ by: roleOf(), who: ME().id, cl: id, coach: client(id).coach, kind: 'note', text: `${ME().name} เพิ่มบันทึกของ${client(id).name}` });
    if (!save()) return;
    PG.cno = 0; return render();
  }
  if (act === 'note') return noteModal(id);
  if (act === 'addcl') return addClientModal();
  if (act === 'recoach') return recoachModal(id);
  if (act === 'coachf') { if (!isCS()) return; fCoach = id; fStat = 'all'; PG.all = 0; return go('clients'); }
  if (act === 'addstaff') return addStaffModal();
});
// the head coach's queue by keyboard (by key position, so it works with a Thai keyboard too): ↑↓ or J/K pick, Y confirm, N send back
document.addEventListener('keydown', e => {
  if (view !== 'record' || !isHead() || $('#modal').innerHTML || menu || e.ctrlKey || e.metaKey || e.altKey || e.target.closest?.('input,textarea,select,[contenteditable]')) return;
  const k = e.code, i = recIds.indexOf(selEx), ex = execOf(selEx);
  if (['ArrowDown', 'ArrowUp', 'KeyJ', 'KeyK'].includes(k)) {
    const j = Math.max(0, Math.min(recIds.length - 1, i + (k === 'ArrowDown' || k === 'KeyJ' ? 1 : -1)));
    if (recIds[j] && recIds[j] !== selEx) { e.preventDefault(); selEx = recIds[j]; render(); pageOf('vq', `[data-sel="${CSS.escape(selEx)}"]`); }
  } else if (k === 'KeyY' && ex?.ver === 'pend') { e.preventDefault(); verifyEx(selEx); }
  else if (k === 'KeyN' && ex?.ver === 'pend') { e.preventDefault(); verFixModal(selEx); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'newnote') { e.preventDefault(); $('[data-act=addnote]')?.click(); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches?.('.ccard')) { e.preventDefault(); e.target.click(); }
});
document.addEventListener('input', e => { if (e.target.id === 'q') { q = clean(e.target.value, 60); PG.all = 0; const pos = e.target.selectionStart; render(); const i = $('#q'); if (i) { i.focus(); i.setSelectionRange(pos, pos); } } });
document.addEventListener('change', e => { if (e.target.id === 'ppcoach') { ppCoach = coach(e.target.value) ? e.target.value : ''; PG.pp = 0; return render(); } if (e.target.id === 'pcoach') { pCoach = coach(e.target.value) ? e.target.value : 'c1'; PG.mx = 0; return render(); } if (e.target.id === 'hcoach') { hCoach = e.target.value === 'all' || coach(e.target.value) ? e.target.value : ''; PG.hred = PG.hamber = PG.hok = 0; return render(); } if (e.target.id === 'fcoach') { fCoach = coach(e.target.value) ? e.target.value : ''; PG.all = 0; render(); } if (e.target.id === 'sort') { sortBy = e.target.value; PG.all = 0; render(); } });

// the client journal writes to the same storage; pick up its changes
window.addEventListener('storage', e => {
  if (e.key !== KEY) return;
  const seen = new Set(S.feed.map(f => f.id));
  S = load();
  const me = ME(); if (!me) return render();
  S.feed.filter(f => !seen.has(f.id) && f.by === 'client' && f.kind !== 'login' && f.kind !== 'logout' && (isCS() ? ['flow', 'snap', 'cap'].includes(f.kind) : isHead() ? f.kind === 'key' : f.coach === me.id))
    .forEach(f => toast(`${ic(f.kind === 'key' ? 'inbox' : 'check', 18)}<div><b>${esc(f.text)}</b><div class="muted sm">${f.kind === 'key' ? (isHead() ? 'เข้าคิวรอตรวจ' : 'รอหัวหน้าโค้ชตรวจ') : 'อัปเดตแล้ว'}</div></div>`));
  if (!$('#modal').innerHTML && document.activeElement?.id !== 'q' && document.activeElement?.id !== 'newnote') render();
});
let rz;
addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (!$('#modal').innerHTML) render(); }, 150); });
setInterval(() => { idleCheck(); if (!$('#modal').innerHTML && ME() && !menu && !['q', 'newnote'].includes(document.activeElement?.id)) render(); }, 30000);
idleCheck();
render();
</script>
</body>
</html>
