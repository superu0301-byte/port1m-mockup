/* ---------- theme: light, dark or follow the device (one setting for both sites) ---------- */
const THEME_KEY = 'p1m-theme';
const sysLight = matchMedia('(prefers-color-scheme: light)');
const themePref = () => { try { const v = localStorage.getItem(THEME_KEY); return v === 'light' || v === 'dark' ? v : 'system'; } catch { return 'system'; } };
const themeOf = p => p === 'system' ? (sysLight.matches ? 'light' : 'dark') : p;
const themeNow = () => themeOf(themePref());
function applyTheme() {
  const t = themeNow();
  document.documentElement.dataset.theme = t;
  const m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = t === 'light' ? '#f2f4f9' : '#05080f';
}
// the new theme spreads out in a circle from the button that was pressed
function setTheme(p, from) {
  const apply = () => { try { p === 'system' ? localStorage.removeItem(THEME_KEY) : localStorage.setItem(THEME_KEY, p); } catch {} applyTheme(); render(); };
  if (themeOf(p) === themeNow() || !document.startViewTransition || document.documentElement.dataset.fx === 'off') return apply();
  const r = from?.getBoundingClientRect(), x = r ? r.left + r.width / 2 : innerWidth - 40, y = r ? r.top + r.height / 2 : 30;
  document.startViewTransition(apply).ready.then(() => {
    const R = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
    document.documentElement.animate({ clipPath: [`circle(0px at ${x}px ${y}px)`, `circle(${R}px at ${x}px ${y}px)`] }, { duration: 560, easing: 'cubic-bezier(.45,0,.2,1)', pseudoElement: '::view-transition-new(root)' });
  }).catch(() => {});
}
const THEMES = [['light', 'สว่าง', 'sun'], ['dark', 'มืด', 'moon'], ['system', 'ตามอุปกรณ์', 'monitor']];
const themeBtn = () => `<button class="ibtn thb" data-theme-flip aria-label="สลับเป็นธีม${themeNow() === 'light' ? 'มืด' : 'สว่าง'}" title="สลับเป็นธีม${themeNow() === 'light' ? 'มืด' : 'สว่าง'}">${ic(themeNow() === 'light' ? 'moon' : 'sun', 18)}</button>`;
const themeSeg = () => `<div class="thseg" role="radiogroup" aria-label="ธีม">${THEMES.map(([k, l, i]) => `<button role="radio" aria-checked="${themePref() === k}" class="${themePref() === k ? 'on' : ''}" data-theme-set="${k}">${ic(i, 15)}${l}</button>`).join('')}</div>`;
document.addEventListener('click', e => {
  const f = e.target.closest('[data-theme-flip]'), s = e.target.closest('[data-theme-set]');
  if (f) setTheme(themeNow() === 'light' ? 'dark' : 'light', f);
  else if (s) setTheme(s.dataset.themeSet, s);
});
sysLight.addEventListener('change', () => { if (themePref() === 'system') { applyTheme(); if (!$('#modal')?.innerHTML) render(); } });
addEventListener('storage', e => { if (e.key === THEME_KEY) { applyTheme(); if (!$('#modal')?.innerHTML) render(); } });
applyTheme();

/* ---------- modal and toast ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
let lastFocus = null;
function openModal(html, cls = '') {
  lastFocus = document.activeElement;
  const m = $('#modal'); m.innerHTML = `<div class="modal" data-close="1"><div class="mbox ${cls}" role="dialog" aria-modal="true">${html}</div></div>`;
  m.firstChild.addEventListener('mousedown', e => { if (e.target.dataset.close) closeModal(); });
  const box = m.querySelector('.mbox');
  setTimeout(() => (box.querySelector('input:not([type=hidden]):not([type=file]),textarea,select') || box.querySelector('button'))?.focus({ preventScroll: true }), 30);
  return box;
}
function closeModal() { $('#modal').innerHTML = ''; if (lastFocus && document.contains(lastFocus)) lastFocus.focus({ preventScroll: true }); }
const mhead = (title, sub = '') => `<div class="mhd"><div style="min-width:0"><h3>${title}</h3>${sub ? `<div class="muted sm" style="margin-top:3px">${sub}</div>` : ''}</div><button class="x" data-act="close" aria-label="ปิด">${ic('x', 18)}</button></div>`;
function toast(html, kind = '') {
  const t = document.createElement('div'); t.className = 'toast ' + kind; t.setAttribute('role', 'status'); t.innerHTML = html;
  const box = $('#toasts'); box.appendChild(t);
  while (box.children.length > 3) box.firstChild.remove();
  setTimeout(() => { t.style.transition = 'opacity .4s'; t.style.opacity = 0; setTimeout(() => t.remove(), 400); }, 5000);
}
document.addEventListener('keydown', e => {
  if (!$('#modal')?.innerHTML) return;
  if (e.key === 'Escape') return closeModal();
  // keep keyboard focus inside an open dialog
  if (e.key === 'Tab') {
    const f = $$('#modal button:not([disabled]),#modal input:not([type=file]),#modal textarea,#modal select,#modal a[href]').filter(x => x.offsetParent);
    if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
  }
});

/* ===== Characters: the drawn people of the community hall (client site) and the coaches' portraits (both sites).
   drawChar draws one person with their feet at (o.x, o.y); avatarOf gives a member their look (S.avatars, or a steady
   random one); staffFace draws a coach's face once as a picture. ===== */
const AV = {
  skin: ['#f7d7b8', '#ebb995', '#cf956b', '#a06a47', '#6f462b'],
  hair: ['สั้น', 'ตั้ง', 'บ๊อบ', 'ยาว', 'มวย', 'เกรียน'],
  hairC: ['#1d1a1a', '#4a2f1d', '#7f5228', '#d8b46b', '#a6382c', '#cfd3da', '#3a4f9e'],
  outfit: ['สูท', 'เชิ้ต', 'ฮู้ด', 'โปโล'],
  color: ['#1f2d4f', '#2b2b33', '#7a1f2b', '#1f5a46', '#c79a3a', '#e9e4d8', '#5b3f8c', '#2f6db3'],
  acc: ['ไม่มี', 'แว่นตา', 'หมวกแก๊ป', 'หูฟัง'],
};
const AV_K = ['skin', 'hair', 'hairC', 'outfit', 'color', 'acc'];
const TCOL = { rookie: '#a9b2c4', silver: '#d5dbe6', gold: '#c9a96e', plat: '#8fdcec', dia: '#a4c6ff', black: '#f3d991' };
const avOk = a => !!a && AV_K.every(k => Number.isInteger(a[k]) && a[k] >= 0 && a[k] < AV[k].length);
function avatarOf(c) {
  const a = (S.avatars || {})[c.id];
  if (avOk(a)) return a;
  const h = k => hsh(k + ':' + c.id), pick = (k, n) => Math.floor(h(k) * n);
  return { skin: pick('sk', 5), hair: pick('hr', 6), hairC: h('hc0') < .82 ? pick('hc', 4) : pick('hc2', 7), outfit: pick('of', 4), color: pick('cl', 8), acc: h('ac') < .5 ? 0 : 1 + pick('ac2', 3) };
}
/* ---------- drawing helpers ---------- */
function rr(x, y, w, h, r, ctx) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function dot(ctx, x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
function poly(ctx, pts, fill) { ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath(); ctx.fillStyle = fill; ctx.fill(); }
function shade(hex, k) {
  const n = parseInt(hex.slice(1), 16), f = v => Math.round(k < 0 ? v * (1 + k) : v + (255 - v) * k);
  return `rgb(${f(n >> 16)},${f(n >> 8 & 255)},${f(n & 255)})`;
}

/* ---------- one character, drawn with its feet at (o.x, o.y): o.s scale, o.t seconds, o.walk, o.phase, o.face f/l/r/b ---------- */
function drawChar(ctx, a, tk, o) {
  const skin = AV.skin[a.skin], hc = AV.hairC[a.hairC], oc = AV.color[a.color], face = o.face || 'f', back = face === 'b', dir = face === 'l' ? -1 : face === 'r' ? 1 : 0;

// profit at the close of trading day i (deposits and withdrawals taken out), and the change since
// the month began and since last Friday's close
const profitAt = profitAtDay;
function periodPL(c) {
  const T = T_(), d = tz(now()), m0 = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1), pr = profit(c);
  let im = -1, iw = -1;
  for (let i = 0; i < T; i++) { if (S.days[i] < m0) im = i; if (new Date(S.days[i]).getUTCDay() === 5) iw = i; }
  return { month: pr - profitAt(c, im), week: pr - profitAt(c, iw), m: d.getUTCMonth(), y: d.getUTCFullYear(), fri: iw >= 0 ? S.days[iw] : null };
}
// banknote line work (a guilloche rosette): interwoven waves around a centre, drawn once and kept
let GUIL = '';
function guilloche() {
  if (!GUIL) {
    let d = '';
    for (let j = 0; j < 5; j++) for (let o = 0; o < 3; o++) {
      const R = 70 + j * 44, A = 9 + j * 2.4, k = 14 + j * 5;
      let path = '';
      for (let i = 0; i <= 480; i++) { const t = i / 480 * Math.PI * 2, r = R + A * Math.sin(k * t + o * Math.PI * 2 / 3) + A * .35 * Math.sin((k + 3) * t); path += `${i ? 'L' : 'M'}${(r * Math.cos(t)).toFixed(1)} ${(r * Math.sin(t)).toFixed(1)}`; }
      d += `<path d="${path}Z"/>`;
    }
    GUIL = `<svg class="guil" viewBox="-300 -300 600 600" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width=".7">${d}</g><circle r="292" fill="none" stroke="currentColor" stroke-width="1"/><circle r="284" fill="none" stroke="currentColor" stroke-width=".5"/></svg>`;
  }
  return GUIL;
}
// the discipline score as a seal: a ring of ticks, a band of line work, the score in the middle
function sealSvg(score, size = 128) {
  const c = size / 2, rA = c - 6, C = 2 * Math.PI * rA, tone = { ok: 'var(--up)', warn: 'var(--warn)', dn: 'var(--dn)' }[scoreTone(score)];
  let ticks = '', wave = '';
  for (let i = 0; i < 60; i++) { const a = i / 60 * Math.PI * 2, r1 = c - 11, r2 = c - (i % 5 ? 14 : 17); ticks += `M${(c + r1 * Math.cos(a)).toFixed(1)} ${(c + r1 * Math.sin(a)).toFixed(1)}L${(c + r2 * Math.cos(a)).toFixed(1)} ${(c + r2 * Math.sin(a)).toFixed(1)}`; }
  for (let o = 0; o < 2; o++) { let w = ''; for (let i = 0; i <= 240; i++) { const a = i / 240 * Math.PI * 2, r = c - 21 + 2 * Math.sin(30 * a + o * Math.PI); w += `${i ? 'L' : 'M'}${(c + r * Math.cos(a)).toFixed(1)} ${(c + r * Math.sin(a)).toFixed(1)}`; } wave += `<path d="${w}Z"/>`; }
  return `<div class="seal" style="width:${size}px;height:${size}px"><svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" aria-hidden="true">
    <circle cx="${c}" cy="${c}" r="${rA}" class="m-tr" stroke-width="4" fill="none"/><circle cx="${c}" cy="${c}" r="${rA}" class="arc" style="stroke:${tone};--arc:${(C * score / 100).toFixed(1)}" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="${(C * score / 100).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 ${c} ${c})"/>
    <path d="${ticks}" class="m-tk" stroke-width="1"/><g class="m-wv" fill="none" stroke-width=".7">${wave}</g><circle cx="${c}" cy="${c}" r="${c - 26}" class="m-in"/></svg>
    <span class="m-v" style="--fs:${Math.round(size * .26)}px"><b class="num">${score}</b><small>วินัย</small></span></div>`;
}

function wireSlip(box, onChange, mk) {
  let slip = null;
  const set = (s, html) => { slip = s; $('#drop', box).classList.add('has'); $('#dropTh', box).innerHTML = html; $('#dropTx', box).innerHTML = '<b class="up">แนบภาพแล้ว</b>'; onChange(); };
  const pickFile = () => $('#file', box).click();
  $('#drop', box).addEventListener('click', e => { if (!e.target.closest('[data-act=mockslip]')) pickFile(); });
  $('#drop', box).addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pickFile(); } });
  $('#file', box).addEventListener('change', async e => {
    try { const img = await readImage(e.target.files[0]); set({ img }, `<img src="${img}" alt="">`); }
    catch (err) { toast(`${ic('alert', 18)}<div><b>แนบภาพไม่สำเร็จ</b><div class="muted sm">${esc(err.message)}</div></div>`, 'err'); }
  });
  box.querySelector('[data-act=mockslip]').addEventListener('click', e => { e.stopPropagation(); const m = mk(); set({ m: 1, mock: m }, slipSvg(m, ME())); });
  return () => slip;
}

function schDay(d0) {
  const me = ME(), n = now(), dt = new Date(d0), w = dt.getUTCDay(), at = (h, m = 0) => d0 - TZ + h * HR + m * MIN, out = [];
  if (HOLIDAYS.includes(isoOf(d0))) return [{ k: 'close', at: at(0) }];
  if (at(23) < me.joined) return out;
  if (dt.getUTCDate() === 5) {
    const pm = Date.UTC(dt.getUTCFullYear(), dt.getUTCMonth() - 1, 1), ym = isoOf(pm).slice(0, 7);
    if (pm - TZ + 31 * DAY > me.joined) {

      out.push({ k: 'stmt', at: at(18), sub: `เดือน ${ymName(ym)} จากโบรกเกอร์`, st: ok ? 'ok' : at(23, 59) < n ? 'miss' : null });
    }
  }
  if (w === 0 || w === 6) return out;
  if (w === 2) {
    const ss = sessOf(me.id).find(x => dayOf(x.at) === d0);
    if (ss) out.push({ k: ss.kind === 'review' ? 'review' : 'coach', at: ss.at, who: [ss.coach], st: ss.att ? 'ok' : 'miss', note: ss.note });
    else if (at(19) > n) out.push({ k: firstOfMonth(at(19)) ? 'review' : 'coach', at: at(19), who: [me.coach] });
  }
  if (w === 5) {
    const ok = snapsOf(me).some(x => S.days[x.day] >= d0 && S.days[x.day] < d0 + 7 * DAY);
    out.push({ k: 'snap', at: at(16, 30), st: ok ? 'ok' : at(23, 59) < n ? 'miss' : null });

// big screens: as many sessions as fit in a day, then "+n เพิ่มเติม"; every day is the same height, so measure once
function schFit(box) {
  if (narrow()) return;
  const cells = $$('.sc', box), first = $('.se', box); if (!first) return;
  cells.forEach(c => { $$('.se', c).forEach(e => { e.hidden = false; }); $('.sc-more', c).hidden = true; });
  const c0 = cells[0], ev0 = $('.sc-e', c0), gap = parseFloat(getComputedStyle(ev0).rowGap) || 0;
  const room = c0.clientHeight - ev0.offsetTop - (parseFloat(getComputedStyle(c0).paddingBottom) || 0), h = first.offsetHeight + gap;
  const fit = Math.max(1, Math.floor((room + gap) / h)), withMore = Math.max(1, Math.floor((room - 18) / h));
  cells.forEach(c => { const es = $$('.se', c); if (es.length <= fit) return; es.slice(withMore).forEach(e => { e.hidden = true; }); const m = $('.sc-more', c); m.textContent = `+${es.length - withMore} เพิ่มเติม`; m.hidden = false; });
}
function schShow(box, iso) {
  schSel = iso;
  $$('.sc.sel', box).forEach(c => c.classList.remove('sel'));
  const c = $(`.sc[data-schd="${iso}"]`, box), pop = $('.sch-pop', box); c?.classList.add('sel');
  pop.innerHTML = schList(iso);
  if (narrow() || !c) return;
  // big screens: the day's details float beside the day
  const b = $('.sch-b', box).getBoundingClientRect(), r = c.getBoundingClientRect(), w = 300;
  pop.classList.add('on');
  const left = r.right + 8 + w <= b.right ? r.right + 8 : Math.max(b.left + 8, r.left - 8 - w);
  pop.style.left = `${left - b.left}px`;
  pop.style.top = `${Math.max(6, Math.min(r.top - b.top, b.height - pop.offsetHeight - 6))}px`;
}
function coachingModal() {
  const n = now(), tn = tz(n);

}
