<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-JnaEj661ZFpXVudRpdY92kLxttL+iit66dgMQClFt64=' 'sha256-OuZV1HJ22xjKhacEazAQVklRYsUhTOJkbY+N5FenJkY='; style-src 'unsafe-inline'; img-src data: blob:; base-uri 'none'; form-action 'none'; object-src 'none'">
<title>ปั้นพอร์ต 1 ล้าน · Trading Journal (ต้นแบบ)</title>
<style>
/* Port 1M look: midnight navy + champagne gold, glass panels over a soft aurora.
   One screen, no page scroll: long lists page inside their panel. */
:root{--bg:#05080f;--bg2:#0d1426;--bg3:#131c33;--bg4:#1b2643;--surf:linear-gradient(180deg,rgba(22,31,57,.92),rgba(12,18,35,.94));--line:rgba(150,172,232,.085);--line2:rgba(150,172,232,.17);--ink:#f2f5fc;--ink2:#bdc6da;--mut:#8590aa;--gold:#ebc062;--gold2:#f8df9c;--goldbg:rgba(235,192,98,.12);--goldln:rgba(235,192,98,.45);--up:#3ddc97;--upbg:rgba(61,220,151,.12);--dn:#ff6b7d;--dnbg:rgba(255,107,125,.13);--warn:#f5b544;--warnbg:rgba(245,181,68,.13);--blue:#7ea6ff;--bluebg:rgba(126,166,255,.13);--pu:#b69cff;--pubg:rgba(182,156,255,.13);--shadow:0 24px 60px -12px rgba(0,0,0,.65);--btn:linear-gradient(135deg,#fde7a8 0%,#ebc062 45%,#c98f2b 100%);--glass:rgba(11,17,32,.94);--r:20px}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:"Leelawadee UI","Leelawadee","Sukhumvit Set","Thonburi","Noto Sans Thai",Tahoma,sans-serif;color:var(--ink);font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased;
  background:radial-gradient(1000px 560px at 88% -14%,rgba(235,192,98,.16),transparent 62%),radial-gradient(900px 640px at -12% 112%,rgba(70,110,255,.14),transparent 62%),radial-gradient(700px 420px at 55% 120%,rgba(61,220,151,.05),transparent 65%),var(--bg)}
/* faint chart-paper grid behind everything */
body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);background-size:46px 46px;-webkit-mask-image:radial-gradient(ellipse 90% 70% at 50% 0%,#000 10%,transparent 75%);mask-image:radial-gradient(ellipse 90% 70% at 50% 0%,#000 10%,transparent 75%)}
#app{height:100%;position:relative}
h1,h2,h3,h4{line-height:1.3;margin:0}
button{font-family:inherit;font-size:14.5px;cursor:pointer;color:inherit;background:none;border:none;padding:0;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
input[type=checkbox]{appearance:none;-webkit-appearance:none;width:20px;height:20px;padding:0;margin:0;border-radius:6px;border:1.5px solid rgba(150,172,232,.4);background:rgba(255,255,255,.04);display:inline-grid;place-content:center;cursor:pointer;flex:none;transition:background .12s,border-color .12s}
input[type=checkbox]:checked{background:var(--btn);border-color:transparent}
input[type=checkbox]:checked:after{content:"";width:10px;height:5px;border:2.4px solid #211703;border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
input[type=checkbox]:focus-visible{outline:2px solid var(--goldln);outline-offset:2px}
button:disabled{cursor:not-allowed;opacity:.42}
input,textarea,select{font-family:inherit;font-size:15px;color:var(--ink);background:rgba(255,255,255,.035);border:1px solid var(--line2);border-radius:12px;padding:9px 12px;outline:none;width:100%;transition:border-color .15s,box-shadow .15s}
input:focus,textarea:focus,select:focus{border-color:var(--goldln);box-shadow:0 0 0 3px var(--goldbg)}
input[aria-invalid=true]{border-color:rgba(255,107,125,.6)}
textarea{resize:none;min-height:64px}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
select option{background:var(--bg2)}
:focus-visible{outline:2px solid var(--goldln);outline-offset:2px}
a{color:inherit}
.ic{flex:none;display:inline-block;vertical-align:middle}
.num{font-variant-numeric:tabular-nums lining-nums}
.serif{font-family:Georgia,"Times New Roman",serif}
.muted{color:var(--mut)}.ink2{color:var(--ink2)}.gold{color:var(--gold)}.up{color:var(--up)}.dn{color:var(--dn)}.warn{color:var(--warn)}.ok{color:var(--up)}
.gtxt{background:linear-gradient(180deg,#fff4d2 0%,#f3d07e 45%,#d29a35 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.sm{font-size:13.5px}.xs{font-size:12.5px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

/* app shell: everything fits the screen, long lists page instead of scrolling */
.app{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.view{flex:1;min-height:0;width:100%;max-width:1440px;margin:0 auto;padding:14px 22px 18px;display:grid;gap:14px;overflow:hidden}
.view.enter>*{animation:rise .38s cubic-bezier(.2,.75,.2,1) both}
.view.enter>*:nth-child(2){animation-delay:.04s}.view.enter>*:nth-child(3){animation-delay:.08s}.view.enter>*:nth-child(4){animation-delay:.12s}.view.enter>*:nth-child(5){animation-delay:.16s}.view.enter>*:nth-child(n+6){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.vh{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-width:0;grid-column:1/-1}
.vh h1{font-size:22px;white-space:nowrap;letter-spacing:-.005em}
.vh p{margin:0;color:var(--mut);font-size:13.5px}
.span{grid-column:1/-1}
.pnl,.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);box-shadow:inset 0 1px 0 rgba(255,255,255,.045),0 18px 40px -22px rgba(0,0,0,.75)}
.pnl{display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden;contain:layout paint}
.ph{display:flex;align-items:center;gap:10px;padding:14px 18px 10px;min-height:50px;flex:none}
.ph h3{font-size:15.5px;white-space:nowrap;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto}
.ph .sub{font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pb{flex:1;min-height:0;overflow:hidden;padding:0 16px 14px;position:relative}
.pgn{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mut);flex:none}
.pgn:empty{display:none}
.pgn button{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink2);background:rgba(255,255,255,.04);border:1px solid var(--line)}
.pgn button:hover:not(:disabled){color:var(--gold);border-color:var(--goldln)}
.list{display:flex;flex-direction:column;gap:8px}
.list.tight{gap:0}
.kstrip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;grid-column:1/-1;align-content:start}
.kpi{background:radial-gradient(150px 90px at 100% 0%,rgba(235,192,98,.08),transparent 70%),var(--surf);border:1px solid var(--line);border-radius:18px;padding:12px 16px;min-width:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.045)}
.kpi .k{font-size:12.5px;color:var(--mut);display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden}
.kpi .v{font-size:22px;font-weight:700;margin-top:1px;white-space:nowrap;letter-spacing:-.01em}
.kpi .s{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chartbox{position:relative;min-height:0;min-width:0;flex:1}
.empty{padding:22px;text-align:center;color:var(--mut);font-size:14px}
.empty .ic{display:block;margin:0 auto 8px;color:var(--up)}
/* narrow screens: panels become tabs instead of stacking */
.vgrid.tabbed{display:flex!important;flex-direction:column}
.vgrid.tabbed>.pt-off{display:none!important}
.vgrid.tabbed>[data-pt]{flex:1 1 auto;min-height:0}
.ptabs{flex:none;align-self:flex-start;max-width:100%}

/* cards */
.pad{padding:18px 20px}
.eyebrow{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:700}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:999px;padding:9px 18px;font-weight:700;font-size:14.5px;background:var(--btn);color:#211703;white-space:nowrap;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 8px 22px -10px rgba(235,192,98,.75);transition:filter .15s,transform .15s,box-shadow .15s}
.btn:hover:not(:disabled){filter:brightness(1.06);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 10px 26px -8px rgba(235,192,98,.8)}
.btn:active:not(:disabled){transform:translateY(1px) scale(.985)}
.btn.ghost{background:rgba(255,255,255,.03);border:1px solid var(--line2);color:var(--ink);font-weight:600;box-shadow:none}
.btn.ghost:hover:not(:disabled){border-color:var(--goldln);color:var(--gold);box-shadow:none}
.btn.soft{background:rgba(255,255,255,.07);color:var(--ink);font-weight:600;box-shadow:none}
.btn.soft:hover:not(:disabled){background:rgba(255,255,255,.11);box-shadow:none}
.btn.ok{background:linear-gradient(135deg,#7af0bd,#2fc585);color:#04261a;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 8px 22px -10px rgba(61,220,151,.7)}
.btn.bad{background:transparent;border:1px solid rgba(255,107,125,.4);color:var(--dn);font-weight:600;box-shadow:none}
.btn.sm{padding:6px 13px;font-size:13.5px}
.btn.lg{padding:12px 26px;font-size:16px}
.btn.block{width:100%}
.lnk{color:var(--gold);font-weight:600;display:inline-flex;align-items:center;gap:3px}
.lnk:hover{text-decoration:underline}
.ibtn{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink2);position:relative;flex:none;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.ibtn:hover{color:var(--ink);border-color:var(--line2)}
.ibtn .bdg{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;padding:0 4px;border-radius:999px;background:var(--dn);color:#fff;font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg);box-shadow:0 0 12px rgba(255,107,125,.6)}
.demob{display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--goldln);color:var(--gold);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:700;flex:none;background:rgba(235,192,98,.05)}

/* tags and chips */
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;line-height:1.5;padding:2px 9px;border-radius:999px;background:rgba(255,255,255,.07);color:var(--ink2);white-space:nowrap;font-weight:600}
.tag.ok{background:var(--upbg);color:var(--up)}
.tag.dn{background:var(--dnbg);color:var(--dn)}
.tag.warn{background:var(--warnbg);color:var(--warn)}
.tag.blue{background:var(--bluebg);color:var(--blue)}
.tag.pu{background:var(--pubg);color:var(--pu)}
.tag.gold{background:var(--goldbg);color:var(--gold)}
.tag.line{background:transparent;border:1px solid var(--line2)}
.side{display:inline-flex;align-items:center;justify-content:center;min-width:44px;font-size:11.5px;font-weight:800;letter-spacing:.06em;padding:3px 8px;border-radius:8px;flex:none}
.side.buy{background:var(--upbg);color:var(--up);box-shadow:inset 0 0 0 1px rgba(61,220,151,.25)}
.side.sell{background:var(--dnbg);color:var(--dn);box-shadow:inset 0 0 0 1px rgba(255,107,125,.25)}
.side.sl{background:var(--goldbg);color:var(--gold);box-shadow:inset 0 0 0 1px rgba(235,192,98,.25)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 13px;border-radius:999px;border:1px solid var(--line2);color:var(--ink2);font-size:13.5px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;background:rgba(255,255,255,.02)}
.chip:hover{color:var(--ink)}
.chip.on{background:var(--goldbg);color:var(--gold);border-color:var(--goldln);font-weight:700}
.chip .n{font-size:11.5px;background:rgba(255,255,255,.08);color:var(--ink2);border-radius:999px;padding:0 7px}
.chip.on .n{background:rgba(235,192,98,.2);color:var(--gold)}
.seg{display:inline-flex;background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;max-width:100%;overflow:hidden}
.seg button{padding:6px 14px;border-radius:999px;color:var(--ink2);font-size:14px;white-space:nowrap;display:inline-flex;gap:6px;align-items:center;transition:background .15s,color .15s}
.seg button:hover{color:var(--ink)}
.seg button.on{background:rgba(255,255,255,.1);color:var(--ink);font-weight:700;box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.seg .n{font-size:11.5px;background:var(--goldbg);color:var(--gold);border-radius:999px;padding:0 7px;font-weight:700}

/* stock logo + company card */

.slg.mono{background:linear-gradient(135deg,hsl(var(--h) 55% 42%),hsl(calc(var(--h) + 40) 50% 26%));color:#fff;font-size:calc(var(--s)*.36);font-weight:800;letter-spacing:.02em;box-shadow:0 0 0 1px rgba(255,255,255,.1)}
.sy{display:inline-flex;align-items:center;gap:9px;min-width:0;vertical-align:middle;text-align:left}
.sy b{letter-spacing:.02em;white-space:nowrap}
button.sy:hover b{color:var(--gold2)}
button.sy:hover .slg{transform:scale(1.08)}
.slb{flex:none;display:flex;border-radius:12px}
.slb:hover .slg{transform:scale(1.08)}
.jm{display:flex;gap:10px;align-items:center;min-width:0}
/* allocation donut + legend, portfolio heat, weekly results */
.alloc{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;min-height:0}
.donut{position:relative;flex:none}
.donut svg{display:block;transform:rotate(-90deg)}
.donut circle[data-dk]{transition:opacity .15s,stroke-width .15s}
.alloc.hov .donut circle[data-dk]:not(.hl){opacity:.28}
.dc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.2;padding:0 18%}
.dc b{font-size:22px;letter-spacing:-.01em}
.dc span{font-size:11.5px;color:var(--mut);margin-top:2px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.alg{display:flex;flex-direction:column;gap:2px;min-width:0}
.ali{display:grid;grid-template-columns:10px minmax(0,1fr) auto;grid-template-rows:auto 3px;gap:2px 8px;align-items:center;padding:4px 6px;border-radius:9px;font-size:12.5px;cursor:default}
.ali>i{width:10px;height:10px;border-radius:3px}
.ali .ab{grid-column:2/-1;height:3px;border-radius:2px;background:rgba(255,255,255,.05);overflow:hidden}
.ali .ab i{display:block;height:100%;border-radius:inherit}
.ali.hl{background:rgba(255,255,255,.05)}
.seg.xsg{padding:2px}.seg.xsg button{padding:3px 10px;font-size:12px}
.heat{display:flex;flex-direction:column;gap:5px}
.hbar{position:relative;height:8px;border-radius:999px;background:rgba(255,255,255,.07)}
.hbar i{position:absolute;inset:0 auto 0 0;border-radius:inherit}
.hbar i.up{background:linear-gradient(90deg,#1fa970,var(--up))}.hbar i.warn{background:linear-gradient(90deg,#c98a1c,var(--warn))}.hbar i.dn{background:linear-gradient(90deg,#c9374b,var(--dn))}
.hbar s{position:absolute;left:66.6%;top:-3px;bottom:-3px;width:2px;border-radius:2px;background:rgba(255,255,255,.55)}
.wk{display:flex;flex-direction:column;gap:6px;flex:none}
.wbars{display:block;width:100%;height:56px}
.wks{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:var(--mut)}
/* the donut and the weekly strip size themselves to the room the panel actually has */
.palloc .pb,.phist .pb,.pb:has(>.wk){container-type:size}
.palloc .donut{width:clamp(44px,calc(100cqh - 6px),150px)!important;height:clamp(44px,calc(100cqh - 6px),150px)!important}
.donut svg{width:100%;height:100%}
.alg:has(>.ali:nth-child(6)) .ali{padding:2px 6px;grid-template-rows:auto}.alg:has(>.ali:nth-child(6)) .ab{display:none}
@container (max-height:150px){.ali{padding:1px 6px;grid-template-rows:auto}.ali .ab{display:none}.ali:nth-child(n+5):not(:last-child){display:none}.dc b{font-size:17px}.dc span{font-size:10.5px}}
@container (max-height:118px){.ali{padding:0 4px;line-height:1.3}.ali:nth-child(n+3):not(:last-child){display:none}.dc span{display:none}}
@container (max-height:72px){.ali:nth-child(n+2):not(:last-child){display:none}}
@container (max-height:50px){.alg{display:none}.alloc{grid-template-columns:auto}}
@container (max-height:230px){.wbars{height:34px}}
@container (max-height:160px){.wk{display:none}}
.pfoot{flex:none;padding:10px 18px 14px;border-top:1px solid var(--line);font-size:12.5px;display:flex;flex-direction:column;gap:10px}
.sline{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.035);border:1px solid var(--line)}
.sline .r{display:flex;flex-direction:column;align-items:flex-end;line-height:1.35}
.stm{padding:20px 22px 18px;display:flex;flex-direction:column;gap:14px}
.stm-h{display:flex;gap:14px;align-items:center}
.stm-h h3{font-size:24px;letter-spacing:.02em}
.stm-h .row{flex-wrap:wrap;row-gap:4px}
.stm-h .tag{max-width:100%;overflow:hidden;text-overflow:ellipsis}
.stm-h .x{margin-left:auto;align-self:flex-start;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--mut);flex:none}
.stm-h .x:hover{background:rgba(255,255,255,.06);color:var(--ink)}
.stm-p{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.stm-p>.num:first-child{font-size:34px;font-weight:700;letter-spacing:-.01em}
.stm-p .tag{font-size:13.5px;padding:3px 11px}
.stm-r .r52{position:relative;height:8px;border-radius:999px;margin-top:8px;background:linear-gradient(90deg,rgba(255,107,125,.55),rgba(245,181,68,.55),rgba(61,220,151,.55))}
.stm-r .r52 i{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 0 0 4px rgba(255,255,255,.18),0 2px 8px rgba(0,0,0,.5)}
.stm-k{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stm-k div{padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--line);min-width:0}
.stm-k span{display:block;font-size:12px;color:var(--mut)}
.stm-k b{font-size:15.5px;white-space:nowrap}
@media (max-width:480px){.stm{padding:18px 16px 16px}.stm-k{grid-template-columns:1fr 1fr}.stm-k div:last-child{grid-column:1/-1}.stm-p>.num:first-child{font-size:30px}}

/* plan-vs-actual marks */
.checks{display:inline-flex;gap:4px;flex-wrap:wrap}
.ck{display:inline-flex;align-items:center;gap:3px;font-size:12px;padding:1px 7px 1px 5px;border-radius:6px;font-weight:600}
.ck.ok{background:var(--upbg);color:var(--up)}
.ck.bad{background:var(--warnbg);color:var(--warn)}
.ck.no{background:var(--dnbg);color:var(--dn)}
.dots{display:inline-flex;gap:3px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--bg4)}
.dots i.ok{background:var(--up)}.dots i.bad{background:var(--warn)}.dots i.no,.dots i.exp{background:var(--dn)}.dots i.pend{background:var(--blue);box-shadow:0 0 8px rgba(126,166,255,.7)}.dots i.skip{background:transparent;box-shadow:inset 0 0 0 1.5px var(--warn)}.dots i.cancel{background:var(--bg4)}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-weight:600;color:var(--mut);font-size:12.5px;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:none}
.tbl .r{text-align:right}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr.click:hover td{background:rgba(255,255,255,.03)}

/* progress */
.bar{height:7px;border-radius:999px;background:rgba(255,255,255,.07);overflow:hidden;position:relative}
.bar>i{position:absolute;inset:0 auto 0 0;border-radius:inherit;background:var(--btn)}
.bar.up>i{background:linear-gradient(90deg,#1fa970,var(--up))}.bar.warn>i{background:linear-gradient(90deg,#c98a1c,var(--warn))}.bar.dn>i{background:linear-gradient(90deg,#c9374b,var(--dn))}

/* avatar */
.av{width:36px;height:36px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14.5px;background:linear-gradient(135deg,#2c3d68,#18223d);color:var(--ink);border:1px solid var(--line2)}
.av.gold{background:var(--btn);color:#211703;border:none;box-shadow:0 0 0 2px rgba(235,192,98,.25)}
.av.lg{width:52px;height:52px;font-size:19px}
.av.sm{width:28px;height:28px;font-size:12px}

/* score ring */
.ring{position:relative;flex:none}
.ring svg{display:block;transform:rotate(-90deg);overflow:visible}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800}

/* forms */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label{font-size:13px;color:var(--ink2);font-weight:600}
.field .hint{font-size:12px;color:var(--mut)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.drop{border:1.5px dashed var(--line2);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:12px;cursor:pointer;color:var(--ink2);background:rgba(255,255,255,.025);font-size:14px}
.drop:hover{border-color:var(--goldln)}
.drop.has{border-style:solid;border-color:rgba(61,220,151,.4)}
.radio{display:flex;flex-direction:column;gap:6px}
.radio label{display:flex;gap:10px;align-items:center;padding:8px 12px;border:1px solid var(--line2);border-radius:12px;cursor:pointer;font-size:14.5px}
.radio label:has(input:checked){border-color:var(--goldln);background:var(--goldbg)}
.radio input{width:auto;accent-color:var(--gold)}
.ferr{color:var(--dn);font-size:13px;min-height:18px}

/* modal: designed to fit; scrolls inside only on very small screens */
.modal{position:fixed;inset:0;z-index:60;background:rgba(2,4,10,.74);display:flex;align-items:center;justify-content:center;padding:12px;animation:fade .2s}
.mbox{background:linear-gradient(180deg,#141d36,#0c1324);border:1px solid var(--line2);border-radius:24px;box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.06);width:min(540px,100%);max-height:calc(100dvh - 24px);overflow:auto;animation:pop .25s cubic-bezier(.2,.75,.2,1);position:relative}
.mbox:before{content:"";position:absolute;inset:0 18% auto;height:1px;background:linear-gradient(90deg,transparent,var(--goldln),transparent)}
.mbox.wide{width:min(1000px,100%)}
.mbox.mid{width:min(780px,100%)}
.mbox.sm{width:min(460px,100%)}
.mhd{display:flex;align-items:flex-start;gap:12px;padding:18px 22px 0}
.mhd h3{font-size:18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mhd .x{margin-left:auto;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--mut);flex:none}
.mhd .x:hover{background:rgba(255,255,255,.06);color:var(--ink)}
.mbd{padding:14px 22px 16px}
.mft{display:flex;gap:10px;justify-content:flex-end;align-items:center;padding:0 22px 20px;flex-wrap:wrap}
.mgrid{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:18px}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* plan strip and comparison inside modals */
.pstrip{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.035);border:1px solid var(--line);font-size:13.5px}
.pstrip div{display:flex;justify-content:space-between;gap:10px}
.pstrip span{color:var(--mut)}
.cmp{margin-top:12px;border:1px solid var(--line2);border-radius:14px;overflow:hidden}
.cmp .ch{padding:8px 12px;font-size:12.5px;color:var(--mut);background:rgba(255,255,255,.035);font-weight:700;display:flex;justify-content:space-between}
.cmp .cr{display:flex;gap:8px;align-items:center;padding:7px 12px;font-size:13.5px;border-top:1px solid var(--line)}
.cmp .ico{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;background:var(--bg4);color:var(--mut)}
.cmp .ok .ico{background:var(--upbg);color:var(--up)}
.cmp .bad .ico{background:var(--warnbg);color:var(--warn)}
.cmp .no .ico{background:var(--dnbg);color:var(--dn)}
.cmp .k{width:58px;color:var(--ink2);flex:none}
.note-box{display:flex;gap:10px;padding:11px 13px;border-radius:14px;font-size:14px;align-items:flex-start;background:var(--pubg);color:#dcd2ff}
.note-box .ic{margin-top:2px;flex:none}
.note-box.y{background:var(--warnbg);color:#ffd99a}
.note-box.g{background:var(--goldbg);color:var(--gold2)}

/* toast */
#toasts{position:fixed;right:18px;bottom:18px;z-index:80;display:flex;flex-direction:column;gap:10px;align-items:flex-end;pointer-events:none}
.toast{pointer-events:auto;background:linear-gradient(180deg,#1b2747,#131c35);border:1px solid var(--line2);border-radius:16px;padding:12px 16px 12px 14px;box-shadow:var(--shadow);font-size:14px;max-width:380px;display:flex;gap:10px;align-items:flex-start;animation:pop .3s cubic-bezier(.2,.75,.2,1);position:relative;overflow:hidden}
.toast:before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--gold)}
.toast.ok:before{background:var(--up)}
.toast.err:before{background:var(--dn)}
.toast>.ic{color:var(--gold)}.toast.ok>.ic{color:var(--up)}.toast.err>.ic{color:var(--dn)}

/* slip (mock screenshot from a broker app) */
.slip{width:100%;height:100%;object-fit:contain;border-radius:12px;display:block}
.slipth{width:40px;height:54px;border-radius:8px;overflow:hidden;border:1px solid var(--line2);flex:none;background:var(--bg3);cursor:zoom-in;display:flex;align-items:center;justify-content:center;color:var(--mut)}
.slipth img,.slipth svg{width:100%;height:100%;object-fit:cover;display:block}

/* google sign-in */
.gbtn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;background:#fff;color:#1f1f1f;border-radius:999px;padding:12px 20px;font-weight:600;font-size:15px;border:1px solid #dadce0;font-family:Roboto,"Leelawadee UI",sans-serif;box-shadow:0 10px 30px -12px rgba(255,255,255,.35)}
.gbtn:hover{background:#f7f8f8}
.gwrap{background:transparent!important;border:none!important;box-shadow:none!important;display:flex;justify-content:center}
.gwrap:before{display:none}
.gpick{background:#fff;color:#1f1f1f;border-radius:22px;width:min(440px,100%);padding:26px 0 16px;box-shadow:var(--shadow);font-family:Roboto,"Leelawadee UI",sans-serif;max-height:calc(100dvh - 24px);display:flex;flex-direction:column}
.gpick h4{font-size:21px;font-weight:400;text-align:center;margin:10px 0 2px}
.gpick .gs{text-align:center;color:#444746;font-size:14.5px;margin-bottom:14px}
.gpick .gs b{color:#0b57d0;font-weight:500}
.gaccs{overflow:auto;min-height:0}
.gacc{display:flex;gap:14px;align-items:center;width:100%;padding:10px 28px;border-top:1px solid #e3e3e3;text-align:left;color:#1f1f1f}
.gacc:hover{background:#f3f6fc}
.gacc .ga{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;flex:none}
.gacc small{display:block;color:#444746;font-size:12.5px}
.gerr{margin:10px 28px 0;padding:9px 12px;border-radius:10px;background:#fce8e6;color:#b3261e;font-size:13.5px}

/* dropdown menus */
.dd{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 10px);z-index:50;background:linear-gradient(180deg,#151f3a,#0e1529);border:1px solid var(--line2);border-radius:18px;box-shadow:var(--shadow);padding:6px;min-width:260px;animation:pop .2s cubic-bezier(.2,.75,.2,1)}
.menu .mi{display:flex;gap:10px;align-items:center;width:100%;padding:9px 11px;border-radius:12px;font-size:14px;text-decoration:none;color:var(--ink);text-align:left}
.menu .mi:hover{background:rgba(255,255,255,.06)}
.menu .mt{font-size:12px;color:var(--mut);padding:6px 11px 3px}
.menu .mh{padding:8px 11px 10px;border-bottom:1px solid var(--line);margin-bottom:4px}

/* chart */
.chartw{position:absolute;inset:0}
.ctip{position:absolute;pointer-events:none;background:#1b2747;border:1px solid var(--line2);border-radius:10px;padding:5px 9px;font-size:12px;white-space:nowrap;transform:translate(-50%,-118%);box-shadow:var(--shadow);z-index:2}

@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}


/* header: a floating glass bar */
.hdr{flex:none;width:calc(100% - 44px);max-width:1396px;margin:12px auto 0;border-radius:20px;background:var(--glass);border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 14px 34px -18px rgba(0,0,0,.8);position:relative;z-index:40}
.hin{height:60px;padding:0 10px 0 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:12px;cursor:pointer;flex:none}
.brand img{height:36px;display:block}
.brand .bt{border-left:1px solid var(--line2);padding-left:12px;line-height:1.25}
.brand .bt b{display:block;font-size:14px}
.brand .bt small{font-size:10.5px;letter-spacing:.18em;color:var(--gold);font-weight:700}
.nav{display:flex;gap:2px;padding:4px;border-radius:999px;background:rgba(255,255,255,.035);border:1px solid var(--line);margin:0 auto}
.nav button{padding:7px 16px;border-radius:999px;color:var(--ink2);font-size:14.5px;display:flex;align-items:center;gap:7px;transition:background .2s,color .2s}
.nav button:hover{color:var(--ink)}
.nav button.on{background:var(--btn);color:#211703;font-weight:700;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 6px 18px -8px rgba(235,192,98,.8)}
.nav .n,.tabbar .n{min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--dn);color:#fff;font-size:11px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
.nav button.on .n{background:#211703;color:var(--gold2)}
.hr{display:flex;align-items:center;gap:8px;flex:none}
.mkt{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink2);padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.04);border:1px solid var(--line);white-space:nowrap}
.mkt i{width:7px;height:7px;border-radius:50%;background:var(--up);box-shadow:0 0 0 3px var(--upbg),0 0 10px var(--up);animation:blink 2.4s infinite}
.mkt.off i{background:var(--mut);box-shadow:none;animation:none}
@keyframes blink{50%{opacity:.4}}
.tabbar{display:none}

/* home */
.v-home{grid-template-columns:minmax(0,1fr) 340px;grid-template-rows:auto minmax(0,1fr)}
.hero{display:grid;grid-template-columns:minmax(300px,.9fr) minmax(0,1.1fr);position:relative}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(560px 260px at 8% 0%,rgba(235,192,98,.17),transparent 70%);pointer-events:none}
.hero-l{padding:18px 22px 16px;position:relative;display:flex;flex-direction:column}
.big{font-size:48px;line-height:1.05;letter-spacing:-.01em;margin:4px 0 10px;font-weight:700}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.meta .tag{font-size:12.5px;padding:3px 10px}
.meta .est{background:rgba(255,255,255,.06);color:var(--ink2);gap:5px}
.meta .est:hover{background:rgba(255,255,255,.1);color:var(--ink)}
.meta .est b{color:var(--ink)}
.rl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--ink2);margin-top:6px}
.rl .tag{font-size:11.5px;padding:1px 8px}
.hc-h{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--mut);padding:2px 4px 2px 50px;flex:none}
.lgd2{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.lgd2 i{width:9px;height:9px;border-radius:50%;border:2px solid var(--gold);margin-left:6px}
.lgd2 i.e{border-style:dashed;border-color:var(--gold2)}
.meta .mob{display:none}
.goal{margin-top:auto;padding-top:26px}
.gtrack{position:relative;height:10px;border-radius:999px;background:rgba(255,255,255,.07);margin-bottom:26px;box-shadow:inset 0 1px 2px rgba(0,0,0,.45)}
.gtrack>i{position:absolute;inset:0 auto 0 0;border-radius:inherit;background:linear-gradient(90deg,#7d5414,#ebc062 70%,#fff0c4);box-shadow:0 0 22px rgba(235,192,98,.45)}
.gtrack>i:after{content:"";position:absolute;right:-8px;top:50%;width:16px;height:16px;margin-top:-8px;border-radius:50%;background:#fff6dc;box-shadow:0 0 0 4px rgba(235,192,98,.3),0 0 18px 4px rgba(235,192,98,.6)}
.gtrack>i:before{content:"";position:absolute;right:-14px;top:50%;width:28px;height:28px;margin-top:-14px;border-radius:50%;border:2px solid rgba(235,192,98,.55);animation:ping 2.4s cubic-bezier(.2,.6,.3,1) infinite;will-change:transform,opacity}
@keyframes ping{0%{transform:scale(.5);opacity:.9}100%{transform:scale(1.5);opacity:0}}
.gm{position:absolute;top:-6px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:7px}
.gm b{width:21px;height:21px;border-radius:6px;transform:rotate(45deg);background:var(--bg2);border:2px solid var(--line2);display:flex;align-items:center;justify-content:center}
.gm b .ic{transform:rotate(-45deg)}
.gm.hit b{background:var(--gold);border-color:var(--gold);color:#211703;box-shadow:0 0 14px rgba(235,192,98,.6)}
.gm span{font-size:11.5px;color:var(--mut);white-space:nowrap;font-weight:700}
.gm.hit span{color:var(--gold)}
.gm:last-child{transform:translateX(-100%);align-items:flex-end}
.gstart{position:absolute;top:-19px;transform:translateX(-50%);font-size:10.5px;color:var(--mut);white-space:nowrap}
.glbl{display:flex;justify-content:space-between;font-size:13.5px;color:var(--ink2);gap:8px;flex-wrap:wrap}
.hero-c{display:flex;flex-direction:column;padding:14px 14px 6px 0;min-height:200px;position:relative}
.disc .pb{display:flex;flex-direction:column;gap:14px}
.dsc{display:flex;gap:16px;align-items:center}
.dsc .w{font-size:17px}
.mbar{display:flex;flex-direction:column;gap:10px}
.mbar .l{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.mbar .bar{height:6px}
/* "to do now" cards: one per coach order */
.oc{position:relative;border:1px solid var(--line2);border-radius:18px;padding:12px 16px 12px 18px;background:linear-gradient(100deg,rgba(255,255,255,.05),rgba(255,255,255,.012));overflow:hidden}
.oc:before{content:"";position:absolute;inset:12px auto 12px 0;width:3px;border-radius:0 3px 3px 0;background:var(--blue)}
.oc.buy:before{background:var(--up);box-shadow:0 0 12px var(--up)}
.oc.sell:before{background:var(--dn);box-shadow:0 0 12px var(--dn)}
.oc.sl:before{background:var(--gold);box-shadow:0 0 12px var(--gold)}
.oc.fix:before{background:var(--warn);box-shadow:0 0 12px var(--warn)}
.oc.urgent{border-color:rgba(255,107,125,.38);background:linear-gradient(100deg,rgba(255,107,125,.08),rgba(255,255,255,.012))}
.oc-h{display:flex;gap:12px;align-items:center;min-width:0}
.oc-lg{flex:none;display:flex;border-radius:12px}
.oc-lg:hover .slg{transform:scale(1.08)}
.oc-ic{width:40px;height:40px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--goldbg);color:var(--gold)}
.oc-t{min-width:0;line-height:1.35}
.oc-t .l1{display:flex;align-items:center;gap:8px;min-width:0}
.oc-t .l1 b{font-size:17px;letter-spacing:.02em;white-space:nowrap}
.oc-t .l2{font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cd{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13px;color:var(--blue);white-space:nowrap;padding:5px 11px;border-radius:999px;background:var(--bluebg);flex:none}
.urgent .cd{color:var(--dn);background:var(--dnbg)}
.cells{display:flex;gap:8px;margin:10px 0}
.cells>div{flex:1 1 0;background:rgba(0,0,0,.2);border:1px solid var(--line);border-radius:12px;padding:6px 11px;min-width:0;overflow:hidden}
.cells .k{font-size:11.5px;color:var(--mut);white-space:nowrap}
.cells .v{font-size:15px;font-weight:700;white-space:nowrap;line-height:1.4}
.cells .s{display:none}
.oc-f{display:flex;gap:8px;align-items:center}
.oc-note{flex:1;color:var(--ink2);font-size:13.5px}
.hrow{display:grid;grid-template-columns:minmax(0,1fr) auto 64px;gap:10px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line)}
.hl{display:flex;gap:11px;align-items:center;min-width:0;text-align:left}
.hl b{font-size:15px;letter-spacing:.02em}
.hl:hover b{color:var(--gold2)}
.hrow .r{text-align:right;display:flex;flex-direction:column}
.mix{flex:none;padding:10px 18px 14px;border-top:1px solid var(--line);color:var(--ink2)}
.mixb{height:6px;border-radius:999px;background:rgba(126,166,255,.3);overflow:hidden;margin-top:7px}
.mixb i{display:block;height:100%;background:var(--btn);box-shadow:0 0 10px rgba(235,192,98,.5)}
.mix .d{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.mix .d.g{background:var(--gold)}.mix .d.c{background:rgba(126,166,255,.75)}

/* orders */
.v-orders{grid-template-columns:380px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
.prow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 12px;width:100%;text-align:left;padding:9px 12px;border-radius:14px;border:1px solid transparent;align-items:center;transition:background .15s}
.prow>.slg{grid-row:span 2}
.prow:hover{background:rgba(255,255,255,.04)}
.prow.on{background:var(--goldbg);border-color:var(--goldln)}
.prow .sym{font-size:15.5px;letter-spacing:.02em;font-weight:700}
.sy.lg b{font-size:20px;color:var(--gold2)}
.tlr{display:grid;grid-template-columns:62px 48px minmax(0,1fr) minmax(0,1.35fr);gap:12px;align-items:center;padding:10px 2px;border-bottom:1px dashed var(--line)}
.tlr .w{font-size:12.5px;color:var(--mut);line-height:1.35}
.res{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13.5px;min-width:0}
.fr{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--mut)}
.fr b{font-size:19px}

/* journal */
.v-journal{grid-template-columns:minmax(0,1fr) 430px;grid-template-rows:auto auto minmax(0,1fr)}
.jrow{display:grid;grid-template-columns:58px 46px minmax(0,1fr) auto 22px;gap:12px;align-items:center;width:100%;text-align:left;padding:8px 10px;border-radius:14px;border:1px solid transparent;transition:background .15s}
.jrow:hover{background:rgba(255,255,255,.04)}
.jrow.on{background:var(--goldbg);border-color:var(--goldln)}
.jrow .t{font-size:12px;color:var(--mut);line-height:1.3}
.jrow b{letter-spacing:.02em}
.jm{display:flex;gap:10px;align-items:center;min-width:0}
.ed{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;height:100%}
.ed-slip{min-height:0;display:flex;align-items:flex-start}
.ed-info{display:flex;flex-direction:column;gap:10px;min-height:0;font-size:13.5px}
.ed-info .tbl td{padding:6px 8px}

/* portfolio */
.v-port{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);grid-template-rows:auto auto minmax(0,1.05fr) minmax(0,1fr)}
.v-port .phold{grid-area:3/1}.v-port .pclosed{grid-area:4/1}.v-port .palloc{grid-area:3/2}.v-port .phist{grid-area:4/2}
.ctr{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,.9fr) minmax(0,.9fr);gap:10px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line)}
.ctr>.num{text-align:right}
.pth,.ptr{display:grid;grid-template-columns:minmax(150px,1.5fr) minmax(0,.7fr) minmax(0,.75fr) minmax(0,1fr) minmax(0,.85fr) minmax(0,.95fr);gap:10px;align-items:center}
.pth{flex:none;padding:0 20px 6px;font-size:11.5px;color:var(--mut);border-bottom:1px solid var(--line)}
.pth>span:not(:first-child),.ptr>.num{text-align:right}
.ptr{padding:9px 4px;border-bottom:1px solid var(--line)}
.ptr b{font-size:14px}
.ptr .wbar{display:block;height:4px;border-radius:2px;background:rgba(255,255,255,.07);margin:4px 0 2px auto;width:min(100%,90px);overflow:hidden}
.ptr .wbar i{display:block;height:100%;margin-left:auto;background:var(--btn);border-radius:inherit}
.srow,.frow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:9px 2px;border-bottom:1px solid var(--line);font-size:13.5px}

/* login + first visit */
.login{height:100%;display:grid;grid-template-columns:1.1fr 1fr;max-width:1180px;margin:0 auto;padding:28px;gap:56px;align-items:center}
.lg-brand img{height:66px;display:block;margin-bottom:22px}
.lg-brand h1{font-size:62px;line-height:1.04;letter-spacing:-.01em;margin-top:8px}
.lg-brand h1 span{display:block;padding-bottom:4px}
.lg-brand p{color:var(--ink2);font-size:16.5px;max-width:470px;margin:16px 0 24px}
.feat{display:flex;flex-direction:column;gap:14px}
.feat div{display:flex;gap:14px;align-items:flex-start;font-size:14.5px;color:var(--ink2)}
.fi{width:38px;height:38px;border-radius:12px;background:var(--goldbg);color:var(--gold);display:flex;align-items:center;justify-content:center;flex:none;box-shadow:inset 0 0 0 1px rgba(235,192,98,.22)}
.feat b{display:block;color:var(--ink)}
.lg-card{padding:32px 34px 26px;position:relative;overflow:hidden;border-radius:26px}
.lg-card:before{content:"";position:absolute;inset:0 0 auto;height:3px;background:var(--btn)}
.lg-card:after{content:"";position:absolute;width:280px;height:280px;right:-120px;top:-140px;border-radius:50%;background:radial-gradient(closest-side,rgba(235,192,98,.16),transparent);pointer-events:none}
.lg-card h2{font-size:24px;margin:4px 0 2px}
.lg-prev{margin:20px 0 22px;padding:16px 18px;border-radius:18px;background:rgba(0,0,0,.25);border:1px solid var(--line)}
.corner{position:fixed;top:14px;right:16px;z-index:45}
.ob{height:100%;display:flex;align-items:center;justify-content:center;padding:16px}
.ob .card{width:min(780px,100%);padding:26px 30px;border-radius:26px}
.ob-k{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.ob-k div{padding:11px 14px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.ob-k b{display:block;font-size:16px}
.rules{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 16px}
.rule{display:flex;gap:12px;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.035);border:1px solid var(--line);align-items:flex-start}
.rule b{display:block;font-size:14.5px}
.rule span{font-size:13px;color:var(--ink2)}
.agree{display:flex;gap:10px;align-items:center;font-size:14px;cursor:pointer;flex:1;min-width:0}
.ob-f{gap:16px}
.ob .card{max-height:calc(100dvh - 24px);overflow:auto}
.agree input{width:19px;height:19px;accent-color:var(--gold);flex:none}

@media (max-width:1180px){.brand .bt{display:none}.nav button{padding:7px 13px}}
@media (max-width:1100px){
  .v-home{grid-template-columns:minmax(0,1fr) 300px}.hero{grid-template-columns:1fr}.hero-c{display:none}
  .v-journal{grid-template-columns:minmax(0,1fr) 360px}.v-orders{grid-template-columns:320px minmax(0,1fr)}
  .cells .opt{display:none}.ed{grid-template-columns:110px minmax(0,1fr);gap:12px}.ed-info .tbl td{padding:5px 6px}
  .v-port{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}.pth,.ptr{grid-template-columns:minmax(130px,1.4fr) minmax(0,.8fr) minmax(0,1fr) minmax(0,.9fr)}.pth .c2,.ptr .c2,.pth .c3,.ptr .c3{display:none}
  .login{gap:30px}.lg-brand h1{font-size:46px}
}
@media (max-width:900px){.hin .mkt{display:none}}
@media (max-height:700px) and (min-width:761px){
  .hdr{margin-top:8px}.hin{height:54px}.view{padding-top:10px;gap:12px}
  .hero-l{padding:12px 20px 12px}.big{font-size:40px;margin:2px 0 8px}.goal{padding-top:24px}.gtrack{margin-bottom:24px}
  .oc{padding:8px 14px 8px 16px}.cells{margin:6px 0}.cells>div{padding:4px 10px}
}
@media (max-width:760px){
  input,textarea,select{font-size:16px}
  .nav,.mkt,.brand .bt,.demob span{display:none}
  .hdr{width:auto;margin:8px 8px 0;border-radius:16px}
  .hin{height:52px;padding:0 8px 0 12px;gap:6px}.brand img{height:30px}.hr{margin-left:auto}
  .tabbar{display:flex;flex:none;margin:0 8px calc(8px + env(safe-area-inset-bottom));border-radius:20px;background:var(--glass);border:1px solid var(--line);padding:4px;gap:2px;box-shadow:0 -10px 30px -16px rgba(0,0,0,.8)}
  .tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;color:var(--mut);padding:5px 0;position:relative;border-radius:16px}
  .tabbar button.on{color:var(--gold);background:var(--goldbg)}
  .tabbar .n{position:absolute;top:1px;left:calc(50% + 6px)}
  .view{padding:10px 8px;gap:10px}
  .vh{gap:8px}.vh h1{font-size:18px}.vh p{display:none}
  .v-home,.v-orders,.v-journal{display:flex!important;flex-direction:column}
  .v-home .hold,.pdet,.jdet{display:none!important}
  .v-home .todo,.plist,.jlist{flex:1 1 0}.v-home .hero{flex:none}
  .hero-l{padding:14px 16px}.hero-l .eyebrow{display:none}.rl{margin-top:0;font-size:12px}.big{font-size:34px;margin:2px 0 6px}.meta .opt{display:none}.goal{padding-top:24px}.gtrack{margin-bottom:24px}
  .v-home .disc{display:none!important}.meta .mob{display:inline-flex}.meta .tag{font-size:12px;padding:2px 9px}
  .kstrip{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.kstrip .opt{display:none}.kpi{padding:8px 12px}.kpi .v{font-size:17px}
  .cells{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:6px;margin:8px 0}.cells .opt{display:none}
  .oc{padding:10px 12px 10px 14px}.oc-note,.lw{display:none}.oc-f{justify-content:flex-end}.oc-t .l1 b{font-size:16px}
  .v-port .kstrip .opt2{display:none}.pth{display:none}.pth,.ptr{grid-template-columns:minmax(0,1fr) auto auto}.ptr .c4,.ptr .c6{display:none}.pfoot{padding:8px 14px 10px}
  .tlr{grid-template-columns:48px minmax(0,1fr);gap:4px 10px}.tlr .w{display:none}.tlr .res{grid-column:1/-1}
  .mgrid{grid-template-columns:1fr;gap:10px}.mside{order:-1}
  .ed{grid-template-columns:110px minmax(0,1fr)}
  .modal{align-items:flex-end;padding:0}.mbox{border-radius:22px 22px 0 0;max-height:100dvh}
  .login{grid-template-columns:1fr;gap:18px;padding:18px;align-content:center}
  .lg-brand img{height:46px;margin-bottom:10px}.lg-brand h1{font-size:38px}.lg-brand p{font-size:14.5px;margin:8px 0 0}.feat,.lg-prev{display:none}
  .lg-card{padding:22px 20px}
  .ob-k{grid-template-columns:1fr 1fr}.ob-k div:last-child{display:none}
  .rules{grid-template-columns:1fr;gap:6px}.rule{padding:8px 12px}.rule span{display:none}.ob-f{flex-wrap:wrap}.ob-f .btn{margin-left:auto}
  .ob .card{padding:18px}
  #toasts{left:10px;right:10px;bottom:84px}
}
</style>

/* Port 1M mockup: data and helpers shared by the client journal and the back office.
   Both pages keep one dataset in localStorage (KEY), so an order a coach sends shows up
   on the client's journal and the client's fills land in the coach's queue.
   Everything typed by a user is validated on the way in and escaped on the way out. */

const KEY = 'p1m-mockup-v4';
const GOAL = 1000000;
const TZ = 7 * 3600e3, DAY = 86400e3, HR = 3600e3, MIN = 60e3;
const BASE = Date.UTC(2026, 9, 7, 3, 42);   // พ. 7 ต.ค. 2569 10:42 เวลาไทย = "ตอนนี้" ของเดโม
const COURSE_START = Date.UTC(2026, 6, 1);  // 1 ก.ค. 2569
// SET market holidays 2569, from set.or.th (ปฏิทินวันหยุด ตลท.)
const HOLIDAYS = ['2026-01-01', '2026-01-02', '2026-03-03', '2026-04-06', '2026-04-13', '2026-04-14', '2026-04-15', '2026-05-01', '2026-05-04', '2026-06-01', '2026-06-03',
  '2026-07-28', '2026-07-29', '2026-08-12', '2026-10-13', '2026-10-16', '2026-10-23', '2026-12-07', '2026-12-10', '2026-12-31'];
const FEATURED = 'u01';                      // ลูกค้าตัวอย่างที่ใช้ในหน้าบ้าน
const MARKET_CLOSE = [16, 30];
const STAFF_IDLE = 30 * MIN;                 // หลังบ้านออกจากระบบเองเมื่อไม่ใช้งาน

/* ---------- format ---------- */
const TH_M = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
const TH_D = ['อา.', 'จ.', 'อ.', 'พ.', 'พฤ.', 'ศ.', 'ส.'];
const TH_DAY = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์'];
const pad = n => String(n).padStart(2, '0');
const fmt = (n, d = 0) => Number(n).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const px = n => fmt(n, 2);
const baht = n => fmt(Math.round(n));
const sgn = n => (n > 0 ? '+' : n < 0 ? '−' : '');
const signed = n => sgn(n) + baht(Math.abs(n));
const pct = (n, d = 1) => sgn(n) + fmt(Math.abs(n * 100), d) + '%';
const kb = n => n >= 1e6 ? fmt(n / 1e6, n % 1e6 ? 2 : 0) + 'M' : n >= 1e3 ? fmt(n / 1e3, n % 1e3 ? 1 : 0) + 'K' : fmt(n);
const tz = ms => new Date(ms + TZ);
const dstr = ms => { const d = tz(ms); return d.getUTCDate() + ' ' + TH_M[d.getUTCMonth()]; };
const tstr = ms => { const d = tz(ms); return pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes()); };
const dt = ms => dstr(ms) + ' ' + tstr(ms);
const wd = ms => TH_D[tz(ms).getUTCDay()];
const dlong = ms => { const d = tz(ms); return `${TH_DAY[d.getUTCDay()]} ${d.getUTCDate()} ${TH_M[d.getUTCMonth()]} ${String(d.getUTCFullYear() + 543).slice(2)}`; };
const dayKey = ms => Math.floor((ms + TZ) / DAY);
const esc = s => String(s ?? '').replace(/[&<>"'`]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;', '`': '&#96;' }[c]));
function when(ms, now) {
  const diff = now - ms;
  if (dayKey(ms) === dayKey(now)) {
    if (diff < MIN) return 'เมื่อสักครู่';
    if (diff < HR) return Math.floor(diff / MIN) + ' นาทีที่แล้ว';

}
function stBadge(o, t, at = now()) {

/* alerts for the coach (orders) and CS (engagement); computed, never stored */
function alerts(at) {
  const calc = () => {
    const tnow = at ?? now(), out = [], lf = lastFriday();
    for (const c of S.clients) {
      for (const { o, t } of targetsOf(c.id)) {
        if (tStatus(o, t, tnow) !== 'pend' || tnow - o.at < 40 * MIN) continue;
        out.push({ k: `pend:${o.id}:${c.id}`, sev: o.until - tnow < 90 * MIN ? 'high' : 'mid', aud: 'coach', type: 'pend', cl: c.id, coach: c.coach, at: o.at, order: o.id, sym: o.sym, title: `ยังไม่ดำเนินการตามแผน${verb(o)} ${o.sym}`, detail: `ส่งแผนแล้ว ${dur(tnow - o.at)} · ${left(o.until, tnow)}` });
      }
      for (const p of openPos(c.id)) {
        if (!p.plan) continue;
        if (p.closedByCoach) {
          const co = S.orders.filter(o => o.plan === p.plan && o.kind === 'close').pop();
          out.push({ k: `hold:${p.plan}:${c.id}`, sev: 'high', aud: 'coach', type: 'hold', cl: c.id, coach: c.coach, at: co.until, sym: p.sym, title: `ยังไม่ขาย ${p.sym} ตามแผน`, detail: `แผนให้ขายเมื่อ ${dstr(co.at)} · ราคาล่าสุด ${px(p.last)} · ${p.last >= p.avg ? 'กำไร' : 'ขาดทุน'} ${pct((p.last - p.avg) / p.avg)}` });
        } else if (p.sl && p.last <= p.sl) {
          out.push({ k: `sl:${p.plan}:${c.id}`, sev: 'high', aud: 'coach', type: 'sl', cl: c.id, coach: c.coach, at: tnow, sym: p.sym, title: `${p.sym} ต่ำกว่าจุดตัดขาดทุนแล้ว แต่ยังไม่ขาย`, detail: `ราคาล่าสุด ${px(p.last)} · จุดตัดขาดทุน ${px(p.sl)}` });
        }
      }
      for (const e of S.execs) {
        if (e.cl === c.id && !e.order && e.ver === 'pend') out.push({ k: `off:${e.id}`, sev: 'mid', aud: 'coach', type: 'off', cl: c.id, coach: c.coach, at: e.at, ex: e.id, sym: e.sym, title: `รายการนอกแผน: ${e.side === 'buy' ? 'ซื้อ' : 'ขาย'} ${e.sym} ${fmt(e.qty)} หุ้น`, detail: 'เหตุผล: ' + (e.why || '—') });
      }
      for (const f of c.flows) if (f.pend) out.push({ k: `flow:${f.id}`, sev: 'mid', aud: 'cs', type: 'flow', cl: c.id, coach: c.coach, at: f.at, flow: f.id, title: `แจ้ง${f.amt > 0 ? 'ฝาก' : 'ถอน'}เงิน ${baht(Math.abs(f.amt))} บาท รอการอนุมัติ`, detail: 'ตรวจสอบหลักฐานการโอนก่อนนับเข้าพอร์ต' });
      const seen = c.seen || c.joined;
      if (tnow - seen > 72 * HR) out.push({ k: `idle:${c.id}:${seen}`, sev: tnow - seen > 5 * DAY ? 'high' : 'mid', aud: 'cs', type: 'idle', cl: c.id, coach: c.coach, at: seen, title: c.seen ? `ไม่ได้เข้าใช้งาน ${Math.floor((tnow - seen) / DAY)} วัน` : `ยังไม่เคยเข้าใช้งาน (${Math.floor((tnow - seen) / DAY)} วัน)`, detail: c.seen ? 'อาจมีแผนจากโค้ชค้างอยู่ ควรโทรติดตาม' : 'ช่วยลูกค้าเข้าสู่ระบบครั้งแรกด้วย Gmail ที่ลงทะเบียนไว้' });
      const sn = S.snaps.find(s => s.cl === c.id && s.day === lf);
      if (!sn && S.days[lf] + 17 * HR - TZ > c.joined) out.push({ k: `nosnap:${c.id}:${lf}`, sev: 'mid', aud: 'cs', type: 'nosnap', cl: c.id, coach: c.coach, at: S.days[lf] + 17 * HR, title: `ยังไม่รายงานยอดพอร์ตวันศุกร์ที่ ${dstr(S.days[lf])}`, detail: 'ต้องรายงานยอดพอร์ตพร้อมภาพหน้าพอร์ตทุกวันศุกร์หลังตลาดปิด' });
      else if (sn) {
        const diff = (sn.val - c.eq[sn.day]) / c.eq[sn.day];
        if (Math.abs(diff) > .02) out.push({ k: `diff:${c.id}:${sn.id}`, sev: 'mid', aud: 'cs', type: 'diff', cl: c.id, coach: c.coach, at: sn.at, title: `ยอดพอร์ตที่รายงานต่างจากบันทึก ${pct(diff)}`, detail: `รายงาน ${baht(sn.val)} · ตามบันทึก ${baht(c.eq[sn.day])} · อาจมีรายการซื้อขายที่ยังไม่ได้บันทึก` });
      }
      const bk = portBook(c);
      if (bk.heat > HEAT_LIMIT) out.push({ k: `heat:${c.id}:${dayKey(tnow)}`, sev: 'mid', aud: 'coach', type: 'heat', cl: c.id, coach: c.coach, at: tnow, title: `ความเสี่ยงรวมของพอร์ต ${fmt(bk.heat * 100, 1)}% เกินเกณฑ์ 6%`, detail: `หากทุกตัวถึงจุดตัดขาดทุน จะขาดทุน ฿${baht(bk.risk)} · ควรลดสัดส่วนหรือปรับจุดตัดขาดทุน` });
      const d = discipline(c.id, at);
      if (d.score < 75) out.push({ k: `score:${c.id}:${dayKey(tnow)}`, sev: d.score < 65 ? 'high' : 'mid', aud: 'cs', type: 'score', cl: c.id, coach: c.coach, at: tnow, title: `คะแนนวินัย ${d.score} ต่ำกว่าเกณฑ์`, detail: `ดำเนินการตามแผน ${Math.round(d.follow * 100)}% · ตรงแผน ${Math.round(d.acc * 100)}% · รายการนอกแผน ${d.off} ครั้ง` });
      const dd = drawdown(c);
      if (dd.now > .1) out.push({ k: `dd:${c.id}`, sev: 'high', aud: 'both', type: 'dd', cl: c.id, coach: c.coach, at: tnow, title: `พอร์ตลดลง ${pct(-dd.now)} จากจุดสูงสุด`, detail: 'มูลค่าประมาณการลดลงเกินเกณฑ์ 10% ควรทบทวนสัดส่วนการลงทุนและการบริหารความเสี่ยง' });
    }
    const sevN = { high: 0, mid: 1, low: 2 };
    return out.filter(a => !S.done[a.k]).sort((a, b) => sevN[a.sev] - sevN[b.sev] || b.at - a.at);
  };
  return at == null ? memo('alerts', calc) : calc();
}

/* ---------- fit-to-screen paging: long lists flip pages instead of scrolling ---------- */
const PG = {}, PGN = {};
function fitPagers(root = document) {
  $$('[data-pg]', root).forEach(box => {
    const key = box.dataset.pg, rows = [...box.children];
    if (!box.offsetParent && !box.getClientRects().length) return;   // panel hidden behind a tab
    const area = box.closest('.pb') || box.parentElement;
    const limit = () => area.getBoundingClientRect().bottom - (parseFloat(getComputedStyle(area).paddingBottom) || 0);
    const gap = parseFloat(getComputedStyle(box).rowGap) || 0;
    const nav = document.querySelector(`[data-pgn="${key}"]`);
    const setNav = () => { if (nav) nav.innerHTML = n > 1 ? `<button data-pgp="${key}" ${p ? '' : 'disabled'} aria-label="หน้าก่อน">${ic('back', 15)}</button><span class="num">${p + 1}/${n}</span><button data-pgx="${key}" ${p < n - 1 ? '' : 'disabled'} aria-label="หน้าถัดไป">${ic('chev', 15)}</button>` : ''; };
    let pages, n, p, slack = 0;
    // the page buttons and table re-flow can change the room left, so check the page really fits and re-split if not
    for (let tries = 0; tries < 4; tries++) {
      rows.forEach(r => { r.hidden = false; });
      const avail = limit() - box.getBoundingClientRect().top - slack;
      pages = [];
      let cur = [], used = 0;
      for (const r of rows) {
        const h = r.getBoundingClientRect().height;
        if (cur.length && used + h > avail + .5) { pages.push(cur); cur = []; used = 0; }
        cur.push(r); used += h + gap;
      }
      if (cur.length) pages.push(cur);
      n = Math.max(1, pages.length); p = Math.max(0, Math.min(PG[key] || 0, n - 1));
      rows.forEach(r => { r.hidden = true; });
      (pages[p] || []).forEach(r => { r.hidden = false; });
      setNav();
      const over = box.getBoundingClientRect().bottom - limit();
      if (over <= .5 || (pages[p] || []).length < 2) break;
      slack += over;
    }
    PG[key] = p; PGN[key] = n;
  });
}
function pageTo(key, d) { const n = PGN[key] || 1, p = Math.max(0, Math.min((PG[key] || 0) + d, n - 1)); if (p === PG[key]) return; PG[key] = p; fitPagers(); }
// jump a pager to the page that holds a given row
function pageOf(key, sel) {
  const box = $(`[data-pg="${key}"]`); if (!box || !$(sel, box)) return;
  for (let i = 0; i < (PGN[key] || 1); i++) { PG[key] = i; fitPagers(); if (!$(sel, box).hidden) return; }
}
document.addEventListener('click', e => {
  const p = e.target.closest('[data-pgp],[data-pgx]'); if (!p) return;
  e.stopPropagation();
  pageTo(p.dataset.pgp || p.dataset.pgx, p.dataset.pgp ? -1 : 1);
}, true);
// the mouse wheel flips pages too, so nothing needs a scrollbar
let wheelAt = 0;
document.addEventListener('wheel', e => {
  if ($('#modal')?.innerHTML) return;
  const box = e.target.closest?.('.pb')?.querySelector('[data-pg]'); if (!box || (PGN[box.dataset.pg] || 1) < 2) return;
  if (Date.now() - wheelAt < 380 || Math.abs(e.deltaY) < 8) return;
  wheelAt = Date.now(); pageTo(box.dataset.pg, e.deltaY > 0 ? 1 : -1);
}, { passive: true });
// narrow screens: show one panel at a time with tabs on top
const PT = {};
function panelTabs(root, narrow) {
  $$('.vgrid', root).forEach(g => {
    const ps = [...g.children].filter(c => c.dataset.pt);

// accept only real images up to 8 MB; re-drawing on a canvas drops EXIF (location) data
function readImage(file) {
  return new Promise((res, rej) => {
    if (!file || !IMG_TYPES.includes(file.type)) return rej(new Error('รองรับเฉพาะไฟล์ภาพ PNG, JPG, WEBP'));
    if (file.size > 8 * 1024 * 1024) return rej(new Error('ไฟล์ใหญ่เกิน 8 MB'));
    const fr = new FileReader();
    fr.onerror = () => rej(new Error('อ่านไฟล์ไม่ได้'));
    fr.onload = () => {
      const im = new Image();
      im.onerror = () => rej(new Error('ไฟล์นี้ไม่ใช่ภาพที่เปิดได้'));
      im.onload = () => { const s = Math.min(1, 720 / Math.max(im.width, im.height)), cv = document.createElement('canvas'); cv.width = Math.max(1, im.width * s); cv.height = Math.max(1, im.height * s); cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height); res(cv.toDataURL('image/jpeg', .72)); };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* ---------- coach orders, grouped by trade ---------- */
function planList() {
  const me = ME(), n = now();
  return [...new Set(targetsOf(me.id).filter(({ o }) => o.at <= n).map(({ o }) => o.plan))].map(pl => {
    const os = S.orders.filter(o => o.plan === pl && o.tg[me.id] && o.at <= n).sort((a, b) => a.at - b.at), pos = positions(me.id).find(p => p.plan === pl);
    const waiting = os.some(o => tStatus(o, o.tg[me.id], n) === 'pend');
    return { pl, os, pos, waiting, state: pos ? (pos.qty > 0 ? 'hold' : 'closed') : waiting ? 'wait' : 'none', last: os[os.length - 1].at };
  }).sort((a, b) => (b.waiting - a.waiting) || b.last - a.last);
}

function slipField(label = 'ภาพหลักฐานจากแอปซื้อขาย', hint = 'ต้องแสดงชื่อหุ้น จำนวน ราคา และเวลา') {

function wireSlip(box, onChange, mk) {

  const pickFile = () => $('#file', box).click();
  $('#drop', box).addEventListener('click', e => { if (!e.target.closest('[data-act=mockslip]')) pickFile(); });
  $('#drop', box).addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pickFile(); } });
  $('#file', box).addEventListener('change', async e => {
    try { const img = await readImage(e.target.files[0]); set({ img }, `<img src="${img}" alt="">`); }
    catch (err) { toast(`${ic('alert', 18)}<div><b>แนบภาพไม่สำเร็จ</b><div class="muted sm">${esc(err.message)}</div></div>`, 'err'); }

/* ---------- demo helpers ---------- */
function simOrder() {
  const n = now(), mine = S.clients.filter(c => c.coach === 'c1');
  const p1closed = S.orders.some(o => o.plan === 'c1-P1' && o.kind === 'close'), p1sym = planOpen('c1-P1').sym;
  let o;
  if (!p1closed) {
    o = { id: nid('o'), plan: 'c1-P1', coach: 'c1', kind: 'close', sym: p1sym, pct: 100, ref: rt(S.prices[p1sym]), at: n, until: Math.max(n + 90 * MIN, thAt(n, ...MARKET_CLOSE)), note: 'ราคาใกล้ถึงเป้าหมายที่สองและแรงซื้อเริ่มอ่อนตัว ให้ขายส่วนที่เหลือทั้งหมดและปิดสถานะ', tg: {} };
    for (const c of mine) { const h = positions(c.id).find(p => p.plan === 'c1-P1'); if (h && h.qty > 0) o.tg[c.id] = { st: 'pend', qty: h.qty }; }
  } else {
    const last = S.prices.PTT, hi = rt(last * 1.004);
    o = { id: nid('o'), plan: 'c1-' + nid('p'), coach: 'c1', kind: 'open', sym: 'PTT', lo: rt(last * .99), hi, sl: rt(hi * .955), tp1: rt(hi * 1.07), tp2: rt(hi * 1.12), size: 15, at: n, until: Math.max(n + 120 * MIN, thAt(n, ...MARKET_CLOSE)), note: `ราคาฟื้นตัวจากแนวรับ ${px(rt(last * .97))} พร้อมปริมาณการซื้อขายที่เพิ่มขึ้น ให้ซื้อในช่วงราคาที่กำหนดเท่านั้น`, tg: {} };
    for (const c of mine) o.tg[c.id] = { st: 'pend', qty: lot(eqNow(c) * o.size / 100 / o.hi) };
  }
  S.orders.push(o);
  pushFeed({ by: 'coach', who: 'c1', coach: 'c1', kind: 'order', order: o.id, text: `${coach('c1').name} ส่งแผน${verb(o)} ${o.sym}` });
  if (!save()) return;
  go('home');
  toast(`${ic('send', 18)}<div><b>${coach('c1').name} ส่งแผนใหม่</b><div class="muted sm">${verb(o)} ${esc(o.sym)} · ${left(o.until, n)}</div></div>`);
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]');
  if (g) { if (signedIn()) go(g.dataset.go); return; }
  const tb = e.target.closest('[data-tab]'); if (tb) { ordTab = tb.dataset.tab; selPlan = null; PG.plans = 0; PG.tl = 0; return render(); }
  const jf = e.target.closest('[data-jf]'); if (jf) { jFilter = jf.dataset.jf; selEx = null; PG.jl = 0; return render(); }
  const pt = e.target.closest('[data-ptk]'); if (pt) { PT[pt.dataset.ptk] = pt.dataset.ptv; return render(); }
  const pr = e.target.closest('[data-plan]');
  if (pr) { if (selPlan !== pr.dataset.plan) PG.tl = 0; selPlan = pr.dataset.plan; return narrow() ? openModal(planDetail(selPlan, 'modal'), 'mid') : render(); }
  const ex = e.target.closest('[data-ex]');
  if (ex) { selEx = ex.dataset.ex; return narrow() ? openModal(execDetail(selEx, true), 'mid') : render(); }
  const a = e.target.closest('[data-act]');
  if (!a) { if (menu && !e.target.closest('.menu')) { menu = null; render(); } return; }
  const act = a.dataset.act;
  if (act === 'close') return closeModal();
  if (act === 'menu') { menu = menu === a.dataset.m ? null : a.dataset.m; return render(); }
  if (act === 'mockslip') return;
  if (act !== 'linkline') menu = null;
  if (act === 'glogin') return googleChooser([{ name: 'ณัฐธิดา ก.', email: 'natthida.demo@gmail.com', color: '#c2185b' }, { name: 'Natthida K.', email: 'natthida.home@gmail.com', color: '#00796b' }], acc => {
    // only e-mails CS registered may enter (the server checks the verified Google e-mail)
    if (acc.email !== ME().email) return 'อีเมลนี้ยังไม่ได้ลงทะเบียนกับคอร์ส โปรดใช้ Gmail ที่แจ้งไว้ตอนสมัคร หรือติดต่อทีม CS';
    sessionStorage.setItem('p1m-fe', '1'); ME().seen = now();
    pushFeed({ by: 'client', who: FEATURED, cl: FEATURED, coach: ME().coach, kind: 'login', text: `${cname(ME())} เข้าสู่ระบบ` });
    save(); closeModal(); render();
  }, 'ปั้นพอร์ต 1 ล้าน');
  if (act === 'linkline') { ME().line = !ME().line; save(); return render(); }
  if (act === 'startapp') { if (!agree) return; ME().ob = true; ME().consent = now(); save(); go('home'); return toast(`${ic('check', 18)}<div><b>เข้าสู่ระบบแล้ว</b><div class="muted sm">มีแผนจากโค้ชรอดำเนินการ ${pending().length} รายการ</div></div>`, 'ok'); }
  if (act === 'logout') { pushFeed({ by: 'client', who: FEATURED, cl: FEATURED, kind: 'logout', text: `${cname(ME())} ออกจากระบบ` }); save(); sessionStorage.removeItem('p1m-fe'); return render(); }
  if (act === 'reset') { resetData(); sessionStorage.removeItem('p1m-fe'); agree = false; view = 'home'; render(); return toast('รีเซ็ตข้อมูลตัวอย่างแล้ว'); }
  if (act === 'simorder') return simOrder();
  if (act === 'log') return logModal(a.dataset.o);
  if (act === 'skip') return skipModal(a.dataset.o);
  if (act === 'off') return offModal();
  if (act === 'snap') return snapModal();
  if (act === 'fix') return fixModal(a.dataset.id);
  if (act === 'flow') return flowModal();
  if (act === 'slip') return slipModal(a.dataset.id);
  if (act === 'scoreinfo') return scoreInfo();
  if (act === 'estinfo') return estInfo();
  if (act === 'rules') { render(); return rulesModal(); }
  if (act === 'cs') { render(); return toast(`${ic('phone', 18)}<div><b>ติดต่อ CS</b><div class="muted sm">ระบบจริงจะเปิดแชต LINE กับทีม CS</div></div>`); }
  if (act === 'line') { render(); return toast(`${ic('chat', 18)}<div><b>เปิด LINE</b><div class="muted sm">ระบบจริงจะเปิดห้องแชตกับ${coach(ME().coach).name}</div></div>`); }
});
document.addEventListener('change', e => { if (e.target.id === 'agree') { agree = e.target.checked; $('#startBtn').disabled = !agree; } });

// the back office writes to the same storage; pick up its changes
window.addEventListener('storage', e => {
  if (e.key !== KEY) return;
  const seen = new Set(S.feed.map(f => f.id));
  S = load();
  if (!signedIn()) return render();
  S.feed.filter(f => !seen.has(f.id) && f.by === 'coach' && ['order', 'cancel', 'verify'].includes(f.kind) && (f.kind === 'verify' ? f.cl === FEATURED : f.coach === ME().coach && order(f.order)?.tg[FEATURED]))
    .forEach(f => toast(`${ic(f.kind === 'order' ? 'send' : f.kind === 'cancel' ? 'ban' : 'chat', 18)}<div><b>${esc(f.text)}</b>${f.kind === 'order' ? '<div class="muted sm">ดูที่ "ต้องทำตอนนี้"</div>' : ''}</div>`));
  if (!$('#modal').innerHTML) render();
});
let rz;
addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (!$('#modal').innerHTML) render(); }, 150); });
setInterval(() => { if (!$('#modal').innerHTML && signedIn() && !menu) render(); }, 30000);
