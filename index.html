function toast(html, kind = '') {
  const t = document.createElement('div'); t.className = 'toast ' + kind; t.setAttribute('role', 'status'); t.innerHTML = html;
  const box = $('#toasts'); box.appendChild(t);
  while (box.children.length > 3) box.firstChild.remove();
  setTimeout(() => { t.style.transition = 'opacity .4s'; t.style.opacity = 0; setTimeout(() => t.remove(), 400); }, 5000);
}
document.addEventListener('keydown', e => {
  if (!$('#modal')?.innerHTML) return;
  if (e.key === 'Escape') return closeModal();
  // keep keyboard focus inside an open dialog
  if (e.key === 'Tab') {
    const f = $$('#modal button:not([disabled]),#modal input:not([type=file]),#modal textarea,#modal select,#modal a[href]').filter(x => x.offsetParent);
    if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
  }
});

// profit at the close of trading day i (deposits and withdrawals taken out), and the change since
// the month began and since last Friday's close
const profitAt = (c, i) => i < 0 ? 0 : c.eq[i] - c.cap - netFlowAt(c, S.days[i] + DAY - TZ);
function periodPL(c) {
  const T = T_(), d = tz(now()), m0 = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1), pr = profit(c);
  let im = -1, iw = -1;
  for (let i = 0; i < T; i++) { if (S.days[i] < m0) im = i; if (new Date(S.days[i]).getUTCDay() === 5) iw = i; }
  return { month: pr - profitAt(c, im), week: pr - profitAt(c, iw), m: d.getUTCMonth(), y: d.getUTCFullYear(), fri: iw >= 0 ? S.days[iw] : null };
}

  let base = 0;
  const all = ends.map((x, j) => { const last = j === ends.length - 1, pr = last ? profit(c) : profitAt(c, x.i), v = pr - base; base = pr; return { m: x.m, v, now: last, end: S.days[x.i] }; })
    .filter(x => x.end + DAY - TZ >= c.joined).slice(-6);

function slipField(label, hint) {

function wireSlip(box, onChange, mk) {
  let slip = null;
  const set = (s, html) => { slip = s; $('#drop', box).classList.add('has'); $('#dropTh', box).innerHTML = html; $('#dropTx', box).innerHTML = '<b class="up">แนบภาพแล้ว</b>'; onChange(); };
  const pickFile = () => $('#file', box).click();
  $('#drop', box).addEventListener('click', e => { if (!e.target.closest('[data-act=mockslip]')) pickFile(); });
  $('#drop', box).addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pickFile(); } });
  $('#file', box).addEventListener('change', async e => {
    try { const img = await readImage(e.target.files[0]); set({ img }, `<img src="${img}" alt="">`); }
    catch (err) { toast(`${ic('alert', 18)}<div><b>แนบภาพไม่สำเร็จ</b><div class="muted sm">${esc(err.message)}</div></div>`, 'err'); }
  });
  box.querySelector('[data-act=mockslip]').addEventListener('click', e => { e.stopPropagation(); const m = mk(); set({ m: 1, mock: m }, slipSvg(m, ME())); });
  return () => slip;
}

// the money-back terms from the program announcement, with where the client stands today

  const me = ME(), st = settle(me);
  const rows = [['ขาดทุน หรือไม่มีกำไร', 'คืนเต็มจำนวน ฿1,000,000'], ['กำไร ฿300,000', 'คืน ฿700,000'], ['กำไร ฿1,000,000 ขึ้นไป', 'ไม่มีเงินคืน · กำไรส่วนที่เกินเป็นของคุณทั้งหมด']];
  openModal(mhead('เงื่อนไขค่าเรียน', `ค่าเรียน ฿${baht(TUITION)}`) + `<div class="mbd" style="display:flex;flex-direction:column;gap:12px">
    <div class="note-box g">${ic('trophy', 16)}<span>เมื่อจบโปรแกรม คืนค่าเรียน <b>1,000,000 − กำไรที่ทำได้</b> ค่าเรียนจึงมาจากกำไรเท่านั้น ถ้าไม่มีกำไรก็ได้คืนทั้งหมด และถ้ากำไรเกิน 1 ล้าน ส่วนที่เกินเป็นของคุณ</span></div>
    <table class="tbl"><thead><tr><th>กำไรเมื่อจบโปรแกรม</th><th class="r">ค่าเรียนที่ได้คืน</th></tr></thead><tbody>${rows.map(([a, b]) => `<tr><td>${a}</td><td class="r">${b}</td></tr>`).join('')}
      <tr class="me"><td><b>ของคุณ ณ วันนี้ <span class="num ${st.pr >= 0 ? 'up' : 'dn'}">${signed(st.pr)}</span></b></td><td class="r num"><b class="gold">${st.extra > 0 ? `ไม่มีเงินคืน · ส่วนเกิน ${signed(st.extra)}` : '฿' + baht(st.refund)}</b></td></tr></tbody></table>
    <div class="xs muted">กำไรคำนวณจากบันทึกการซื้อขาย (Realized + Unrealized ณ ราคาปิด) ไม่รวมเงินฝาก/ถอน · ตัวเลขวันนี้เป็นการประมาณการ ยอดจริงคำนวณ ณ วันจบโปรแกรม</div></div>`, 'sm');
}

/* ---------- demo helper: the coach confirms what the client keyed ---------- */
function simVerify() {
  const co = coach(ME().coach), list = pendOf(FEATURED); if (!list.length) return;
  list.forEach(e => Object.assign(e, { ver: 'ok', vby: co.id, vat: now() }));
  pushFeed({ by: 'coach', who: co.id, coach: co.id, cl: FEATURED, kind: 'vok', text: `${co.name} ตรวจรายการของ${ME().name} ${list.length} รายการ` });
  if (!save()) return;
  render();
  toast(`${ic('check', 18)}<div><b>${co.name} ตรวจรายการแล้ว</b><div class="muted sm">${list.length} รายการ · ${list.map(e => esc(e.sym)).join(', ')}</div></div>`, 'ok');
}

// Ctrl+K: pages, what I traded, actions and every stock
const showSym = s => { jSym = s; jFrom = jTo = ''; selEx = null; PG.jl = 0; go('journal'); };
cmdItems = () => !signedIn() || !ME().ob ? [] : [
  ...NAV.map(([k, l, i]) => ({ g: 'ไปที่หน้า', t: l, ic: i, run: () => go(k) })),
  ...[...new Set(execsOf(FEATURED).map(e => e.sym))].map(s => { const p = openPos(FEATURED).find(x => x.sym === s); return { g: 'รายการซื้อขายของฉัน', t: s, s: p ? `ถืออยู่ ${fmt(p.qty)} ${unitOf(p)}` : 'ปิดสถานะแล้ว', k: 'journal trade', sym: s, run: () => showSym(s) }; }),
  { g: 'ทำรายการ', t: 'บันทึกรายการซื้อขาย', ic: 'plus', k: 'key record บันทึก แนบภาพ', run: keyNew },
  { g: 'ทำรายการ', t: 'รายงานยอดพอร์ตประจำสัปดาห์', ic: 'wallet', k: 'snapshot ยอด', run: snapModal },
  { g: 'ทำรายการ', t: 'แจ้งฝาก/ถอนเงิน', ic: 'wallet', k: 'deposit withdraw', run: flowModal },
  { g: 'ทำรายการ', t: 'เงื่อนไขค่าเรียน', ic: 'trophy', k: 'refund tuition คืนเงิน', run: termsModal },
  { g: 'ทำรายการ', t: 'คำศัพท์การเทรด', ic: 'help', k: 'glossary stop loss take profit entry', run: glossaryModal },
  { g: 'ทำรายการ', t: themeNow() === 'light' ? 'เปลี่ยนเป็นธีมมืด' : 'เปลี่ยนเป็นธีมสว่าง', ic: themeNow() === 'light' ? 'moon' : 'sun', k: 'theme dark light ธีม', run: () => setTheme(themeNow() === 'light' ? 'dark' : 'light') },
  ...stockItems(),
];

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]');
  if (g) { if (signedIn()) go(g.dataset.go); return; }
  const pt = e.target.closest('[data-ptk]'); if (pt) { PT[pt.dataset.ptk] = pt.dataset.ptv; return render(); }
  const js = e.target.closest('[data-jsym]'); if (js && !e.target.closest('[data-stock]')) return showSym(js.dataset.jsym);
  const ex = e.target.closest('[data-ex]');
  if (ex && !e.target.closest('[data-act]')) {
    selEx = ex.dataset.ex; menu = null;
    if (view !== 'journal' || !jList().some(x => x.id === selEx)) { jFrom = jTo = jSym = ''; go('journal'); pageOf('jl', `[data-ex="${CSS.escape(selEx)}"]`); }
    else render();
    if (narrow()) openModal(execDetail(selEx, true), 'mid');
    return;
  }
  const a = e.target.closest('[data-act]');
  if (!a) { if (menu && !e.target.closest('.menu')) { menu = null; render(); } return; }
  const act = a.dataset.act;
  if (act === 'close') return closeModal();
  if (act === 'menu') { menu = menu === a.dataset.m ? null : a.dataset.m; return render(); }
  if (act === 'mockslip') return;
  if (act === 'jdate') { const i = $('#j' + a.dataset.k); try { i.showPicker(); } catch { i.focus(); } return; }
  if (act !== 'linkline') menu = null;
  if (act === 'glogin') return googleChooser([{ name: 'ณัฐธิดา ก.', email: 'natthida.demo@gmail.com', color: '#c2185b' }, { name: 'Natthida K.', email: 'natthida.home@gmail.com', color: '#00796b' }], acc => {
    // only e-mails CS registered may enter (the server checks the verified Google e-mail)
    if (acc.email !== ME().email) return 'อีเมลนี้ยังไม่ได้ลงทะเบียนกับโปรแกรม โปรดใช้ Gmail ที่แจ้งไว้ตอนสมัคร หรือติดต่อทีม CS';
    sessionStorage.setItem('p1m-fe', '1'); ME().seen = now();
    pushFeed({ by: 'client', who: FEATURED, cl: FEATURED, coach: ME().coach, kind: 'login', text: `${cname(ME())} เข้าสู่ระบบ` });
    save(); closeModal(); render();
  }, 'ปั้นพอร์ต 1 ล้าน');
  if (act === 'linkline') { ME().line = !ME().line; save(); return render(); }
  if (act === 'startapp') { if (!agree) return; ME().ob = true; ME().consent = now(); save(); go('home'); return toast(`${ic('check', 18)}<div><b>เข้าสู่ระบบแล้ว</b><div class="muted sm">กำไรสะสมตามบันทึก ${signed(profit(ME()))} บาท</div></div>`, 'ok'); }
  if (act === 'logout') { pushFeed({ by: 'client', who: FEATURED, cl: FEATURED, kind: 'logout', text: `${cname(ME())} ออกจากระบบ` }); save(); sessionStorage.removeItem('p1m-fe'); return render(); }
  if (act === 'reset') { resetData(); sessionStorage.removeItem('p1m-fe'); agree = false; view = 'home'; jFrom = jTo = jSym = ''; render(); return toast('รีเซ็ตข้อมูลตัวอย่างแล้ว'); }
  if (act === 'simrec') return simVerify();
  if (act === 'key') { render(); return keyNew(); }
  if (act === 'kedit') return keyEdit(a.dataset.id);
  if (act === 'jclear') { jFrom = jTo = jSym = ''; selEx = null; PG.jl = 0; return render(); }
  if (act === 'snap') { render(); return snapModal(); }
  if (act === 'flow') return flowModal();
  if (act === 'slip') return slipModal(a.dataset.id);
  if (act === 'scoreinfo') return scoreInfo();
  if (act === 'recinfo') return recInfo();
  if (act === 'terms') { render(); return termsModal(); }
  if (act === 'rules') { render(); return rulesModal(); }
  if (act === 'cs') { render(); return toast(`${ic('phone', 18)}<div><b>ติดต่อ CS</b><div class="muted sm">ระบบจริงจะเปิดแชต LINE กับทีม CS</div></div>`); }
  if (act === 'line') { render(); return toast(`${ic('chat', 18)}<div><b>เปิด LINE</b><div class="muted sm">ระบบจริงจะเปิดห้องแชตกับ${coach(ME().coach).name}</div></div>`); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'agree') { agree = e.target.checked; $('#startBtn').disabled = !agree; return; }
  if (e.target.id === 'jfrom' || e.target.id === 'jto') {
    const v = /^\d{4}-\d\d-\d\d$/.test(e.target.value) ? e.target.value : '';
    if (e.target.id === 'jfrom') jFrom = v; else jTo = v;
    if (jFrom && jTo && jFrom > jTo) [jFrom, jTo] = [jTo, jFrom];
    selEx = null; PG.jl = 0; render();
  }
});
// the stock filter narrows the list as the client types; keep the cursor in the box
document.addEventListener('input', e => {
  if (e.target.id !== 'jsym') return;
  jSym = e.target.value.replace(/[^A-Za-z0-9ก-๙&.\- ]/g, '').slice(0, 15); selEx = null; PG.jl = 0; render();
  const i = $('#jsym'); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
});

// the back office writes to the same storage; pick up its changes
window.addEventListener('storage', e => {
  if (e.key !== KEY) return;
  const seen = new Set(S.feed.map(f => f.id));
  S = load();
  if (!signedIn()) return render();
  S.feed.filter(f => !seen.has(f.id) && f.by === 'coach' && f.cl === FEATURED && ['rec', 'vok', 'vfix', 'plan'].includes(f.kind))
    .forEach(f => toast(`${ic(f.kind === 'vfix' ? 'alert' : 'check', 18)}<div><b>${esc(f.text)}</b>${f.kind !== 'plan' ? '<div class="muted sm">ดูได้ที่บันทึกการซื้อขาย</div>' : ''}</div>`));
  if (!$('#modal').innerHTML) render();
});
let rz;
addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (!$('#modal').innerHTML) render(); }, 150); });
setInterval(() => { if (!$('#modal').innerHTML && signedIn() && !menu && document.activeElement?.id !== 'jsym') render(); }, 30000);
render();
</script>
</body>
</html>
