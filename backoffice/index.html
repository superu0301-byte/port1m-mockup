<style>
/* Port 1M look: midnight navy + champagne gold, glass panels over a soft aurora.
   One screen, no page scroll: long lists page inside their panel. */
:root{--bg:#05080f;--bg2:#0d1426;--bg3:#131c33;--bg4:#1b2643;--surf:linear-gradient(180deg,rgba(22,31,57,.92),rgba(12,18,35,.94));--line:rgba(150,172,232,.085);--line2:rgba(150,172,232,.17);--ink:#f2f5fc;--ink2:#bdc6da;--mut:#8590aa;--gold:#ebc062;--gold2:#f8df9c;--goldbg:rgba(235,192,98,.12);--goldln:rgba(235,192,98,.45);--up:#3ddc97;--upbg:rgba(61,220,151,.12);--dn:#ff6b7d;--dnbg:rgba(255,107,125,.13);--warn:#f5b544;--warnbg:rgba(245,181,68,.13);--blue:#7ea6ff;--bluebg:rgba(126,166,255,.13);--pu:#b69cff;--pubg:rgba(182,156,255,.13);--shadow:0 24px 60px -12px rgba(0,0,0,.65);--btn:linear-gradient(135deg,#fde7a8 0%,#ebc062 45%,#c98f2b 100%);--glass:rgba(11,17,32,.94);--r:20px;--wt:255,255,255;--hi:rgba(var(--wt),.045);--sh1:0 18px 40px -22px rgba(0,0,0,.75);--sh2:0 14px 34px -18px rgba(0,0,0,.8);--well:rgba(0,0,0,.2);--wellsh:inset 0 1px 2px rgba(0,0,0,.45);--pop:linear-gradient(180deg,#151f3a,#0e1529);--mbg:linear-gradient(180deg,#141d36,#0c1324);--tipbg:#1b2747;--toastbg:linear-gradient(180deg,#1b2747,#131c35);--scrim:rgba(2,4,10,.74);--sbar:linear-gradient(180deg,rgba(13,20,38,.96),rgba(7,11,22,.97));--avbg:linear-gradient(135deg,#2c3d68,#18223d);--onbtn:#211703;--gtxt:linear-gradient(180deg,#fff4d2 0%,#f3d07e 45%,#d29a35 100%);--note-pu:#dcd2ff;--note-y:#ffd99a;--cash:#2d3d63;--dotfill:#0d1426;--grid:rgba(var(--wt),.028);--ch:#ebc062;--ch2:#f8df9c;--knob:#fff3cf;--bgfx:radial-gradient(1000px 560px at 88% -14%,rgba(235,192,98,.16),transparent 62%),radial-gradient(900px 640px at -12% 112%,rgba(70,110,255,.14),transparent 62%),radial-gradient(700px 420px at 55% 120%,rgba(61,220,151,.05),transparent 65%);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:"Leelawadee UI","Leelawadee","Sukhumvit Set","Thonburi","Noto Sans Thai",Tahoma,sans-serif;color:var(--ink);font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased;
  background:var(--bgfx),var(--bg)}
/* faint chart-paper grid behind everything */
body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:46px 46px;-webkit-mask-image:radial-gradient(ellipse 90% 70% at 50% 0%,#000 10%,transparent 75%);mask-image:radial-gradient(ellipse 90% 70% at 50% 0%,#000 10%,transparent 75%)}
#app{height:100%;position:relative}
h1,h2,h3,h4{line-height:1.3;margin:0}
button{font-family:inherit;font-size:14.5px;cursor:pointer;color:inherit;background:none;border:none;padding:0;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
input[type=checkbox]{appearance:none;-webkit-appearance:none;width:20px;height:20px;padding:0;margin:0;border-radius:6px;border:1.5px solid var(--line2);background:rgba(var(--wt),.04);display:inline-grid;place-content:center;cursor:pointer;flex:none;transition:background .12s,border-color .12s}
input[type=checkbox]:checked{background:var(--btn);border-color:transparent}
input[type=checkbox]:checked:after{content:"";width:10px;height:5px;border:2.4px solid var(--onbtn);border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
input[type=checkbox]:focus-visible{outline:2px solid var(--goldln);outline-offset:2px}
button:disabled{cursor:not-allowed;opacity:.42}
input,textarea,select{font-family:inherit;font-size:15px;color:var(--ink);background:rgba(var(--wt),.035);border:1px solid var(--line2);border-radius:12px;padding:9px 12px;outline:none;width:100%;transition:border-color .15s,box-shadow .15s}
input:focus,textarea:focus,select:focus{border-color:var(--goldln);box-shadow:0 0 0 3px var(--goldbg)}
input[aria-invalid=true]{border-color:rgba(255,107,125,.6)}
textarea{resize:none;min-height:64px}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
select option{background:var(--bg2)}
:focus-visible{outline:2px solid var(--goldln);outline-offset:2px}
a{color:inherit}
.ic{flex:none;display:inline-block;vertical-align:middle}
.num{font-variant-numeric:tabular-nums lining-nums}
.serif{font-family:Georgia,"Times New Roman",serif}
.muted{color:var(--mut)}.ink2{color:var(--ink2)}.gold{color:var(--gold)}.blue{color:var(--blue)}.up{color:var(--up)}.dn{color:var(--dn)}.warn{color:var(--warn)}.ok{color:var(--up)}
.gtxt{background:var(--gtxt);-webkit-background-clip:text;background-clip:text;color:transparent}
.sm{font-size:13.5px}.xs{font-size:12.5px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

/* app shell: everything fits the screen, long lists page instead of scrolling */
.app{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.view{flex:1;min-height:0;width:100%;max-width:1440px;margin:0 auto;padding:14px 22px 18px;display:grid;gap:14px;overflow:hidden}
.view.enter>*{animation:rise .38s cubic-bezier(.2,.75,.2,1) both}
.view.enter>*:nth-child(2){animation-delay:.04s}.view.enter>*:nth-child(3){animation-delay:.08s}.view.enter>*:nth-child(4){animation-delay:.12s}.view.enter>*:nth-child(5){animation-delay:.16s}.view.enter>*:nth-child(n+6){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.vh{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-width:0;grid-column:1/-1}
.vh h1{font-size:22px;white-space:nowrap;letter-spacing:-.005em}
.vh p{margin:0;color:var(--mut);font-size:13.5px}
.span{grid-column:1/-1}
.pnl,.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);box-shadow:inset 0 1px 0 var(--hi),var(--sh1)}
.pnl{display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden;contain:layout paint}
.ph{display:flex;align-items:center;gap:10px;padding:14px 18px 10px;min-height:50px;flex:none}
.ph h3{font-size:15.5px;white-space:nowrap;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto}
.ph .sub{font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pb{flex:1;min-height:0;overflow:hidden;padding:0 16px 14px;position:relative}
.pgn{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mut);flex:none}
.pgn:empty{display:none}
.pgn button{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink2);background:rgba(var(--wt),.04);border:1px solid var(--line)}
.pgn button:hover:not(:disabled){color:var(--gold);border-color:var(--goldln)}
.list{display:flex;flex-direction:column;gap:8px}
.list.tight{gap:0}
.kstrip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;grid-column:1/-1;align-content:start}
.kpi{background:radial-gradient(150px 90px at 100% 0%,rgba(235,192,98,.08),transparent 70%),var(--surf);border:1px solid var(--line);border-radius:18px;padding:12px 16px;min-width:0;box-shadow:inset 0 1px 0 var(--hi)}
.kpi .k{font-size:12.5px;color:var(--mut);display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden}
.kpi .v{font-size:22px;font-weight:700;margin-top:1px;white-space:nowrap;letter-spacing:-.01em}
.kpi .s{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chartbox{position:relative;min-height:0;min-width:0;flex:1}
.empty{padding:22px;text-align:center;color:var(--mut);font-size:14px}
.empty .ic{display:block;margin:0 auto 8px;color:var(--up)}
/* narrow screens: panels become tabs instead of stacking */
.vgrid.tabbed{display:flex!important;flex-direction:column}
.vgrid.tabbed>.pt-off{display:none!important}
.vgrid.tabbed>[data-pt]{flex:1 1 auto;min-height:0}
.ptabs{flex:none;align-self:flex-start;max-width:100%}

/* cards */
.pad{padding:18px 20px}
.eyebrow{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:700}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:999px;padding:9px 18px;font-weight:700;font-size:14.5px;background:var(--btn);color:var(--onbtn);white-space:nowrap;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 8px 22px -10px rgba(235,192,98,.75);transition:filter .15s,transform .15s,box-shadow .15s}
.btn:hover:not(:disabled){filter:brightness(1.06);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 10px 26px -8px rgba(235,192,98,.8)}
.btn:active:not(:disabled){transform:translateY(1px) scale(.985)}
.btn.ghost{background:rgba(var(--wt),.03);border:1px solid var(--line2);color:var(--ink);font-weight:600;box-shadow:none}
.btn.ghost:hover:not(:disabled){border-color:var(--goldln);color:var(--gold);box-shadow:none}
.btn.soft{background:rgba(var(--wt),.07);color:var(--ink);font-weight:600;box-shadow:none}
.btn.soft:hover:not(:disabled){background:rgba(var(--wt),.11);box-shadow:none}
.btn.ok{background:linear-gradient(135deg,#7af0bd,#2fc585);color:#04261a;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 8px 22px -10px rgba(61,220,151,.7)}
.btn.bad{background:transparent;border:1px solid rgba(255,107,125,.4);color:var(--dn);font-weight:600;box-shadow:none}
.btn.sm{padding:6px 13px;font-size:13.5px}
.btn.lg{padding:12px 26px;font-size:16px}
.btn.block{width:100%}
.lnk{color:var(--gold);font-weight:600;display:inline-flex;align-items:center;gap:3px}
.lnk:hover{text-decoration:underline}
.ibtn{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink2);position:relative;flex:none;background:rgba(var(--wt),.04);border:1px solid var(--line)}
.ibtn:hover{color:var(--ink);border-color:var(--line2)}
.ibtn .bdg{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;padding:0 4px;border-radius:999px;background:var(--dn);color:#fff;font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg);box-shadow:0 0 12px rgba(255,107,125,.6)}
.demob{display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--goldln);color:var(--gold);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:700;flex:none;background:rgba(235,192,98,.05)}

/* tags and chips */
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;line-height:1.5;padding:2px 9px;border-radius:999px;background:rgba(var(--wt),.07);color:var(--ink2);white-space:nowrap;font-weight:600}
.tag.ok{background:var(--upbg);color:var(--up)}
.tag.dn{background:var(--dnbg);color:var(--dn)}
.tag.warn{background:var(--warnbg);color:var(--warn)}
.tag.blue{background:var(--bluebg);color:var(--blue)}
.tag.pu{background:var(--pubg);color:var(--pu)}
.tag.gold{background:var(--goldbg);color:var(--gold)}
.tag.line{background:transparent;border:1px solid var(--line2)}
.side{display:inline-flex;align-items:center;justify-content:center;min-width:44px;font-size:11.5px;font-weight:800;letter-spacing:.06em;padding:3px 8px;border-radius:8px;flex:none}
.side.buy{background:var(--upbg);color:var(--up);box-shadow:inset 0 0 0 1px rgba(61,220,151,.25)}
.side.sell{background:var(--dnbg);color:var(--dn);box-shadow:inset 0 0 0 1px rgba(255,107,125,.25)}
.side.sl{background:var(--goldbg);color:var(--gold);box-shadow:inset 0 0 0 1px rgba(235,192,98,.25)}
.side.pl{background:var(--bluebg);color:var(--blue);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--blue) 25%,transparent)}
.side.ms{background:var(--warnbg);color:var(--warn);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--warn) 25%,transparent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 13px;border-radius:999px;border:1px solid var(--line2);color:var(--ink2);font-size:13.5px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;background:rgba(var(--wt),.02)}
.chip:hover{color:var(--ink)}
.chip.on{background:var(--goldbg);color:var(--gold);border-color:var(--goldln);font-weight:700}
.chip .n{font-size:11.5px;background:rgba(var(--wt),.08);color:var(--ink2);border-radius:999px;padding:0 7px}
.chip.on .n{background:rgba(235,192,98,.2);color:var(--gold)}
.seg{display:inline-flex;background:rgba(var(--wt),.035);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;max-width:100%;overflow:hidden}
.seg button{padding:6px 14px;border-radius:999px;color:var(--ink2);font-size:14px;white-space:nowrap;display:inline-flex;gap:6px;align-items:center;transition:background .15s,color .15s}
.seg button:hover{color:var(--ink)}
.seg button.on{background:rgba(var(--wt),.1);color:var(--ink);font-weight:700;box-shadow:inset 0 1px 0 rgba(var(--wt),.08)}
.seg .n{font-size:11.5px;background:var(--goldbg);color:var(--gold);border-radius:999px;padding:0 7px;font-weight:700}

/* stock logo + company card */

.slg.mono{background:linear-gradient(135deg,hsl(var(--h) 55% 42%),hsl(calc(var(--h) + 40) 50% 26%));color:#fff;font-size:calc(var(--s)*.36);font-weight:800;letter-spacing:.02em;box-shadow:0 0 0 1px rgba(var(--wt),.1)}
.sy{display:inline-flex;align-items:center;gap:9px;min-width:0;vertical-align:middle;text-align:left}
.sy b{letter-spacing:.02em;white-space:nowrap}
button.sy:hover b{color:var(--gold2)}
button.sy:hover .slg{transform:scale(1.08)}
.slb{flex:none;display:flex;border-radius:12px}
.slb:hover .slg{transform:scale(1.08)}
.jm{display:flex;gap:10px;align-items:center;min-width:0}
/* allocation donut + legend, portfolio heat, weekly results */
.alloc{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;min-height:0}
.donut{position:relative;flex:none}
.donut svg{display:block;transform:rotate(-90deg)}
.donut circle[data-dk]{transition:opacity .15s,stroke-width .15s}
.alloc.hov .donut circle[data-dk]:not(.hl){opacity:.28}
.dc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.2;padding:0 18%}
.dc b{font-size:22px;letter-spacing:-.01em}
.dc span{font-size:11.5px;color:var(--mut);margin-top:2px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.alg{display:flex;flex-direction:column;gap:2px;min-width:0}
.ali{display:grid;grid-template-columns:10px minmax(0,1fr) auto;grid-template-rows:auto 3px;gap:2px 8px;align-items:center;padding:4px 6px;border-radius:9px;font-size:12.5px;cursor:default}
.ali>i{width:10px;height:10px;border-radius:3px}
.ali .ab{grid-column:2/-1;height:3px;border-radius:2px;background:rgba(var(--wt),.05);overflow:hidden}
.ali .ab i{display:block;height:100%;border-radius:inherit}
.ali.hl{background:rgba(var(--wt),.05)}
.seg.xsg{padding:2px}.seg.xsg button{padding:3px 10px;font-size:12px}
.heat{display:flex;flex-direction:column;gap:5px}
.hbar{position:relative;height:8px;border-radius:999px;background:rgba(var(--wt),.07)}
.hbar i{position:absolute;inset:0 auto 0 0;border-radius:inherit}
.hbar i.up{background:linear-gradient(90deg,#1fa970,var(--up))}.hbar i.warn{background:linear-gradient(90deg,#c98a1c,var(--warn))}.hbar i.dn{background:linear-gradient(90deg,#c9374b,var(--dn))}
.hbar s{position:absolute;left:66.6%;top:-3px;bottom:-3px;width:2px;border-radius:2px;background:rgba(var(--wt),.55)}
.wk{display:flex;flex-direction:column;gap:6px;flex:none}
.wbars{display:block;width:100%;height:56px}
.wks{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:var(--mut)}
/* the donut and the weekly strip size themselves to the room the panel actually has */
.palloc .pb,.phist .pb,.pb:has(>.wk){container-type:size}
.palloc .donut{width:clamp(44px,calc(100cqh - 6px),150px)!important;height:clamp(44px,calc(100cqh - 6px),150px)!important}
.donut svg{width:100%;height:100%}
.alg:has(>.ali:nth-child(6)) .ali{padding:2px 6px;grid-template-rows:auto}.alg:has(>.ali:nth-child(6)) .ab{display:none}
@container (max-height:150px){.ali{padding:1px 6px;grid-template-rows:auto}.ali .ab{display:none}.ali:nth-child(n+5):not(:last-child){display:none}.dc b{font-size:17px}.dc span{font-size:10.5px}}
@container (max-height:118px){.ali{padding:0 4px;line-height:1.3}.ali:nth-child(n+3):not(:last-child){display:none}.dc span{display:none}}
@container (max-height:72px){.ali:nth-child(n+2):not(:last-child){display:none}}
@container (max-height:50px){.alg{display:none}.alloc{grid-template-columns:auto}}
@container (max-height:230px){.wbars{height:34px}}
@container (max-height:160px){.wk{display:none}}
.pfoot{flex:none;padding:10px 18px 14px;border-top:1px solid var(--line);font-size:12.5px;display:flex;flex-direction:column;gap:10px}
.sline{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-radius:14px;background:rgba(var(--wt),.035);border:1px solid var(--line)}
.sline .r{display:flex;flex-direction:column;align-items:flex-end;line-height:1.35}
.stm{padding:20px 22px 18px;display:flex;flex-direction:column;gap:14px}
.stm-h{display:flex;gap:14px;align-items:center}
.stm-h h3{font-size:24px;letter-spacing:.02em}
.stm-h .row{flex-wrap:wrap;row-gap:4px}
.stm-h .tag{max-width:100%;overflow:hidden;text-overflow:ellipsis}
.stm-h .x{margin-left:auto;align-self:flex-start;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--mut);flex:none}
.stm-h .x:hover{background:rgba(var(--wt),.06);color:var(--ink)}
.stm-p{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.stm-p>.num:first-child{font-size:34px;font-weight:700;letter-spacing:-.01em}
.stm-p .tag{font-size:13.5px;padding:3px 11px}
.stm-r .r52{position:relative;height:8px;border-radius:999px;margin-top:8px;background:linear-gradient(90deg,rgba(255,107,125,.55),rgba(245,181,68,.55),rgba(61,220,151,.55))}
.stm-r .r52 i{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 0 0 4px rgba(255,255,255,.18),0 2px 8px rgba(0,0,0,.5)}
.stm-k{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stm-k div{padding:10px 12px;border-radius:14px;background:rgba(var(--wt),.04);border:1px solid var(--line);min-width:0}
.stm-k span{display:block;font-size:12px;color:var(--mut)}
.stm-k b{font-size:15.5px;white-space:nowrap}
@media (max-width:480px){.stm{padding:18px 16px 16px}.stm-k{grid-template-columns:1fr 1fr}.stm-k div:last-child{grid-column:1/-1}.stm-p>.num:first-child{font-size:30px}}

/* plan-vs-actual marks */
.checks{display:inline-flex;gap:4px;flex-wrap:wrap}
.ck{display:inline-flex;align-items:center;gap:3px;font-size:12px;padding:1px 7px 1px 5px;border-radius:6px;font-weight:600}
.ck.ok{background:var(--upbg);color:var(--up)}
.ck.bad{background:var(--warnbg);color:var(--warn)}
.ck.no{background:var(--dnbg);color:var(--dn)}
.dots{display:inline-flex;gap:3px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--bg4)}
.dots i.ok{background:var(--up)}.dots i.bad{background:var(--warn)}.dots i.no,.dots i.exp{background:var(--dn)}.dots i.pend{background:var(--blue);box-shadow:0 0 8px rgba(126,166,255,.7)}.dots i.skip{background:transparent;box-shadow:inset 0 0 0 1.5px var(--warn)}.dots i.cancel{background:var(--bg4)}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-weight:600;color:var(--mut);font-size:12.5px;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:none}
.tbl .r{text-align:right}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr.click:hover td{background:rgba(var(--wt),.03)}

/* progress */
.bar{height:7px;border-radius:999px;background:rgba(var(--wt),.07);overflow:hidden;position:relative}
.bar>i{position:absolute;inset:0 auto 0 0;border-radius:inherit;background:var(--btn)}
.bar.up>i{background:linear-gradient(90deg,#1fa970,var(--up))}.bar.warn>i{background:linear-gradient(90deg,#c98a1c,var(--warn))}.bar.dn>i{background:linear-gradient(90deg,#c9374b,var(--dn))}

/* avatar */
.av{width:36px;height:36px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14.5px;background:var(--avbg);color:var(--ink);border:1px solid var(--line2)}
.av.gold{background:var(--btn);color:var(--onbtn);border:none;box-shadow:0 0 0 2px rgba(235,192,98,.25)}
.av.lg{width:52px;height:52px;font-size:19px}
.av.sm{width:28px;height:28px;font-size:12px}

/* score ring */
.ring{position:relative;flex:none}
.ring svg{display:block;transform:rotate(-90deg);overflow:visible}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800}

/* forms */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label{font-size:13px;color:var(--ink2);font-weight:600}
.field .hint{font-size:12px;color:var(--mut)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.drop{border:1.5px dashed var(--line2);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:12px;cursor:pointer;color:var(--ink2);background:rgba(var(--wt),.025);font-size:14px}
.drop:hover{border-color:var(--goldln)}
.drop.has{border-style:solid;border-color:rgba(61,220,151,.4)}
/* the client's own trading plan, shown as the agreed document */
.tpd{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--well)}
.tpd>div{display:grid;grid-template-columns:170px minmax(0,1fr);gap:12px;padding:8px 13px;border-top:1px solid var(--line);font-size:13.5px;line-height:1.45}
.tpd>div:first-child{border-top:none}
.tpd>div>span{color:var(--mut)}
.tpd b{font-weight:600}
.tpf{margin-top:8px}
@media (max-width:700px){.tpd>div{grid-template-columns:1fr;gap:1px;padding:7px 12px}}
/* key-in form: the screenshot is attached beside the fields */
.f3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.recf{display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px}
.recf-img{display:flex;flex-direction:column;gap:8px;min-width:0}
.recf-f{display:flex;flex-direction:column;gap:10px;min-width:0}
.recf-f .seg.xsg button{padding:4px 10px}
.recf-f .seg{flex-wrap:wrap;border-radius:16px}
.kdrop{flex:1;min-height:250px;max-height:min(440px,58dvh);border:1.5px dashed var(--line2);border-radius:16px;background:rgba(var(--wt),.025);display:flex;flex-direction:column;cursor:pointer;overflow:hidden;transition:border-color .15s}
.kdrop:hover,.kdrop:focus-visible{border-color:var(--goldln)}
.kdrop.has{border-style:solid;border-color:color-mix(in srgb,var(--up) 45%,transparent)}
.kd-p{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:10px}
.kd-i{width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;background:var(--goldbg);color:var(--gold)}
.kd-t{padding:9px 12px 11px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px;font-size:13.5px;min-width:0}
.kd-t .hint{font-size:11.5px;color:var(--mut)}
@media (max-width:700px){
  .recf{grid-template-columns:minmax(0,1fr);gap:10px}
  .recf-img{flex-direction:row;align-items:center}
  .kdrop{min-height:0;max-height:none;flex-direction:row;height:92px;flex:1}
  .kd-p{flex:none;width:68px;padding:6px}
  .kd-t{border-top:none;justify-content:center}
  .recf-img>.btn{flex:none}
  .f3{grid-template-columns:1fr 1fr}.f3 .field:last-child{grid-column:1/-1}
}
@media (max-width:700px) and (max-height:820px){.kdrop{height:66px}.kd-p{width:50px}.kd-t .hint{display:none}.recf-f{gap:7px}.recf-f .field{gap:3px}.recf-f .field>label{font-size:12.5px}.recf .cmp .cr{display:none}.recf .cmp .ch{padding:7px 12px}.mbox:has(.recf) .mhd .muted,.recf-f .kopt{display:none}.recf-f .note-box{padding:8px 10px;font-size:13px}.mbox:has(.recf) .mbd{padding:10px 14px 12px}.mbox:has(.recf) .mhd{padding-top:12px;padding-bottom:6px}.recf-f .seg.xsg button{padding:4px 8px}}
.radio{display:flex;flex-direction:column;gap:6px}
.radio label{display:flex;gap:10px;align-items:center;padding:8px 12px;border:1px solid var(--line2);border-radius:12px;cursor:pointer;font-size:14.5px}
.radio label:has(input:checked){border-color:var(--goldln);background:var(--goldbg)}
.radio input{width:auto;accent-color:var(--gold)}
.ferr{color:var(--dn);font-size:13px;min-height:18px}

/* modal: designed to fit; scrolls inside only on very small screens */
.modal{position:fixed;inset:0;z-index:60;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:12px;animation:fade .2s}
.mbox{background:var(--mbg);border:1px solid var(--line2);border-radius:24px;box-shadow:var(--shadow),inset 0 1px 0 var(--hi);width:min(540px,100%);max-height:calc(100dvh - 24px);overflow:auto;animation:pop .25s cubic-bezier(.2,.75,.2,1);position:relative}
.mbox:before{content:"";position:absolute;inset:0 18% auto;height:1px;background:linear-gradient(90deg,transparent,var(--goldln),transparent)}
.mbox.wide{width:min(1000px,100%)}
.mbox.mid{width:min(780px,100%)}
.mbox.sm{width:min(460px,100%)}
.mhd{display:flex;align-items:flex-start;gap:12px;padding:18px 22px 0}
.mhd h3{font-size:18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mhd .x{margin-left:auto;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--mut);flex:none}
.mhd .x:hover{background:rgba(var(--wt),.06);color:var(--ink)}
.mbd{padding:14px 22px 16px}
.mft{display:flex;gap:10px;justify-content:flex-end;align-items:center;padding:0 22px 20px;flex-wrap:wrap}
.mgrid{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:18px}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* plan strip and comparison inside modals */
.pstrip{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:14px;background:rgba(var(--wt),.035);border:1px solid var(--line);font-size:13.5px}
.pstrip div{display:flex;justify-content:space-between;gap:10px}
.pstrip span{color:var(--mut)}
.cmp{margin-top:12px;border:1px solid var(--line2);border-radius:14px;overflow:hidden}
.cmp .ch{padding:8px 12px;font-size:12.5px;color:var(--mut);background:rgba(var(--wt),.035);font-weight:700;display:flex;justify-content:space-between}
.cmp .cr{display:flex;gap:8px;align-items:center;padding:7px 12px;font-size:13.5px;border-top:1px solid var(--line)}
.cmp .ico{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;background:var(--bg4);color:var(--mut)}
.cmp .ok .ico{background:var(--upbg);color:var(--up)}
.cmp .bad .ico{background:var(--warnbg);color:var(--warn)}
.cmp .no .ico{background:var(--dnbg);color:var(--dn)}
.cmp .k{width:58px;color:var(--ink2);flex:none}
.note-box{display:flex;gap:10px;padding:11px 13px;border-radius:14px;font-size:14px;align-items:flex-start;background:var(--pubg);color:var(--note-pu)}
.note-box .ic{margin-top:2px;flex:none}
.note-box.y{background:var(--warnbg);color:var(--note-y)}
.note-box.g{background:var(--goldbg);color:var(--gold2)}

/* toast */
#toasts{position:fixed;right:18px;bottom:18px;z-index:80;display:flex;flex-direction:column;gap:10px;align-items:flex-end;pointer-events:none}
.toast{pointer-events:auto;background:var(--toastbg);border:1px solid var(--line2);border-radius:16px;padding:12px 16px 12px 14px;box-shadow:var(--shadow);font-size:14px;max-width:380px;display:flex;gap:10px;align-items:flex-start;animation:pop .3s cubic-bezier(.2,.75,.2,1);position:relative;overflow:hidden}
.toast:before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--gold)}
.toast.ok:before{background:var(--up)}
.toast.err:before{background:var(--dn)}
.toast>.ic{color:var(--gold)}.toast.ok>.ic{color:var(--up)}.toast.err>.ic{color:var(--dn)}

/* slip (mock screenshot from a broker app) */
.slip{width:100%;height:100%;object-fit:contain;border-radius:12px;display:block}
.slipth{width:40px;height:54px;border-radius:8px;overflow:hidden;border:1px solid var(--line2);flex:none;background:var(--bg3);cursor:zoom-in;display:flex;align-items:center;justify-content:center;color:var(--mut)}
.slipth img,.slipth svg{width:100%;height:100%;object-fit:cover;display:block}

/* google sign-in */
.gbtn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;background:#fff;color:#1f1f1f;border-radius:999px;padding:12px 20px;font-weight:600;font-size:15px;border:1px solid #dadce0;font-family:Roboto,"Leelawadee UI",sans-serif;box-shadow:0 10px 30px -12px rgba(255,255,255,.35)}
.gbtn:hover{background:#f7f8f8}
.gwrap{background:transparent!important;border:none!important;box-shadow:none!important;display:flex;justify-content:center}
.gwrap:before{display:none}
.gpick{background:#fff;color:#1f1f1f;border-radius:22px;width:min(440px,100%);padding:26px 0 16px;box-shadow:var(--shadow);font-family:Roboto,"Leelawadee UI",sans-serif;max-height:calc(100dvh - 24px);display:flex;flex-direction:column}
.gpick h4{font-size:21px;font-weight:400;text-align:center;margin:10px 0 2px}
.gpick .gs{text-align:center;color:#444746;font-size:14.5px;margin-bottom:14px}
.gpick .gs b{color:#0b57d0;font-weight:500}
.gaccs{overflow:auto;min-height:0}
.gacc{display:flex;gap:14px;align-items:center;width:100%;padding:10px 28px;border-top:1px solid #e3e3e3;text-align:left;color:#1f1f1f}
.gacc:hover{background:#f3f6fc}
.gacc .ga{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;flex:none}
.gacc small{display:block;color:#444746;font-size:12.5px}
.gerr{margin:10px 28px 0;padding:9px 12px;border-radius:10px;background:#fce8e6;color:#b3261e;font-size:13.5px}

/* dropdown menus */
.dd{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 10px);z-index:50;background:var(--pop);border:1px solid var(--line2);border-radius:18px;box-shadow:var(--shadow);padding:6px;min-width:260px;animation:pop .2s cubic-bezier(.2,.75,.2,1)}
.menu .mi{display:flex;gap:10px;align-items:center;width:100%;padding:9px 11px;border-radius:12px;font-size:14px;text-decoration:none;color:var(--ink);text-align:left}
.menu .mi:hover{background:rgba(var(--wt),.06)}
.menu .mt{font-size:12px;color:var(--mut);padding:6px 11px 3px}
.menu .mh{padding:8px 11px 10px;border-bottom:1px solid var(--line);margin-bottom:4px}

/* chart */
.chartw{position:absolute;inset:0}
.ctip{position:absolute;pointer-events:none;background:var(--tipbg);border:1px solid var(--line2);border-radius:10px;padding:5px 9px;font-size:12px;white-space:nowrap;transform:translate(-50%,-118%);box-shadow:var(--shadow);z-index:2}

/* trading words: meaning on hover */
.tm{text-decoration:underline dotted;text-decoration-color:rgba(var(--wt),.35);text-underline-offset:3px;cursor:help}
.gls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.gl{padding:10px 13px;border-radius:14px;background:rgba(var(--wt),.035);border:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.gl b{font-size:14.5px}
.gl p{margin:3px 0 0;font-size:13px;color:var(--ink2);line-height:1.5}
kbd{font-family:inherit;font-size:11px;font-weight:700;padding:1px 6px;border-radius:6px;border:1px solid var(--line2);border-bottom-width:2px;color:var(--ink2);background:rgba(var(--wt),.04);white-space:nowrap}

/* plan ladder (one line) and position tool */
.mlad{position:relative;display:block;height:6px;border-radius:999px;background:rgba(var(--wt),.07)}
.mlad i{position:absolute;top:0;bottom:0}
.mlad .rk{background:linear-gradient(90deg,color-mix(in srgb,var(--dn) 85%,transparent),color-mix(in srgb,var(--dn) 40%,transparent));border-radius:999px 0 0 999px}
.mlad .lk{background:color-mix(in srgb,var(--gold) 70%,transparent)}
.mlad .rw{background:linear-gradient(90deg,color-mix(in srgb,var(--up) 35%,transparent),color-mix(in srgb,var(--up) 90%,transparent));border-radius:0 999px 999px 0}
.mlad .t1{width:2px;margin-left:-1px;background:var(--bg2)}
.mlad .lp{width:11px;height:11px;top:-2.5px;margin-left:-5.5px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 2px var(--bg2)}
.mlad .lp.up{background:var(--up)}.mlad .lp.warn{background:var(--warn)}.mlad .lp.dn{background:var(--dn)}
.cdr{flex:none;display:block}

/* search everywhere */
.modal:has(.cmdk){align-items:flex-start;padding-top:min(14vh,120px)}
.mbox.cmdk{width:min(620px,100%);border-radius:20px;overflow:hidden}
.mbox.cmdk:before{display:none}
.ck-in{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);color:var(--mut)}
.ck-in input{border:none;background:none;box-shadow:none!important;padding:4px 0;font-size:17px;color:var(--ink)}
.ck-in input:focus-visible{outline:none}
.ck-l{padding:6px}
.ck-g{font-size:11.5px;font-weight:700;color:var(--mut);letter-spacing:.06em;padding:8px 12px 3px}
.ck-i{display:flex;align-items:center;gap:12px;width:100%;padding:8px 12px;border-radius:12px;text-align:left;min-height:44px}
.ck-i.on{background:var(--goldbg);box-shadow:inset 0 0 0 1px var(--goldln)}
.ck-i.on b{color:var(--gold2)}
.ck-i kbd{margin-left:auto}
.ck-ic{width:28px;height:28px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:rgba(var(--wt),.06);color:var(--ink2);flex:none}
.ck-f{display:flex;align-items:center;gap:14px;padding:9px 18px;border-top:1px solid var(--line);font-size:12px;color:var(--mut)}
.ck-f kbd{margin-right:3px}
.kbtn{display:flex;align-items:center;gap:8px;height:38px;padding:0 10px 0 12px;border-radius:999px;border:1px solid var(--line);background:rgba(var(--wt),.04);color:var(--mut);font-size:13.5px;flex:none}
.kbtn:hover{color:var(--ink);border-color:var(--line2)}
@media (max-width:560px){.gls{grid-template-columns:1fr}.modal:has(.cmdk){padding-top:10px;align-items:flex-start}.ck-f{display:none}}

/* theme switch */
.thseg{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:3px;border-radius:14px;background:rgba(var(--wt),.05);border:1px solid var(--line);margin:4px 2px 6px}
.thseg button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 4px;border-radius:11px;font-size:12px;color:var(--ink2)}
.thseg button:hover{color:var(--ink)}
.thseg button.on{background:var(--bg2);color:var(--gold);font-weight:700;box-shadow:0 1px 0 var(--hi),0 4px 12px -6px rgba(0,0,0,.35)}
.thb .ic{transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
.thb:hover .ic{transform:rotate(-25deg)}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}

/* ---------- the way a trading app shows a port and its orders (Settrade Streaming), drawn in our look ----------
   Order Status and Portfolio are tables: .ot-h is the header row, .ot-r a row (one element, so it pages like
   any list); the columns come from --cols, and less important columns hide as a panel gets narrow. */
.otw{display:flex;flex-direction:column;min-height:0;flex:1}
.ot-h,.ot-r{display:grid;grid-template-columns:var(--cols);column-gap:12px;align-items:center;padding:0 16px}
.ot-h{flex:none;min-height:30px;font-size:12px;color:var(--mut);border-bottom:1px solid var(--line2);white-space:nowrap;background:rgba(var(--wt),.025)}
.ot-h>*{overflow:hidden;text-overflow:ellipsis}
.ot-r{min-height:46px;padding-top:4px;padding-bottom:4px;border-bottom:1px solid var(--line);font-size:13.5px;width:100%;text-align:left;color:var(--ink);transition:background .12s}
.ot-r>*{min-width:0}
button.ot-r:hover,.ot-r.click:hover{background:rgba(var(--wt),.04);cursor:pointer}
.ot-r.on{background:var(--goldbg);box-shadow:inset 3px 0 0 var(--gold)}
.ot-h .r,.ot-r .r{text-align:right}
.ot-h .c,.ot-r .c{text-align:center;justify-self:center}
.ot-r .t2{display:block;font-size:11.5px;color:var(--mut);line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ot-r b{font-weight:700}
.ot-r .slipth{width:24px;height:32px;border-radius:6px}
.ot-r .side{min-width:40px;padding:2px 6px}
.ot-f{flex:none;display:grid;grid-template-columns:var(--cols);column-gap:12px;align-items:center;padding:7px 16px;border-top:1px solid var(--line2);font-size:13px;background:rgba(var(--wt),.025)}
.otw .mo,.otw .mo6{display:none}
.pb.flush{padding:0}
.pre{flex:none;padding:10px 16px 6px}
/* yellow cards */
/* คะแนนตามกติกา: the score as a small badge (green 85+, amber 70–84, red below 70), and what a record cost */
.ptb{display:inline-flex;align-items:baseline;gap:1px;padding:0 7px;border-radius:999px;font-weight:800;font-size:12px;line-height:19px;border:1.5px solid currentColor;vertical-align:middle;font-variant-numeric:tabular-nums;white-space:nowrap}
.ptb small{font-size:9.5px;font-weight:600;opacity:.75}.ptb.up{color:var(--up)}.ptb.warn{color:var(--warn)}.ptb.dn{color:var(--dn)}
.kpi .ptb.kc{position:absolute;top:11px;right:12px}
.ptm{font-size:11px;font-weight:800;color:var(--dn);margin-right:4px;font-variant-numeric:tabular-nums;flex:none}
/* the record sheet */
.rd{display:flex;flex-direction:column;gap:12px;min-height:0;height:100%;overflow:auto;scrollbar-width:thin;padding-right:2px}
.rtrack{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;flex:none}
.rt{position:relative;padding:20px 8px 0 0;display:flex;flex-direction:column;min-width:0;font-size:11.5px;color:var(--mut)}
.rt:before{content:"";position:absolute;top:8px;left:18px;right:0;height:2px;background:var(--line2)}
.rt:last-child:before{display:none}
.rt i{position:absolute;top:0;left:0;width:18px;height:18px;border-radius:50%;background:var(--bg2);border:2px solid var(--line2);display:flex;align-items:center;justify-content:center;color:#fff}
.rt b{font-size:12.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt.done i{background:var(--up);border-color:var(--up)}.rt.done:before{background:var(--up)}
.rt.now i{border-color:var(--blue);box-shadow:0 0 0 4px var(--bluebg)}.rt.now b{color:var(--blue)}
.rt.warn i{background:var(--warn);border-color:var(--warn)}.rt.warn b{color:var(--warn)}
.rt.pu i{background:var(--pu);border-color:var(--pu)}.rt.pu b{color:var(--pu)}
.rt.todo b{color:var(--mut)}
.rd-top{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:start;flex:none}
.rd-pic{display:flex;flex-direction:column;gap:4px;align-items:stretch;text-align:center;font-size:11px;color:var(--mut)}
.rd-pic .slipth{width:96px;height:132px;border-radius:12px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:13px}
.kv>span{padding:5px 12px;border-top:1px solid var(--line);min-width:0}
.kv>span:nth-child(-n+2){border-top:none}
.kv>span:nth-child(odd){color:var(--mut);background:rgba(var(--wt),.03);white-space:nowrap}
.kv>span:nth-child(even){text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kv .side{min-width:0;padding:1px 6px;font-size:10.5px;margin-right:4px}
.rsec{display:flex;flex-direction:column;gap:6px;flex:none}
.rsec>h4{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut);font-weight:700;letter-spacing:.03em}
.rsec>h4:after{content:"";flex:1;height:1px;background:var(--line);order:1}
.rsec>h4>*:not(span:first-child){order:2}
.ckt{border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:13px}
.ckt-h,.ckt-r{display:grid;grid-template-columns:minmax(64px,.8fr) minmax(0,1.1fr) minmax(0,1fr) 68px;gap:10px;align-items:center;padding:5px 12px}
.ckt-h{font-size:11.5px;color:var(--mut);background:rgba(var(--wt),.03)}
.ckt-r{border-top:1px solid var(--line)}
.ckt-r>*{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ckt-r>span:first-child{color:var(--ink2)}
.ckt-r .tag{justify-self:start}
.rnote{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;padding:7px 10px;border-radius:10px;background:rgba(var(--wt),.035);border:1px solid var(--line);line-height:1.45}
.rnote>b{flex:none;color:var(--mut);font-weight:600}
.rnote.warn{background:var(--warnbg);border-color:transparent;color:var(--note-y)}
.rnote.warn .ic{flex:none;margin-top:2px}
/* plan result in a table cell */
.pst{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:12.5px;white-space:nowrap}
.pst>i{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}

.pst.ok{color:var(--up)}.pst.warn{color:var(--warn)}.pst.pu{color:var(--pu)}
/* short screens and phones: the same sheet, tighter (it scrolls inside its panel only if it still does not fit) */
@media (max-height:760px),(max-width:760px){.rd{gap:8px}.rd-pic .slipth{width:76px;height:104px}.rd-top{grid-template-columns:76px minmax(0,1fr);gap:10px}.kv{font-size:12.5px}.kv>span{padding:3px 10px}.ckt{font-size:12.5px}.ckt-h{display:none}.ckt-h+.ckt-r{border-top:none}.ckt-r{padding:3px 10px}.rt{padding-top:20px}.rt span{display:none}.rsec{gap:4px}.rsec>h4{font-size:11.5px}.rnote{padding:5px 9px;font-size:12px}.mtc-h,.mtc-r{padding:4px 10px}}
/* a sale and the buys it closed, with the result */
.mtc{border:1px solid var(--line);border-radius:14px;overflow:hidden;font-size:13px;flex:none}
.mtc-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:7px 12px;background:rgba(var(--wt),.035);color:var(--ink2);font-weight:600}
.mtc-r{display:grid;grid-template-columns:44px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:6px 12px;border-top:1px solid var(--line)}
.mtc-r .side{min-width:0;padding:1px 5px;font-size:10.5px}
.mtc-f{padding:6px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--mut)}
@media (max-height:760px){.ed-info .mtc-f,.vd-info .mtc-f{display:none}.ed-info .mtc-h,.ed-info .mtc-r{padding:4px 10px}}
@media (max-height:700px){.ed-info .mtc-r:nth-child(n+3){display:none}.ed-info .mtc{font-size:12px}}
@media (max-width:900px){.ed-info .mtc-f{display:none}.ed-info .mtc-r:nth-child(n+3){display:none}.ed-info .mtc-h,.ed-info .mtc-r{padding:4px 10px}}
/* account summary across the top of the port, like the summary line of a broker app */
.acct{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-column:1/-1;align-items:stretch}
.acct>div{padding:11px 16px 10px;border-left:1px solid var(--line);min-width:0}
.acct>div:first-child{border-left:none}
.acct .k{font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:5px;align-items:center}
.acct .v{font-size:21px;font-weight:700;white-space:nowrap;letter-spacing:-.01em;line-height:1.35}
.acct .s{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acct .main .v{font-size:24px}
/* one holding, opened from the port (Streaming's portfolio detail with its Buy / Sell buttons) */
.pdx{display:flex;flex-direction:column;gap:12px}
.pdx-q{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.pdx-q>.num:first-child{font-size:30px;font-weight:700;letter-spacing:-.01em}
.pdx-g{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.pdx-g div{padding:9px 12px;border-radius:14px;background:rgba(var(--wt),.04);border:1px solid var(--line);min-width:0}
.pdx-g span{display:block;font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pdx-g b{font-size:15.5px;white-space:nowrap}
.pdx .otw{border:1px solid var(--line);border-radius:14px;overflow:hidden;flex:none}
.pdx-a{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn.buy{background:linear-gradient(135deg,#7af0bd,#2fc585);color:#04261a;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 8px 22px -10px rgba(61,220,151,.7)}
.btn.sell{background:linear-gradient(135deg,#ff9aa6,#e5475e);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 22px -10px rgba(255,107,125,.7)}
.pdt{--cols:72px 48px minmax(56px,1fr) minmax(56px,1fr) 96px;container-type:inline-size}
@container (max-width:420px){.pdt .c-px{display:none}.pdt .ot-h,.pdt .ot-r{--cols:62px 44px minmax(52px,1fr) 92px;column-gap:8px;padding:0 10px}}
@media (max-height:760px) and (min-width:561px){.pdx{gap:9px}.pdx-g div{padding:6px 11px}.pdx-q>.num:first-child{font-size:26px}}
@media (max-height:680px) and (min-width:561px){.pdx-g b{font-size:14px}.pdx-g div{padding:5px 10px}.mbox:has(.pdx) .mhd{padding-top:12px}.mbox:has(.pdx) .mbd{padding-top:10px;padding-bottom:10px}}
@media (max-width:560px){.pdx{gap:9px}.pdx-g{grid-template-columns:1fr 1fr;gap:6px}.pdx-g div:nth-child(n+5){display:none}.pdx-g div{padding:6px 10px}.pdx-q>.num:first-child{font-size:24px}}
/* the key-in form works like an order ticket: Buy / Sell, price and volume with steps, the amount, then confirm */
.bs{display:grid;grid-template-columns:1fr 1fr;gap:6px;flex:none}
/* the screenshot box takes the height the fields need instead of setting it (a tall picture no longer makes the dialog scroll) */
@media (min-width:701px){.kdrop{contain:size;min-height:200px}}
@media (max-height:760px) and (min-width:701px){.kdrop{min-height:150px}}
@media (max-width:700px){.recf-img{flex-wrap:wrap}.recf-img>.bs{flex:1 0 100%}}
.bs button{padding:8px 0;border-radius:12px;font-weight:800;font-size:15px;letter-spacing:.03em;border:1px solid var(--line2);color:var(--ink2);background:rgba(var(--wt),.03);transition:background .15s,color .15s}
.bs button:hover{color:var(--ink)}
.bs button[data-s=buy].on{background:linear-gradient(135deg,#7af0bd,#2fc585);color:#04261a;border-color:transparent;box-shadow:0 8px 20px -12px rgba(61,220,151,.8)}
.bs button[data-s=sell].on{background:linear-gradient(135deg,#ff9aa6,#e5475e);color:#fff;border-color:transparent;box-shadow:0 8px 20px -12px rgba(255,107,125,.8)}
.stp{display:grid;grid-template-columns:32px minmax(0,1fr) 32px;border:1px solid var(--line2);border-radius:12px;overflow:hidden;background:rgba(var(--wt),.035);transition:border-color .15s,box-shadow .15s}
.stp:focus-within{border-color:var(--goldln);box-shadow:0 0 0 3px var(--goldbg)}
.stp input{border:none;border-radius:0;text-align:center;background:none;box-shadow:none!important;padding-left:2px;padding-right:2px;min-width:0}
.stp button{font-size:17px;line-height:1;color:var(--ink2);display:flex;align-items:center;justify-content:center}
.stp button:hover{background:rgba(var(--wt),.06);color:var(--gold)}
.qq{display:flex;gap:4px;flex-wrap:wrap;min-height:20px}
.qq button{font-size:11.5px;padding:1px 9px;border-radius:999px;border:1px solid var(--line2);color:var(--ink2);white-space:nowrap}
.qq button:hover{border-color:var(--goldln);color:var(--gold)}
.krow{display:flex;gap:12px;min-width:0}.krow>.field{flex:1;min-width:0}
.kq{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2);min-height:18px;white-space:nowrap;overflow:hidden}
.kq>*{flex:none}.kq .ell{flex:0 1 auto}
.kq .slg{--s:20px}
.kamt{display:flex;justify-content:space-between;gap:10px;padding:7px 12px;border-radius:12px;background:rgba(var(--wt),.035);border:1px solid var(--line);font-size:13px}
.kamt b{font-size:15px}
/* check the record before it goes to the coach, as a broker app asks before an order is sent */
.cfmw{z-index:70;background:rgba(2,4,10,.55)}
.cfm{width:min(420px,100%);background:var(--mbg);border:1px solid var(--line2);border-radius:22px;box-shadow:var(--shadow);overflow:hidden;animation:pop .2s cubic-bezier(.2,.75,.2,1)}
.cfm-h{display:flex;align-items:center;gap:12px;padding:14px 18px}
.cfm-h.buy{background:linear-gradient(100deg,rgba(61,220,151,.18),transparent)}
.cfm-h.sell{background:linear-gradient(100deg,rgba(255,107,125,.18),transparent)}
.cfm-h h3{font-size:17px}
.cfm-r{display:flex;justify-content:space-between;gap:12px;padding:7px 18px;border-top:1px solid var(--line);font-size:13.5px}
.cfm-r>span{color:var(--mut)}
.cfm-f{display:flex;gap:8px;padding:12px 18px 16px;border-top:1px solid var(--line)}
.cfm-f .btn{flex:1}
:root[data-theme=light] .cfmw{background:rgba(30,38,70,.25)}
@media (max-width:560px){.gls{gap:6px}.gl{padding:7px 11px}.gl p{font-size:12.5px;margin-top:1px}}
/* short laptop screens: dialogs tighten a little so they still fit */
@media (max-height:760px) and (min-width:701px){.mhd{padding-top:14px}.mbd{padding-top:10px;padding-bottom:12px}.mft{padding-bottom:14px}.field{gap:3px}.fgrid{gap:9px}.mbd input,.mbd select{padding-top:7px;padding-bottom:7px}}
@media (max-width:700px){.recf-img>.field{flex:1 0 100%}}
@media (max-height:760px) and (min-width:701px){.recf-f .kopt{display:none}}
@media (max-height:700px) and (min-width:701px){.recf-f .kq{display:none}}
@media (max-height:700px) and (min-width:701px){.recf-f{gap:7px}.recf-f .field{gap:3px}.recf .cmp .cr{padding:4px 12px}.recf .cmp .ch{padding:6px 12px}.mbox:has(.recf) .mbd{padding-top:10px;padding-bottom:10px}.mbox:has(.recf) .mhd .muted{display:none}.kdrop{min-height:0}.recf-f .note-box{padding:7px 10px}}

/* ---------- VVIP finish: gold hairlines and diamonds, a private-client card, a richer backdrop, gold that catches the light.
   Decoration only (pseudo-elements and backgrounds), so every layout and the one-screen fit stay as they are. ---------- */
:root{--goldfx:linear-gradient(135deg,#fdf0c8 0%,#ecc56f 34%,#b9852f 62%,#f6dc9e 100%);--goldline:linear-gradient(90deg,transparent,rgba(240,200,110,.7) 30%,rgba(255,236,190,.9) 50%,rgba(240,200,110,.7) 70%,transparent);
  --panelfx:linear-gradient(180deg,rgba(24,34,62,.95),rgba(10,15,30,.97));--rim:linear-gradient(140deg,rgba(252,226,160,.75),rgba(235,192,98,.12) 28%,rgba(235,192,98,.05) 62%,rgba(252,226,160,.55));
  --bgfx:radial-gradient(1100px 600px at 90% -12%,rgba(235,192,98,.2),transparent 62%),radial-gradient(900px 680px at -12% 112%,rgba(70,110,255,.15),transparent 62%),radial-gradient(760px 460px at 50% 125%,rgba(235,192,98,.08),transparent 66%),repeating-linear-gradient(135deg,rgba(255,255,255,.014) 0 1px,transparent 1px 10px)}
/* every panel carries a fine gold line along its top */
.pnl{position:relative}
.pnl:after{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:var(--goldline);opacity:.55;pointer-events:none}
.kpi{position:relative;overflow:hidden}
.kpi:after{content:"";position:absolute;left:12%;right:12%;top:0;height:1px;background:var(--goldline);opacity:.5}
/* a small gold diamond before each panel title */
.ph h3:before{content:"";display:inline-block;width:6px;height:6px;margin:0 10px 2px 1px;transform:rotate(45deg);background:var(--goldfx);box-shadow:0 0 8px rgba(235,192,98,.55);vertical-align:middle}
.eyebrow{letter-spacing:.16em}
/* the headline card: a gold rim and a seal in the corner */
.pnl.hero{border:1px solid transparent;background:radial-gradient(620px 300px at 0% 0%,rgba(235,192,98,.2),transparent 70%) padding-box,var(--panelfx) padding-box,var(--rim) border-box;box-shadow:0 34px 80px -34px rgba(0,0,0,.85),inset 0 1px 0 rgba(255,240,200,.08)}
.pnl.hero:after{content:"";position:absolute;right:-70px;bottom:-110px;width:300px;height:300px;border-radius:50%;border:1px solid rgba(235,192,98,.14);box-shadow:0 0 0 22px rgba(235,192,98,.025),0 0 0 44px rgba(235,192,98,.018);background:none;opacity:1;left:auto;top:auto;pointer-events:none}
.vvip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px 2px 7px;border-radius:999px;font-size:10px;font-weight:800;letter-spacing:.18em;color:#2a1c03;background:var(--goldfx);box-shadow:0 4px 14px -6px rgba(235,192,98,.8),inset 0 1px 0 rgba(255,255,255,.6);white-space:nowrap;line-height:1.6}
.vvip:before{content:"";width:5px;height:5px;transform:rotate(45deg);background:#2a1c03;opacity:.75}
.mline{display:flex;align-items:center;gap:10px;margin-bottom:6px;min-width:0}
.mline .nm{font-size:12.5px;color:var(--ink2);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* gold buttons catch the light when pointed at */
.btn:not(.ghost):not(.soft):not(.bad),.kbig{position:relative;overflow:hidden}
.btn:not(.ghost):not(.soft):not(.bad):after,.kbig:after{content:"";position:absolute;top:0;bottom:0;left:-70%;width:45%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-20deg);transition:left .7s ease;pointer-events:none}
.btn:not(.ghost):not(.soft):not(.bad):hover:after,.kbig:hover:after{left:135%}
/* tabs and tables in gold */
.seg button.on{background:linear-gradient(180deg,rgba(235,192,98,.24),rgba(235,192,98,.08));color:var(--gold2);box-shadow:inset 0 0 0 1px rgba(235,192,98,.38)}
.ot-h{border-bottom-color:rgba(235,192,98,.22)}
button.ot-r:hover,.ot-r.click:hover{background:linear-gradient(90deg,rgba(235,192,98,.07),rgba(235,192,98,.015) 60%,transparent)}
.ot-r.on{background:linear-gradient(90deg,rgba(235,192,98,.16),rgba(235,192,98,.05) 70%,transparent)}
.av.gold{box-shadow:0 0 0 2px rgba(235,192,98,.35),0 0 18px -2px rgba(235,192,98,.55)}
.mbox{border-color:rgba(235,192,98,.22)}
.menu{border-color:rgba(235,192,98,.2)}
.acct .main .v{background:var(--goldfx);-webkit-background-clip:text;background-clip:text;color:transparent}

/* light theme ("soft daylight"): a pastel aurora behind slightly see-through panels, so every panel
   picks up a little colour; off-white instead of paper-white and softer ink, bright without glare.
   Each kind of panel gets its own pastel tint (--tint). No blur filters, so it stays fast. */
:root[data-theme=light]{color-scheme:light;--bg:#e6eaf3;--bg2:#fbfcfe;--bg3:#eef1f8;--bg4:#d8deeb;--surf:linear-gradient(180deg,rgba(255,255,255,.74),rgba(250,251,255,.64));--line:rgba(30,41,82,.08);--line2:rgba(30,41,82,.14);--ink:#1d2536;--ink2:#46526b;--mut:#6b7790;
  --gold:#a1670f;--gold2:#83530a;--goldbg:rgba(214,150,40,.15);--goldln:rgba(176,118,24,.42);--up:#0a8a63;--upbg:rgba(16,170,120,.13);--dn:#d33a52;--dnbg:rgba(230,70,95,.12);--warn:#b8620b;--warnbg:rgba(240,140,30,.15);--blue:#2f63d6;--bluebg:rgba(60,110,240,.12);--pu:#6b46d6;--pubg:rgba(120,85,240,.12);
  --shadow:0 24px 60px -18px rgba(40,50,110,.32);--glass:rgba(252,253,255,.76);--wt:30,41,82;--hi:rgba(255,255,255,.85);--sh1:0 1px 2px rgba(30,41,82,.04),0 18px 36px -24px rgba(60,72,150,.4);--sh2:0 1px 2px rgba(30,41,82,.05),0 14px 32px -20px rgba(60,72,150,.34);
  --well:rgba(255,255,255,.6);--wellsh:inset 0 1px 2px rgba(30,41,82,.12);--pop:#fbfcfe;--mbg:linear-gradient(180deg,#fdfdff,#f4f6fc);--tipbg:#fbfcfe;--toastbg:#fbfcfe;--scrim:rgba(30,38,70,.3);--sbar:linear-gradient(180deg,rgba(255,255,255,.72),rgba(236,240,255,.62));--avbg:linear-gradient(135deg,#e3e8fb,#ccd5f2);
  --gtxt:linear-gradient(180deg,#d9a03a 0%,#ae7317 48%,#7a4f0b 100%);--note-pu:#5b2bb5;--note-y:#8a4b08;--cash:#d5dbea;--dotfill:#fff;--grid:rgba(30,41,82,.035);--ch:#c0861d;--ch2:#9a6410;--knob:#fff;
  --t-gold:255,229,186;--t-peach:255,219,203;--t-mint:200,243,225;--t-sky:210,227,255;--t-lav:228,219,255;--t-rose:255,216,230;--tint:var(--t-sky);
  --bgfx:radial-gradient(900px 620px at 104% -10%,rgba(255,186,135,.55),transparent 60%),radial-gradient(760px 560px at -6% -14%,rgba(186,166,255,.48),transparent 60%),radial-gradient(900px 640px at -8% 114%,rgba(118,172,255,.46),transparent 62%),radial-gradient(780px 540px at 72% 120%,rgba(104,218,182,.42),transparent 62%)}
:root[data-theme=light] .ot-h,:root[data-theme=light] .ckt-h,:root[data-theme=light] .kv>span:nth-child(odd){background:rgba(30,41,82,.045)}
:root[data-theme=light] .pnl,:root[data-theme=light] .card{background:radial-gradient(640px 260px at 0% 0%,rgba(var(--tint),.95),transparent 75%),linear-gradient(160deg,rgba(var(--tint),.35),rgba(var(--tint),.08) 60%,rgba(var(--tint),.22)),var(--surf);border-color:rgba(255,255,255,.75)}

/* the in-app switch turns all motion off (account menu › เอฟเฟกต์เคลื่อนไหว) */
:root[data-fx=off] *,:root[data-fx=off] *:before,:root[data-fx=off] *:after{animation:none!important;transition:none!important}

/* ===== FX: motion that stays smooth on ordinary laptops and phones. Only transform, opacity, clip and stroke offsets
   are animated (no blur, no filters, no animated shadows), they play once when a page opens, and a slow ambient light
   drifts behind the page. All of it follows the in-app switch (data-fx on <html>, saved as p1m-fx). ===== */
:root{--aur1:rgba(235,192,98,.11);--aur2:rgba(90,130,255,.09)}
:root[data-theme=light]{--aur1:rgba(240,190,100,.26);--aur2:rgba(200,180,250,.3)}
@keyframes fx-draw{to{stroke-dashoffset:0}}
@keyframes fx-fade{from{opacity:0}}
@keyframes fx-growy{from{transform:scaleY(0)}}
@keyframes fx-growx{from{transform:scaleX(0)}}
@keyframes fx-clipx{from{clip-path:inset(-24px 100% -24px -24px)}to{clip-path:inset(-24px -24px -24px -24px)}}
@keyframes fx-arc{from{stroke-dashoffset:var(--arc)}}
@keyframes fx-shine{from{background-position:170% 0,0 0}to{background-position:-70% 0,0 0}}
@keyframes fx-aurora{to{transform:translate3d(7%,-5%,0) rotate(9deg) scale(1.1)}}
@keyframes fx-pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.18)}100%{transform:none;opacity:1}}
:root[data-fx=on] body:after{content:"";position:fixed;inset:-25%;z-index:-1;pointer-events:none;background:radial-gradient(38% 32% at 28% 28%,var(--aur1),transparent 70%),radial-gradient(34% 30% at 72% 68%,var(--aur2),transparent 70%);animation:fx-aurora 30s ease-in-out infinite alternate;will-change:transform}
/* charts: the line draws itself, the area and the points follow */
:root[data-fx=on] .enter .chartw .ln{stroke-dasharray:1;stroke-dashoffset:1;animation:fx-draw 1.5s cubic-bezier(.35,.7,.2,1) .15s forwards}
:root[data-fx=on] .enter .chartw .ar{animation:fx-fade 1.1s ease .55s both}
:root[data-fx=on] .enter .chartw .dt,:root[data-fx=on] .enter .chartw .en{animation:fx-fade .6s ease 1.25s both}
/* bars rise from the zero line one after another; progress bars and rings fill in */
:root[data-fx=on] .enter .mc i{transform-origin:50% 100%;animation:fx-growy .9s cubic-bezier(.2,.8,.2,1) .2s both}
:root[data-fx=on] .enter .mb.neg .mc i{transform-origin:50% 0}
:root[data-fx=on] .enter .mb:nth-child(2) .mc i{animation-delay:.28s}
:root[data-fx=on] .enter .mb:nth-child(3) .mc i{animation-delay:.36s}
:root[data-fx=on] .enter .mb:nth-child(4) .mc i{animation-delay:.44s}
:root[data-fx=on] .enter .mb:nth-child(5) .mc i{animation-delay:.52s}
:root[data-fx=on] .enter .mb:nth-child(6) .mc i{animation-delay:.6s}
:root[data-fx=on] .enter .bar i,:root[data-fx=on] .enter .hw i{transform-origin:0 50%;animation:fx-growx 1s cubic-bezier(.2,.8,.2,1) .3s both}
:root[data-fx=on] .enter .gtrack>i{animation:fx-clipx 1.4s cubic-bezier(.2,.8,.2,1) .3s both}
:root[data-fx=on] .enter .ring .arc{animation:fx-arc 1.3s cubic-bezier(.2,.8,.2,1) .25s both}
:root[data-fx=on] .enter .ibtn .bdg{animation:fx-pop .5s cubic-bezier(.3,1.4,.5,1) .6s both}

  .sbar nav button{flex-direction:column;gap:1px;font-size:10.5px;padding:5px 6px;width:auto;flex:1;border-radius:16px}.sbar nav .l{display:block}.sbar nav button.on:before{display:none}
  .sbar .who{margin:0;padding:2px;background:none;border:none;flex-direction:row}
  .main{order:1}
  .top{height:52px;padding:0 10px;gap:8px}.top h1{font-size:18px}.top .mkt,.top .dl,.top .kbtn kbd,.top .kbtn .l{display:none}.top .kbtn{width:38px;padding:0;justify-content:center}.top .btn .l{display:none}
  .view{padding:2px 8px 10px;gap:10px}
  .kstrip{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mx .os,.cell .s,.colh span,.colh small,.oh .side,.mx .opt,.oh .tag{display:none}.cell{min-width:0;padding:2px}.cell .d{width:24px;height:24px}.mx td,.mx th{padding:4px 2px}.oh .slg{--s:24px!important}
  .vd{grid-template-columns:110px minmax(0,1fr)}
  .roles{grid-template-columns:1fr}
  .v-clients:not(.cs){grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
  .trow{grid-template-columns:46px minmax(0,1fr);gap:4px 10px}.trow>span:first-child{display:none}.trow>.row{grid-column:2;flex-wrap:wrap}
  .k6{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.k6 .kpi{padding:7px 9px;border-radius:14px}.k6 .kpi .v{font-size:15px}.k6 .kpi .v .xs,.k6 .kpi .s,.k6 .kpi .k .ic{display:none}.k6 .kpi .k{font-size:11.5px}
  .grow{grid-template-columns:3px 28px minmax(0,1fr)}.grow .acts{grid-column:2/-1;justify-content:flex-end;flex-wrap:wrap}
  .v-record .vh>.muted{display:none}.v-record .chips{flex-wrap:nowrap;overflow:hidden}.v-record .chip{padding:4px 9px;font-size:12.5px}
  .vd{grid-template-columns:minmax(0,1fr);gap:10px}.vd-slip,.qchips,.vd-info .field>label{display:none}.vd-mt{display:flex}.vd-info{gap:6px}.vd-info textarea{min-height:42px}.vd .cmpt td,.vd .cmpt th{padding:3px 6px}.cmpt td,.cmpt th{padding:4px 6px;font-size:12.5px}
  .vd-info>.row{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px;align-items:center}.vd-info>.row .btn{padding:7px 8px;font-size:13px}.vd-info .lgx{display:none}.vd-info .shx{display:inline}
  .modal{align-items:flex-end;padding:0}.mbox{border-radius:22px 22px 0 0;max-height:100dvh}
  .arow{grid-template-columns:70px minmax(0,1fr)}.arow .who,.tbl .opt2{display:none}
  .chd .lgx{display:none}.chd .shx{display:inline}.chd .seg button{padding:5px 9px;font-size:12.5px}.chd .seg{max-width:100%}
  .v-apps .vh>.muted{display:none}.v-apps .vh .chips{flex-wrap:nowrap;overflow:hidden}.v-apps .chip{padding:4px 9px;font-size:12.5px}.arow2{grid-template-columns:30px minmax(0,1fr) auto;gap:8px}.arow2 .opt{display:none}
  #toasts{left:10px;right:10px;bottom:84px}
}

/* Port 1M mockup: data and helpers shared by the client journal and the back office.
   Both pages keep one dataset in localStorage (KEY), so a trade the coach records shows up on
   the client's journal and a screenshot the client sends lands in the coach's queue.
   Everything typed by a user is validated on the way in and escaped on the way out. */

const KEY = 'p1m-mockup-v11';
// program terms (CEO's announcement): tuition 1,000,000 baht, refund = 1,000,000 - profit (full refund
// with no profit or a loss), anything above 1,000,000 profit is the client's; ports of 5,000,000+ baht,
// 6-12 months with a coach; at most 50 clients per intake, chosen by interview
const TUITION = 1000000, GOAL = 1000000, MIN_PORT = 5000000;
// markets the program covers; k on a record turns price x quantity into baht (multiplier x exchange rate)
const MARKETS = { th: ['หุ้นไทย', 'หุ้น'], block: ['Block Trade', 'สัญญา'], tfex: ['TFEX', 'สัญญา'], gold: ['ทองคำ', 'หน่วย'], us: ['หุ้นอเมริกา', 'หุ้น'], opt: ['Options', 'สัญญา'], fut: ['Futures', 'สัญญา'] };
const unitOf = x => MARKETS[x?.mk || 'th'][1];
const mkName = x => MARKETS[x?.mk || 'th'][0];
const TZ = 7 * 3600e3, DAY = 86400e3, HR = 3600e3, MIN = 60e3;
const BASE = Date.UTC(2026, 9, 7, 3, 42);   // พ. 7 ต.ค. 2569 10:42 เวลาไทย = "ตอนนี้" ของเดโม
const COURSE_START = Date.UTC(2026, 6, 1);  // 1 ก.ค. 2569
// SET market holidays 2569, from set.or.th (ปฏิทินวันหยุด ตลท.)
const HOLIDAYS = ['2026-01-01', '2026-01-02', '2026-03-03', '2026-04-06', '2026-04-13', '2026-04-14', '2026-04-15', '2026-05-01', '2026-05-04', '2026-06-01', '2026-06-03',
  '2026-07-28', '2026-07-29', '2026-08-12', '2026-10-13', '2026-10-16', '2026-10-23', '2026-12-07', '2026-12-10', '2026-12-31'];
const FEATURED = 'u01';                      // ลูกค้าตัวอย่างที่ใช้ในหน้าบ้าน
const MARKET_CLOSE = [16, 30];
const STAFF_IDLE = 30 * MIN;                 // หลังบ้านออกจากระบบเองเมื่อไม่ใช้งาน

/* ---------- format ---------- */
const TH_M = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
const TH_D = ['อา.', 'จ.', 'อ.', 'พ.', 'พฤ.', 'ศ.', 'ส.'];
const TH_DAY = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์'];
const pad = n => String(n).padStart(2, '0');
// only https links to LINE (a coach's or CS's LINE profile / official account)
const safeLink = u => typeof u === 'string' && /^https:\/\/(line\.me|lin\.ee)\//.test(u) ? u : '';
// image data (data: URL) as a short blob: link, so pages that repeat a picture don't copy its bytes into the HTML each time
function blobOf(d) {
  try { const b = atob(d.slice(d.indexOf(',') + 1)), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return URL.createObjectURL(new Blob([u], { type: d.slice(5, d.indexOf(';')) })); }
  catch (e) { return d; }
}
const fmt = (n, d = 0) => Number(n).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const px = n => fmt(n, 2);
const baht = n => fmt(Math.round(n));
const sgn = n => (n > 0 ? '+' : n < 0 ? '−' : '');
const signed = n => sgn(n) + baht(Math.abs(n));
const pct = (n, d = 1) => sgn(n) + fmt(Math.abs(n * 100), d) + '%';
const kb = n => (n = n + 0) < 0 ? '-' + kb(-n) : n >= 1e6 ? fmt(n / 1e6, n % 1e6 ? 2 : 0) + 'M' : n >= 1e3 ? fmt(n / 1e3, n % 1e3 ? 1 : 0) + 'K' : fmt(n);
const tz = ms => new Date(ms + TZ);
const dstr = ms => { const d = tz(ms); return d.getUTCDate() + ' ' + TH_M[d.getUTCMonth()]; };
const tstr = ms => { const d = tz(ms); return pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes()); };
const dt = ms => dstr(ms) + ' ' + tstr(ms);
const wd = ms => TH_D[tz(ms).getUTCDay()];
const dlong = ms => { const d = tz(ms); return `${TH_DAY[d.getUTCDay()]} ${d.getUTCDate()} ${TH_M[d.getUTCMonth()]} ${String(d.getUTCFullYear() + 543).slice(2)}`; };
const dayKey = ms => Math.floor((ms + TZ) / DAY);
const esc = s => String(s ?? '').replace(/[&<>"'`]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;', '`': '&#96;' }[c]));
function when(ms, now) {

   keys the trade in here with the screenshot attached (or the coach keys it in for them), and the
   coach confirms it. The coach's plan (Entry, Stop Loss, TP) is kept so every record can be checked

function tradingDays() {

  for (let t = COURSE_START; t <= Date.UTC(2026, 9, 7); t += DAY) {
    const d = new Date(t), w = d.getUTCDay();
    if (w === 0 || w === 6 || HOLIDAYS.includes(d.toISOString().slice(0, 10))) continue;
    out.push(t);
  }
  return out;
}

  const r = {};
  if (!p) { r.plan = 'no'; r.proof = e.slip ? 'ok' : 'no'; return r; }
  if (e.side === 'buy') {
    r.px = e.px >= p.lo - 1e-9 && e.px <= p.hi + 1e-9 ? 'ok' : 'bad';
    r.qty = !e.pq || Math.abs(e.qty - e.pq) / e.pq <= .1 ? 'ok' : 'bad';
  } else r.sell = e.why === 'self' || (e.why === 'cut' && e.px < slAt(p, e.at) * .97) ? 'bad' : 'ok';
  r.proof = e.slip ? 'ok' : 'no';

}

/* ---------- plan geometry ---------- */
const sgnR = r => `${r > .05 ? '+' : r < -.05 ? '−' : ''}${fmt(Math.abs(r), 1)}R`;
const rrOf = (op, tp) => (tp - op.hi) / (op.hi - op.sl);
// one-line ladder: risk (red) from the stop to the entry, room (green) up to TP2, TP1 tick, latest close dot
function miniLadder(op, last, sl = op.sl) {
  const a = Math.min(sl, op.sl, last ?? sl), b = Math.max(op.tp2, last ?? op.tp2), pad = (b - a) * .05, lo = a - pad, hi = b + pad;
  const X = p => (p - lo) / (hi - lo) * 100, w = (p, q) => Math.max(0, X(q) - X(p)).toFixed(1);
  const lock = sl >= op.hi;
  return `<span class="mlad" aria-hidden="true">${lock ? `<i class="lk" style="left:${X(op.hi).toFixed(1)}%;width:${w(op.hi, sl)}%"></i>` : `<i class="rk" style="left:${X(sl).toFixed(1)}%;width:${w(sl, op.hi)}%"></i>`}<i class="rw" style="left:${X(op.hi).toFixed(1)}%;width:${w(op.hi, op.tp2)}%"></i><i class="t1" style="left:${X(op.tp1).toFixed(1)}%"></i>${last ? `<i class="lp ${last >= op.hi ? 'up' : last > sl ? 'warn' : 'dn'}" style="left:${X(last).toFixed(1)}%"></i>` : ''}</span>`;
}
// small countdown ring: how much of the response window is left
function cdRing(left, total, size = 34) {
  const f = Math.max(0, Math.min(1, left / total)), r = (size - 4) / 2, c = 2 * Math.PI * r;
  return `<svg class="cdr" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke-width="3" style="stroke:rgba(var(--wt),.1)"/><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke-width="3" stroke-linecap="round" style="stroke:var(--${f < .2 ? 'dn' : 'blue'})" stroke-dasharray="${(c * f).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 ${size / 2} ${size / 2})"/></svg>`;
}

/* ---------- search everywhere (Ctrl/⌘ + K): pages, plans, clients, stocks and actions ---------- */
let cmdItems = () => [];   // each site supplies its own list
function cmdk() {
  const all = cmdItems();
  if (!all.length) return;
  let q = '', sel = 0, shown = [];
  const box = openModal(`<div class="ck-in">${ic('search', 19)}<input id="ckq" placeholder="ค้นหาหน้า หุ้น แผน หรือสิ่งที่ต้องการทำ" autocomplete="off" spellcheck="false" maxlength="40" aria-label="ค้นหา"><kbd>Esc</kbd></div><div class="ck-l" id="ckl" role="listbox"></div><div class="ck-f"><span><kbd>↑</kbd><kbd>↓</kbd> เลือก</span><span><kbd>Enter</kbd> เปิด</span><span class="sp"></span><span><kbd>Ctrl</kbd><kbd>K</kbd></span></div>`, 'cmdk');
  const list = $('#ckl', box), inp = $('#ckq', box);
  const draw = () => {
    const w = q.trim().toLowerCase();
    const hit = it => !w || (it.t + ' ' + (it.s || '') + ' ' + (it.k || '')).toLowerCase().includes(w);
    const rank = it => (it.t.toLowerCase().startsWith(w) ? 0 : 1);
    shown = all.filter(hit).sort((a, b) => (w ? rank(a) - rank(b) : 0)).slice(0, 8);
    sel = Math.min(sel, Math.max(0, shown.length - 1));
    let g = '';
    list.innerHTML = shown.length ? shown.map((it, i) => { const head = it.g !== g ? `<div class="ck-g">${esc(it.g)}</div>` : ''; g = it.g; return `${head}<button class="ck-i ${i === sel ? 'on' : ''}" data-i="${i}" role="option" aria-selected="${i === sel}">${it.sym ? slogo(it.sym, 28) : `<span class="ck-ic">${ic(it.ic || 'chev', 16)}</span>`}<span class="ell"><b>${esc(it.t)}</b>${it.s ? ` <span class="muted xs">${esc(it.s)}</span>` : ''}</span>${i === sel ? '<kbd>Enter</kbd>' : ''}</button>`; }).join('')
      : `<div class="empty">ไม่พบ “${esc(q)}”</div>`;
  };
  const run = i => { const it = shown[i]; if (!it) return; closeModal(); it.run(); };
  inp.addEventListener('input', () => { q = inp.value; sel = 0; draw(); });
  inp.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); sel = (sel + (e.key === 'ArrowDown' ? 1 : -1) + shown.length) % Math.max(1, shown.length); draw(); }
    else if (e.key === 'Enter') { e.preventDefault(); run(sel); }
  });
  list.addEventListener('click', e => { const b = e.target.closest('[data-i]'); if (b) run(+b.dataset.i); });
  list.addEventListener('mousemove', e => { const b = e.target.closest('[data-i]'); if (b && +b.dataset.i !== sel) { sel = +b.dataset.i; list.querySelectorAll('.ck-i').forEach((x, i) => { x.classList.toggle('on', i === sel); x.setAttribute('aria-selected', i === sel); }); } });
  draw();
}

function ring(score, size = 64, stroke = 6) {

/* ---------- fit-to-screen paging: long lists flip pages instead of scrolling ---------- */
const PG = {}, PGN = {};
function fitPagers(root = document) {
  $$('[data-pg]', root).forEach(box => {
    const key = box.dataset.pg, rows = [...box.children];
    if (!box.offsetParent && !box.getClientRects().length) return;   // panel hidden behind a tab
    const area = box.closest('.pb') || box.parentElement;
    // a totals row under the list (Deal Summary) stays on screen too
    const tail = () => { let h = 0; for (let n = box.nextElementSibling; n; n = n.nextElementSibling) h += n.getBoundingClientRect().height; return h; };
    const limit = () => area.getBoundingClientRect().bottom - (parseFloat(getComputedStyle(area).paddingBottom) || 0) - tail();
    const gap = parseFloat(getComputedStyle(box).rowGap) || 0;
    const nav = document.querySelector(`[data-pgn="${key}"]`);
    const setNav = () => { if (nav) nav.innerHTML = n > 1 ? `<button data-pgp="${key}" ${p ? '' : 'disabled'} aria-label="หน้าก่อน">${ic('back', 15)}</button><span class="num">${p + 1}/${n}</span><button data-pgx="${key}" ${p < n - 1 ? '' : 'disabled'} aria-label="หน้าถัดไป">${ic('chev', 15)}</button>` : ''; };
    let pages, n, p, slack = 0;
    // the page buttons and table re-flow can change the room left, so check the page really fits and re-split if not
    for (let tries = 0; tries < 4; tries++) {
      rows.forEach(r => { r.hidden = false; });
      const avail = limit() - box.getBoundingClientRect().top - slack;
      pages = [];
      let cur = [], used = 0;
      for (const r of rows) {
        const h = r.getBoundingClientRect().height;
        if (cur.length && used + h > avail + .5) { pages.push(cur); cur = []; used = 0; }
        cur.push(r); used += h + gap;
      }
      if (cur.length) pages.push(cur);
      n = Math.max(1, pages.length); p = Math.max(0, Math.min(PG[key] || 0, n - 1));
      rows.forEach(r => { r.hidden = true; });
      (pages[p] || []).forEach(r => { r.hidden = false; });
      setNav();
      const over = box.getBoundingClientRect().bottom - limit();
      if (over <= .5 || (pages[p] || []).length < 2) break;
      slack += over;
    }

}

  const box = $(`[data-pg="${key}"]`); if (!box || !$(sel, box)) return;

/* ---------- theme: light, dark or follow the device (one setting for both sites) ---------- */

  const apply = () => { try { p === 'system' ? localStorage.removeItem(THEME_KEY) : localStorage.setItem(THEME_KEY, p); } catch {} applyTheme(); render(); };
  if (themeOf(p) === themeNow() || !document.startViewTransition || document.documentElement.dataset.fx === 'off') return apply();
  const r = from?.getBoundingClientRect(), x = r ? r.left + r.width / 2 : innerWidth - 40, y = r ? r.top + r.height / 2 : 30;

document.addEventListener('click', e => {
  const f = e.target.closest('[data-theme-flip]'), s = e.target.closest('[data-theme-set]');

/* ---------- modal and toast ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

function openModal(html, cls = '') {

  m.firstChild.addEventListener('mousedown', e => { if (e.target.dataset.close) closeModal(); });

function toast(html, kind = '') {
  const t = document.createElement('div'); t.className = 'toast ' + kind; t.setAttribute('role', 'status'); t.innerHTML = html;
  const box = $('#toasts'); box.appendChild(t);

document.addEventListener('keydown', e => {
  if (!$('#modal')?.innerHTML) return;

  if (e.key === 'Tab') {
    const f = $$('#modal button:not([disabled]),#modal input:not([type=file]),#modal textarea,#modal select,#modal a[href]').filter(x => x.offsetParent);

    else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }

const AV = {

const AV_K = ['skin', 'hair', 'hairC', 'outfit', 'color', 'acc'];

/* ---------- drawing helpers ---------- */

/* ---------- one character, drawn with its feet at (o.x, o.y): o.s scale, o.t seconds, o.walk, o.phase, o.face f/l/r/b ---------- */

    else if (a.outfit === 1) { poly(ctx, [[-3.8, -26.5], [0, -23.6], [-1.6, -21.8]], '#ffffff'); poly(ctx, [[3.8, -26.5], [0, -23.6], [1.6, -21.8]], '#ffffff'); ctx.fillStyle = 'rgba(255,255,255,.75)'; dot(ctx, 0, -20.5, .7); dot(ctx, 0, -17, .7); dot(ctx, 0, -13.5, .7); }

    else { poly(ctx, [[-4, -26.5], [0, -24.4], [-2, -22.2]], '#f6f3ec'); poly(ctx, [[4, -26.5], [0, -24.4], [2, -22.2]], '#f6f3ec'); ctx.fillStyle = '#e8bf62'; dot(ctx, 3.6, -20.5, 1); }

// each coach looks different (by their number); everyone wears a suit
function staffLook(id) {

const FACES = {};

<script>
/* ===== Back office: 10 coaches + 1 CS =====
   Coaches talk to their clients by phone or in person; nothing is sent to clients from here.
   After a client trades, the client keys the trade with the screenshot attached; the coach checks it
   against the picture and confirms it (or sends it back to fix), the system checks it against the
   coach's plan, and the team clears anything off-plan with the client and notes it. CS also runs
   the intake: applicants with a port of 5,000,000+ are interviewed and up to 50 are chosen.
   Roles here are only a demo switch kept in sessionStorage. The real system signs staff in
   with Google, keeps the session in an httpOnly cookie and checks every request on the server. */
S = load();
let view = null, selCl = null, selEx = null, selApp = null, aFilter = 'all', clTab = 'prof', rFilter = 'pend', tFilter = 'all', teamTab = 'staff', q = '', fCoach = '', fStat = 'all', sortBy = 'score', menu = null;
const ME = () => { const id = sessionStorage.getItem('p1m-bo'); return id === 'cs' ? S.cs : id === 'head' ? S.head : id ? coach(id) : null; };
const isCS = () => ME()?.id === 'cs';
// the head coach checks every record clients send and writes every plan; coaches follow up their clients and key records for them
const isHead = () => ME()?.id === 'head';
const isCoach = () => !!coach(ME()?.id);
const seeAll = () => isCS() || isHead();
const roleOf = () => isCS() ? 'cs' : isHead() ? 'head' : 'coach';
const mine = () => seeAll() ? S.clients : S.clients.filter(c => c.coach === ME().id);
// a coach may only open their own clients; CS and the head coach may open everyone
const canSee = id => { const c = id && client(id); return !!c && !!ME() && (seeAll() || c.coach === ME().id); };
const narrow = () => matchMedia('(max-width: 900px)').matches;

// sparkline that stretches to fill its box (no text, so stretching is fine)
function sparkFill(vals) {
  const lo = Math.min(...vals), hi = Math.max(...vals), n = Math.max(1, vals.length - 1), col = vals[vals.length - 1] >= vals[0] ? 'var(--up)' : 'var(--dn)';
  const pts = vals.map((v, i) => `${(i / n * 200).toFixed(1)},${(56 - (v - lo) / (hi - lo || 1) * 52).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 200 60" preserveAspectRatio="none" aria-hidden="true"><polyline fill="none" style="stroke:${col}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" points="${pts}"/></svg>`;
}
// a client's growth since joining: cumulative profit at each Friday's close and today, filled down to zero
function growth(c, w = 120, h = 36) {
  const v = profitSeries(c).map(p => p.v), lo = Math.min(0, ...v), hi = Math.max(0, ...v), n = Math.max(1, v.length - 1);
  const X = i => (2 + i / n * (w - 7)).toFixed(1), Y = x => (h - 4 - (x - lo) / (hi - lo || 1) * (h - 8)).toFixed(1);
  const line = v.map((x, i) => `${X(i)},${Y(x)}`).join(' '), col = v[v.length - 1] >= 0 ? 'var(--up)' : 'var(--dn)';
  return `<svg class="grw" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><line class="z" x1="2" x2="${w - 2}" y1="${Y(0)}" y2="${Y(0)}"/><polygon points="${X(0)},${Y(0)} ${line} ${X(v.length - 1)},${Y(0)}" style="fill:${col}"/><polyline points="${line}" style="stroke:${col}"/><circle cx="${X(v.length - 1)}" cy="${Y(v[v.length - 1])}" r="2.8" style="fill:${col}"/></svg>`;
}
