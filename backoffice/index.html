<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-n2GZ91ldLdlGdTeM3Va3+974nQlzCjFFZvAEalorsns=' 'sha256-CuOz+YdXn4gCMb9sURVBv+IQuo/zBlfz8KVP7/Gk/vM='; style-src 'unsafe-inline'; img-src data: blob:; base-uri 'none'; form-action 'none'; object-src 'none'">
<title>หลังบ้าน · ปั้นพอร์ต 1 ล้าน (ต้นแบบ)</title>
<style>
/* Port 1M look: midnight navy + champagne gold, glass panels over a soft aurora.
   One screen, no page scroll: long lists page inside their panel. */
:root{--bg:#05080f;--bg2:#0d1426;--bg3:#131c33;--bg4:#1b2643;--surf:linear-gradient(180deg,rgba(24,34,62,.72),rgba(12,18,35,.74));--line:rgba(150,172,232,.085);--line2:rgba(150,172,232,.17);--ink:#f2f5fc;--ink2:#bdc6da;--mut:#8590aa;--gold:#ebc062;--gold2:#f8df9c;--goldbg:rgba(235,192,98,.12);--goldln:rgba(235,192,98,.45);--up:#3ddc97;--upbg:rgba(61,220,151,.12);--dn:#ff6b7d;--dnbg:rgba(255,107,125,.13);--warn:#f5b544;--warnbg:rgba(245,181,68,.13);--blue:#7ea6ff;--bluebg:rgba(126,166,255,.13);--pu:#b69cff;--pubg:rgba(182,156,255,.13);--shadow:0 24px 60px -12px rgba(0,0,0,.65);--btn:linear-gradient(135deg,#fde7a8 0%,#ebc062 45%,#c98f2b 100%);--glass:rgba(10,15,29,.72);--r:20px}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:"Leelawadee UI","Leelawadee","Sukhumvit Set","Thonburi","Noto Sans Thai",Tahoma,sans-serif;color:var(--ink);font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased;
  background:radial-gradient(1000px 560px at 88% -14%,rgba(235,192,98,.16),transparent 62%),radial-gradient(900px 640px at -12% 112%,rgba(70,110,255,.14),transparent 62%),radial-gradient(700px 420px at 55% 120%,rgba(61,220,151,.05),transparent 65%),var(--bg)}
/* faint chart-paper grid behind everything */
body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);background-size:46px 46px;-webkit-mask-image:radial-gradient(ellipse 90% 70% at 50% 0%,#000 10%,transparent 75%);mask-image:radial-gradient(ellipse 90% 70% at 50% 0%,#000 10%,transparent 75%)}
#app{height:100%;position:relative}
h1,h2,h3,h4{line-height:1.3;margin:0}
button{font-family:inherit;font-size:14.5px;cursor:pointer;color:inherit;background:none;border:none;padding:0}
button:disabled{cursor:not-allowed;opacity:.42}
input,textarea,select{font-family:inherit;font-size:15px;color:var(--ink);background:rgba(255,255,255,.035);border:1px solid var(--line2);border-radius:12px;padding:9px 12px;outline:none;width:100%;transition:border-color .15s,box-shadow .15s}
input:focus,textarea:focus,select:focus{border-color:var(--goldln);box-shadow:0 0 0 3px var(--goldbg)}
input[aria-invalid=true]{border-color:rgba(255,107,125,.6)}
textarea{resize:none;min-height:64px}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
select option{background:var(--bg2)}
:focus-visible{outline:2px solid var(--goldln);outline-offset:2px}
a{color:inherit}
.ic{flex:none;display:inline-block;vertical-align:middle}
.num{font-variant-numeric:tabular-nums lining-nums}
.serif{font-family:Georgia,"Times New Roman",serif}
.muted{color:var(--mut)}.ink2{color:var(--ink2)}.gold{color:var(--gold)}.up{color:var(--up)}.dn{color:var(--dn)}.warn{color:var(--warn)}.ok{color:var(--up)}
.gtxt{background:linear-gradient(180deg,#fff4d2 0%,#f3d07e 45%,#d29a35 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.sm{font-size:13.5px}.xs{font-size:12.5px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

/* app shell: everything fits the screen, long lists page instead of scrolling */
.app{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.view{flex:1;min-height:0;width:100%;max-width:1440px;margin:0 auto;padding:14px 22px 18px;display:grid;gap:14px;overflow:hidden}
.view.enter>*{animation:rise .5s cubic-bezier(.2,.75,.2,1) both}
.view.enter>*:nth-child(2){animation-delay:.04s}.view.enter>*:nth-child(3){animation-delay:.08s}.view.enter>*:nth-child(4){animation-delay:.12s}.view.enter>*:nth-child(5){animation-delay:.16s}.view.enter>*:nth-child(n+6){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.vh{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-width:0;grid-column:1/-1}
.vh h1{font-size:22px;white-space:nowrap;letter-spacing:-.005em}
.vh p{margin:0;color:var(--mut);font-size:13.5px}
.span{grid-column:1/-1}
.pnl,.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);box-shadow:inset 0 1px 0 rgba(255,255,255,.045),0 18px 40px -22px rgba(0,0,0,.75);-webkit-backdrop-filter:blur(18px) saturate(130%);backdrop-filter:blur(18px) saturate(130%)}
.pnl{display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.ph{display:flex;align-items:center;gap:10px;padding:14px 18px 10px;min-height:50px;flex:none}
.ph h3{font-size:15.5px;white-space:nowrap;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto}
.ph .sub{font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pb{flex:1;min-height:0;overflow:hidden;padding:0 16px 14px;position:relative}
.pgn{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mut);flex:none}
.pgn:empty{display:none}
.pgn button{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink2);background:rgba(255,255,255,.04);border:1px solid var(--line)}
.pgn button:hover:not(:disabled){color:var(--gold);border-color:var(--goldln)}
.list{display:flex;flex-direction:column;gap:8px}
.list.tight{gap:0}
.kstrip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;grid-column:1/-1;align-content:start}
.kpi{background:radial-gradient(150px 90px at 100% 0%,rgba(235,192,98,.08),transparent 70%),var(--surf);border:1px solid var(--line);border-radius:18px;padding:12px 16px;min-width:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.045)}
.kpi .k{font-size:12.5px;color:var(--mut);display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden}
.kpi .v{font-size:22px;font-weight:700;margin-top:1px;white-space:nowrap;letter-spacing:-.01em}
.kpi .s{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chartbox{position:relative;min-height:0;min-width:0;flex:1}
.empty{padding:22px;text-align:center;color:var(--mut);font-size:14px}
.empty .ic{display:block;margin:0 auto 8px;color:var(--up)}
/* narrow screens: panels become tabs instead of stacking */
.vgrid.tabbed{display:flex!important;flex-direction:column}
.vgrid.tabbed>.pt-off{display:none!important}
.vgrid.tabbed>[data-pt]{flex:1 1 auto;min-height:0}
.ptabs{flex:none;align-self:flex-start;max-width:100%}

/* cards */
.pad{padding:18px 20px}
.eyebrow{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:700}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:999px;padding:9px 18px;font-weight:700;font-size:14.5px;background:var(--btn);color:#211703;white-space:nowrap;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 8px 22px -10px rgba(235,192,98,.75);transition:filter .15s,transform .15s,box-shadow .15s}
.btn:hover:not(:disabled){filter:brightness(1.06);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 10px 26px -8px rgba(235,192,98,.8)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.ghost{background:rgba(255,255,255,.03);border:1px solid var(--line2);color:var(--ink);font-weight:600;box-shadow:none}
.btn.ghost:hover:not(:disabled){border-color:var(--goldln);color:var(--gold);box-shadow:none}
.btn.soft{background:rgba(255,255,255,.07);color:var(--ink);font-weight:600;box-shadow:none}
.btn.soft:hover:not(:disabled){background:rgba(255,255,255,.11);box-shadow:none}
.btn.ok{background:linear-gradient(135deg,#7af0bd,#2fc585);color:#04261a;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 8px 22px -10px rgba(61,220,151,.7)}
.btn.bad{background:transparent;border:1px solid rgba(255,107,125,.4);color:var(--dn);font-weight:600;box-shadow:none}
.btn.sm{padding:6px 13px;font-size:13.5px}
.btn.lg{padding:12px 26px;font-size:16px}
.btn.block{width:100%}
.lnk{color:var(--gold);font-weight:600;display:inline-flex;align-items:center;gap:3px}
.lnk:hover{text-decoration:underline}
.ibtn{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink2);position:relative;flex:none;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.ibtn:hover{color:var(--ink);border-color:var(--line2)}
.ibtn .bdg{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;padding:0 4px;border-radius:999px;background:var(--dn);color:#fff;font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg);box-shadow:0 0 12px rgba(255,107,125,.6)}
.demob{display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--goldln);color:var(--gold);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:700;flex:none;background:rgba(235,192,98,.05)}

/* tags and chips */
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;line-height:1.5;padding:2px 9px;border-radius:999px;background:rgba(255,255,255,.07);color:var(--ink2);white-space:nowrap;font-weight:600}
.tag.ok{background:var(--upbg);color:var(--up)}
.tag.dn{background:var(--dnbg);color:var(--dn)}
.tag.warn{background:var(--warnbg);color:var(--warn)}
.tag.blue{background:var(--bluebg);color:var(--blue)}
.tag.pu{background:var(--pubg);color:var(--pu)}
.tag.gold{background:var(--goldbg);color:var(--gold)}
.tag.line{background:transparent;border:1px solid var(--line2)}
.side{display:inline-flex;align-items:center;justify-content:center;min-width:44px;font-size:11.5px;font-weight:800;letter-spacing:.06em;padding:3px 8px;border-radius:8px;flex:none}
.side.buy{background:var(--upbg);color:var(--up);box-shadow:inset 0 0 0 1px rgba(61,220,151,.25)}
.side.sell{background:var(--dnbg);color:var(--dn);box-shadow:inset 0 0 0 1px rgba(255,107,125,.25)}
.side.sl{background:var(--goldbg);color:var(--gold);box-shadow:inset 0 0 0 1px rgba(235,192,98,.25)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 13px;border-radius:999px;border:1px solid var(--line2);color:var(--ink2);font-size:13.5px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;background:rgba(255,255,255,.02)}
.chip:hover{color:var(--ink)}
.chip.on{background:var(--goldbg);color:var(--gold);border-color:var(--goldln);font-weight:700}
.chip .n{font-size:11.5px;background:rgba(255,255,255,.08);color:var(--ink2);border-radius:999px;padding:0 7px}
.chip.on .n{background:rgba(235,192,98,.2);color:var(--gold)}
.seg{display:inline-flex;background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;max-width:100%;overflow:hidden}
.seg button{padding:6px 14px;border-radius:999px;color:var(--ink2);font-size:14px;white-space:nowrap;display:inline-flex;gap:6px;align-items:center;transition:background .15s,color .15s}
.seg button:hover{color:var(--ink)}
.seg button.on{background:rgba(255,255,255,.1);color:var(--ink);font-weight:700;box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.seg .n{font-size:11.5px;background:var(--goldbg);color:var(--gold);border-radius:999px;padding:0 7px;font-weight:700}

/* stock logo + company card */
.slg{--s:28px;width:var(--s);height:var(--s);flex:none;border-radius:calc(var(--s)*.3);background:#fff;display:inline-flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.1),0 4px 12px -4px rgba(0,0,0,.6);vertical-align:middle}
.slg img{width:100%;height:100%;object-fit:contain;display:block}
.slg.mono{background:linear-gradient(135deg,hsl(var(--h) 55% 42%),hsl(calc(var(--h) + 40) 50% 26%));color:#fff;font-size:calc(var(--s)*.36);font-weight:800;letter-spacing:.02em}
.sy{display:inline-flex;align-items:center;gap:9px;min-width:0;vertical-align:middle;text-align:left}
.sy b{letter-spacing:.02em;white-space:nowrap}
button.sy:hover b{color:var(--gold2)}
button.sy:hover .slg{box-shadow:0 0 0 2px var(--goldln),0 4px 12px -4px rgba(0,0,0,.6)}
.slb{flex:none;display:flex;border-radius:12px}
.slb:hover .slg{box-shadow:0 0 0 2px var(--goldln)}
.jm{display:flex;gap:10px;align-items:center;min-width:0}
.sline{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.035);border:1px solid var(--line)}
.sline .r{display:flex;flex-direction:column;align-items:flex-end;line-height:1.35}
.stm{padding:20px 22px 18px;display:flex;flex-direction:column;gap:14px}
.stm-h{display:flex;gap:14px;align-items:center}
.stm-h h3{font-size:24px;letter-spacing:.02em}
.stm-h .x{margin-left:auto;align-self:flex-start;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--mut);flex:none}
.stm-h .x:hover{background:rgba(255,255,255,.06);color:var(--ink)}
.stm-p{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.stm-p>.num:first-child{font-size:34px;font-weight:700;letter-spacing:-.01em}
.stm-p .tag{font-size:13.5px;padding:3px 11px}
.stm-r .r52{position:relative;height:8px;border-radius:999px;margin-top:8px;background:linear-gradient(90deg,rgba(255,107,125,.55),rgba(245,181,68,.55),rgba(61,220,151,.55))}
.stm-r .r52 i{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 0 0 4px rgba(255,255,255,.18),0 2px 8px rgba(0,0,0,.5)}
.stm-k{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stm-k div{padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--line);min-width:0}
.stm-k span{display:block;font-size:12px;color:var(--mut)}
.stm-k b{font-size:15.5px;white-space:nowrap}

/* plan-vs-actual marks */
.checks{display:inline-flex;gap:4px;flex-wrap:wrap}
.ck{display:inline-flex;align-items:center;gap:3px;font-size:12px;padding:1px 7px 1px 5px;border-radius:6px;font-weight:600}
.ck.ok{background:var(--upbg);color:var(--up)}
.ck.bad{background:var(--warnbg);color:var(--warn)}
.ck.no{background:var(--dnbg);color:var(--dn)}
.dots{display:inline-flex;gap:3px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--bg4)}
.dots i.ok{background:var(--up)}.dots i.bad{background:var(--warn)}.dots i.no,.dots i.exp{background:var(--dn)}.dots i.pend{background:var(--blue);box-shadow:0 0 8px rgba(126,166,255,.7)}.dots i.skip{background:transparent;box-shadow:inset 0 0 0 1.5px var(--warn)}.dots i.cancel{background:var(--bg4)}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-weight:600;color:var(--mut);font-size:12.5px;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:none}
.tbl .r{text-align:right}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr.click:hover td{background:rgba(255,255,255,.03)}

/* progress */
.bar{height:7px;border-radius:999px;background:rgba(255,255,255,.07);overflow:hidden;position:relative}
.bar>i{position:absolute;inset:0 auto 0 0;border-radius:inherit;background:var(--btn)}
.bar.up>i{background:linear-gradient(90deg,#1fa970,var(--up))}.bar.warn>i{background:linear-gradient(90deg,#c98a1c,var(--warn))}.bar.dn>i{background:linear-gradient(90deg,#c9374b,var(--dn))}

/* avatar */
.av{width:36px;height:36px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14.5px;background:linear-gradient(135deg,#2c3d68,#18223d);color:var(--ink);border:1px solid var(--line2)}
.av.gold{background:var(--btn);color:#211703;border:none;box-shadow:0 0 0 2px rgba(235,192,98,.25)}
.av.lg{width:52px;height:52px;font-size:19px}
.av.sm{width:28px;height:28px;font-size:12px}

/* score ring */
.ring{position:relative;flex:none}
.ring svg{display:block;transform:rotate(-90deg);overflow:visible}
.ring .arc{filter:drop-shadow(0 0 6px currentColor)}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800}

/* forms */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label{font-size:13px;color:var(--ink2);font-weight:600}
.field .hint{font-size:12px;color:var(--mut)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.drop{border:1.5px dashed var(--line2);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:12px;cursor:pointer;color:var(--ink2);background:rgba(255,255,255,.025);font-size:14px}
.drop:hover{border-color:var(--goldln)}
.drop.has{border-style:solid;border-color:rgba(61,220,151,.4)}
.radio{display:flex;flex-direction:column;gap:6px}
.radio label{display:flex;gap:10px;align-items:center;padding:8px 12px;border:1px solid var(--line2);border-radius:12px;cursor:pointer;font-size:14.5px}
.radio label:has(input:checked){border-color:var(--goldln);background:var(--goldbg)}
.radio input{width:auto;accent-color:var(--gold)}
.ferr{color:var(--dn);font-size:13px;min-height:18px}

/* modal: designed to fit; scrolls inside only on very small screens */
.modal{position:fixed;inset:0;z-index:60;background:rgba(2,4,10,.62);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:12px;animation:fade .2s}
.mbox{background:linear-gradient(180deg,#141d36,#0c1324);border:1px solid var(--line2);border-radius:24px;box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.06);width:min(540px,100%);max-height:calc(100dvh - 24px);overflow:auto;animation:pop .25s cubic-bezier(.2,.75,.2,1);position:relative}
.mbox:before{content:"";position:absolute;inset:0 18% auto;height:1px;background:linear-gradient(90deg,transparent,var(--goldln),transparent)}
.mbox.wide{width:min(1000px,100%)}
.mbox.mid{width:min(780px,100%)}
.mbox.sm{width:min(460px,100%)}
.mhd{display:flex;align-items:flex-start;gap:12px;padding:18px 22px 0}
.mhd h3{font-size:18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mhd .x{margin-left:auto;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--mut);flex:none}
.mhd .x:hover{background:rgba(255,255,255,.06);color:var(--ink)}
.mbd{padding:14px 22px 16px}
.mft{display:flex;gap:10px;justify-content:flex-end;align-items:center;padding:0 22px 20px;flex-wrap:wrap}
.mgrid{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:18px}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* plan strip and comparison inside modals */
.pstrip{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.035);border:1px solid var(--line);font-size:13.5px}
.pstrip div{display:flex;justify-content:space-between;gap:10px}
.pstrip span{color:var(--mut)}
.cmp{margin-top:12px;border:1px solid var(--line2);border-radius:14px;overflow:hidden}
.cmp .ch{padding:8px 12px;font-size:12.5px;color:var(--mut);background:rgba(255,255,255,.035);font-weight:700;display:flex;justify-content:space-between}
.cmp .cr{display:flex;gap:8px;align-items:center;padding:7px 12px;font-size:13.5px;border-top:1px solid var(--line)}
.cmp .ico{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;background:var(--bg4);color:var(--mut)}
.cmp .ok .ico{background:var(--upbg);color:var(--up)}
.cmp .bad .ico{background:var(--warnbg);color:var(--warn)}
.cmp .no .ico{background:var(--dnbg);color:var(--dn)}
.cmp .k{width:58px;color:var(--ink2);flex:none}
.note-box{display:flex;gap:10px;padding:11px 13px;border-radius:14px;font-size:14px;align-items:flex-start;background:var(--pubg);color:#dcd2ff}
.note-box .ic{margin-top:2px;flex:none}
.note-box.y{background:var(--warnbg);color:#ffd99a}
.note-box.g{background:var(--goldbg);color:var(--gold2)}

/* toast */
#toasts{position:fixed;right:18px;bottom:18px;z-index:80;display:flex;flex-direction:column;gap:10px;align-items:flex-end;pointer-events:none}
.toast{pointer-events:auto;background:linear-gradient(180deg,#1b2747,#131c35);border:1px solid var(--line2);border-radius:16px;padding:12px 16px 12px 14px;box-shadow:var(--shadow);font-size:14px;max-width:380px;display:flex;gap:10px;align-items:flex-start;animation:pop .3s cubic-bezier(.2,.75,.2,1);position:relative;overflow:hidden}
.toast:before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--gold)}
.toast.ok:before{background:var(--up)}
.toast.err:before{background:var(--dn)}
.toast>.ic{color:var(--gold)}.toast.ok>.ic{color:var(--up)}.toast.err>.ic{color:var(--dn)}

/* slip (mock screenshot from a broker app) */
.slip{width:100%;height:100%;object-fit:contain;border-radius:12px;display:block}
.slipth{width:40px;height:54px;border-radius:8px;overflow:hidden;border:1px solid var(--line2);flex:none;background:var(--bg3);cursor:zoom-in;display:flex;align-items:center;justify-content:center;color:var(--mut)}
.slipth img,.slipth svg{width:100%;height:100%;object-fit:cover;display:block}

/* google sign-in */
.gbtn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;background:#fff;color:#1f1f1f;border-radius:999px;padding:12px 20px;font-weight:600;font-size:15px;border:1px solid #dadce0;font-family:Roboto,"Leelawadee UI",sans-serif;box-shadow:0 10px 30px -12px rgba(255,255,255,.35)}
.gbtn:hover{background:#f7f8f8}
.gwrap{background:transparent!important;border:none!important;box-shadow:none!important;display:flex;justify-content:center}
.gwrap:before{display:none}
.gpick{background:#fff;color:#1f1f1f;border-radius:22px;width:min(440px,100%);padding:26px 0 16px;box-shadow:var(--shadow);font-family:Roboto,"Leelawadee UI",sans-serif;max-height:calc(100dvh - 24px);display:flex;flex-direction:column}
.gpick h4{font-size:21px;font-weight:400;text-align:center;margin:10px 0 2px}
.gpick .gs{text-align:center;color:#444746;font-size:14.5px;margin-bottom:14px}
.gpick .gs b{color:#0b57d0;font-weight:500}
.gaccs{overflow:auto;min-height:0}
.gacc{display:flex;gap:14px;align-items:center;width:100%;padding:10px 28px;border-top:1px solid #e3e3e3;text-align:left;color:#1f1f1f}
.gacc:hover{background:#f3f6fc}
.gacc .ga{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;flex:none}
.gacc small{display:block;color:#444746;font-size:12.5px}
.gerr{margin:10px 28px 0;padding:9px 12px;border-radius:10px;background:#fce8e6;color:#b3261e;font-size:13.5px}

/* dropdown menus */
.dd{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 10px);z-index:50;background:linear-gradient(180deg,#151f3a,#0e1529);border:1px solid var(--line2);border-radius:18px;box-shadow:var(--shadow);padding:6px;min-width:260px;animation:pop .2s cubic-bezier(.2,.75,.2,1)}
.menu .mi{display:flex;gap:10px;align-items:center;width:100%;padding:9px 11px;border-radius:12px;font-size:14px;text-decoration:none;color:var(--ink);text-align:left}
.menu .mi:hover{background:rgba(255,255,255,.06)}
.menu .mt{font-size:12px;color:var(--mut);padding:6px 11px 3px}
.menu .mh{padding:8px 11px 10px;border-bottom:1px solid var(--line);margin-bottom:4px}

/* chart */
.chartw{position:absolute;inset:0}
.chartw .ln{filter:drop-shadow(0 0 6px rgba(235,192,98,.55))}
.ctip{position:absolute;pointer-events:none;background:#1b2747;border:1px solid var(--line2);border-radius:10px;padding:5px 9px;font-size:12px;white-space:nowrap;transform:translate(-50%,-118%);box-shadow:var(--shadow);z-index:2}

@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}


.shell{height:100%;display:grid;grid-template-columns:232px minmax(0,1fr);overflow:hidden}
.sbar{display:flex;flex-direction:column;gap:4px;padding:18px 12px 14px;background:linear-gradient(180deg,rgba(13,20,38,.8),rgba(7,11,22,.86));-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-right:1px solid var(--line);min-height:0;overflow:hidden;position:relative;z-index:2}
.sbar .lg{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:2px 10px 16px;margin-bottom:4px;border-bottom:1px solid var(--line)}
.sbar .lg img{height:42px;filter:drop-shadow(0 4px 16px rgba(235,192,98,.25))}
.sbar .lg small{font-size:10.5px;letter-spacing:.18em;color:var(--gold);font-weight:700}
.sbar .lg b{font-size:14px;display:block}
.sbar .grp{font-size:11.5px;color:var(--mut);letter-spacing:.08em;padding:10px 12px 4px}
.sbar nav{display:flex;flex-direction:column;gap:3px}
.sbar nav button{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:13px;color:var(--ink2);font-size:14.5px;position:relative;transition:background .15s,color .15s}
.sbar nav button:hover{background:rgba(255,255,255,.045);color:var(--ink)}
.sbar nav button.on{background:linear-gradient(90deg,rgba(235,192,98,.18),rgba(235,192,98,.03));color:var(--gold2);font-weight:700;box-shadow:inset 0 0 0 1px rgba(235,192,98,.18)}
.sbar nav button.on:before{content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--gold);box-shadow:0 0 12px var(--gold)}
.sbar nav .n{margin-left:auto;font-size:11.5px;font-weight:800;border-radius:999px;padding:0 7px;background:var(--dn);color:#fff;box-shadow:0 0 10px rgba(255,107,125,.5)}
.sbar .who{margin-top:auto;padding:10px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid var(--line);display:flex;gap:10px;align-items:center;min-width:0}
.sbar .who b{display:block;font-size:14px}
.sbar .who small{display:block;font-size:11.5px;color:var(--mut)}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{flex:none;display:flex;align-items:center;gap:12px;height:64px;padding:0 22px;position:relative;z-index:40}
.top h1{font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;letter-spacing:-.005em}
.crumb{color:var(--mut);display:flex;align-items:center;gap:2px;font-size:14px;flex:none;padding:6px 12px 6px 8px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.03)}
.crumb:hover{color:var(--gold);border-color:var(--goldln)}
.mkt{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink2);padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.04);border:1px solid var(--line);white-space:nowrap}
.mkt i{width:7px;height:7px;border-radius:50%;background:var(--up);box-shadow:0 0 0 3px var(--upbg),0 0 10px var(--up);animation:blink 2.4s infinite}
.mkt.off i{background:var(--mut);box-shadow:none;animation:none}
@keyframes blink{50%{opacity:.4}}
.view{max-width:none;padding:2px 22px 18px}

/* coach desk */
.v-desk{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,.85fr);grid-template-rows:auto minmax(0,1fr)}
.al,.grow{display:grid;grid-template-columns:3px 34px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 4px 10px 0;border-bottom:1px solid var(--line)}
.al .sv,.grow .sv{align-self:stretch;border-radius:3px;background:var(--blue);margin:2px 0}
.al.high .sv,.grow.high .sv{background:var(--dn);box-shadow:0 0 10px rgba(255,107,125,.7)}
.al.mid .sv,.grow.mid .sv{background:var(--warn)}
.aic{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.06);color:var(--ink2)}
.high .aic{background:var(--dnbg);color:var(--dn)}
.mid .aic{background:var(--warnbg);color:var(--warn)}
.al .ti,.grow .ti{font-weight:700;font-size:14px}
.al .de{font-size:12.5px;color:var(--mut)}
.acts{display:flex;gap:6px;align-items:center;flex:none}
.lo{position:relative;border:1px solid var(--line2);border-radius:18px;padding:12px 14px 12px 16px;background:linear-gradient(100deg,rgba(255,255,255,.05),rgba(255,255,255,.012));display:flex;flex-direction:column;gap:9px;overflow:hidden}
.lo:before{content:"";position:absolute;inset:12px auto 12px 0;width:3px;border-radius:0 3px 3px 0;background:var(--blue)}
.lo.buy:before{background:var(--up);box-shadow:0 0 12px var(--up)}.lo.sell:before{background:var(--dn);box-shadow:0 0 12px var(--dn)}.lo.sl:before{background:var(--gold);box-shadow:0 0 12px var(--gold)}
.lo-h{display:flex;gap:11px;align-items:center;min-width:0}
.lo-h b{font-size:16px;letter-spacing:.02em}
.lo-t{font-size:12px;font-weight:700;white-space:nowrap;padding:4px 10px;border-radius:999px;background:var(--bluebg);color:var(--blue);flex:none}
.lo-t.dn{background:var(--dnbg);color:var(--dn)}
.lo-c{display:flex;gap:5px;flex-wrap:wrap}
.crow{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;padding:9px 6px;border-bottom:1px solid var(--line);border-radius:10px}
.crow:hover{background:rgba(255,255,255,.04)}
.crow .cn{display:flex;flex-direction:column;min-width:0}

/* order matrix */
.v-orders{grid-template-rows:minmax(0,1fr)}
.mx{width:100%;border-collapse:collapse;font-size:13.5px}
.mx th{font-weight:600;color:var(--ink2);font-size:12.5px;padding:4px 6px 10px;border-bottom:1px solid var(--line2);text-align:center}
.mx th:first-child{text-align:left}
.mx td{padding:6px 6px;border-bottom:1px solid var(--line);text-align:center;vertical-align:middle}
.mx td:first-child{text-align:left}
.mx tr.live td{background:rgba(126,166,255,.05)}
.oh{display:flex;gap:11px;align-items:center;min-width:0}
.oh b{font-size:14.5px}
.os{font-size:12px;color:var(--mut)}
.cell{display:inline-flex;flex-direction:column;align-items:center;gap:1px;min-width:62px;padding:3px;border-radius:12px;font-size:11.5px;line-height:1.3}
.cell:hover{background:rgba(255,255,255,.05)}
.cell .d{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.cell.ok .d{background:var(--upbg);color:var(--up);box-shadow:inset 0 0 0 1px rgba(61,220,151,.3)}
.cell.bad .d{background:var(--warnbg);color:var(--warn);box-shadow:inset 0 0 0 1px rgba(245,181,68,.3)}
.cell.pend .d{background:var(--bluebg);color:var(--blue);box-shadow:inset 0 0 0 1px rgba(126,166,255,.35),0 0 10px rgba(126,166,255,.35)}
.cell.skip .d{color:var(--warn);border:1.5px dashed rgba(245,181,68,.6)}
.cell.exp .d{background:var(--dnbg);color:var(--dn);box-shadow:inset 0 0 0 1px rgba(255,107,125,.3)}
.cell.cancel .d{background:var(--bg4);color:var(--mut)}
.cell .s{color:var(--mut)}
.na{color:var(--mut);opacity:.5}
.colh{display:inline-flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.colh small{font-weight:400;color:var(--mut)}
.lgd{display:inline-flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink2)}
.lgd span{display:inline-flex;align-items:center;gap:5px}
.lgd i{width:9px;height:9px;border-radius:50%}

/* verify */
.v-verify{grid-template-columns:330px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
.vi{display:flex;gap:11px;align-items:center;padding:8px 10px;border-radius:14px;width:100%;text-align:left;border:1px solid transparent;transition:background .15s}
.vi:hover{background:rgba(255,255,255,.04)}
.vi.on{background:var(--goldbg);border-color:var(--goldln)}
.vd{display:grid;grid-template-columns:210px minmax(0,1fr);gap:18px;height:100%}
.vd-slip{min-height:0;display:flex;flex-direction:column;gap:6px}
.vd-slip .slip{flex:1;min-height:0}
.vd-info{display:flex;flex-direction:column;gap:10px;min-height:0;min-width:0}
.cmpt td,.cmpt th{padding:5px 8px;white-space:nowrap}
.qchips{display:flex;gap:6px;flex-wrap:wrap;max-height:56px;overflow:hidden}
.qchips button{font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--line2);color:var(--ink2);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:rgba(255,255,255,.02)}
.qchips button:hover{border-color:var(--goldln);color:var(--gold)}

/* coach: client cards */
.v-clients{grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:auto minmax(0,1fr)}
.ccard{padding:16px;gap:10px;cursor:pointer;transition:border-color .2s,transform .2s,box-shadow .2s}
.ccard:hover{border-color:var(--goldln);transform:translateY(-2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 20px 40px -20px rgba(235,192,98,.35)}
.cc-s{flex:1;min-height:40px;position:relative}
.cc-s svg{position:absolute;inset:0;width:100%;height:100%}
.cc-k{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.cc-k div{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:6px 2px;font-size:11.5px;color:var(--mut)}
.cc-k b{display:block;font-size:15px;color:var(--ink)}
.flags{display:flex;gap:4px;flex-wrap:wrap}

/* client detail */
.v-client{grid-template-rows:auto minmax(0,1fr)}
.chd{padding:12px 18px;display:flex;flex-direction:row;align-items:center;gap:14px;flex-wrap:wrap}
.chd h2{font-size:20px}
.sub{display:grid;gap:14px;min-height:0;min-width:0}
.c-ov{grid-template-columns:minmax(0,1.45fr) minmax(0,1.05fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
.c-ord,.c-port{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
.c-notes{grid-template-columns:minmax(0,1fr)}
.stk{display:flex;flex-direction:column;gap:14px;min-height:0}
.k6{grid-template-columns:repeat(6,minmax(0,1fr))}
.trow{display:grid;grid-template-columns:78px 46px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 2px;border-bottom:1px solid var(--line);font-size:13.5px}
.nrow{padding:9px 2px;border-bottom:1px solid var(--line);font-size:14px}
.nrow .h{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--mut);margin-bottom:2px}
.hr2{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:8px 2px;border-bottom:1px solid var(--line);font-size:13.5px;align-items:center}
.hr2.wl{grid-template-columns:auto minmax(0,1fr) auto;column-gap:11px}
.hr2.wl>.slg{grid-row:span 2}

/* CS */
.v-overview{grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
.v-tasks,.v-clients.cs,.v-team{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
.gchips{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.dist{display:flex;height:7px;border-radius:999px;overflow:hidden;gap:2px;margin:6px 0 3px}
.arow{display:grid;grid-template-columns:96px 90px minmax(0,1fr);gap:12px;align-items:center;padding:8px 2px;border-bottom:1px solid var(--line);font-size:13.5px}
.perm td:not(:first-child),.perm th:not(:first-child){text-align:center}
.tsearch{position:relative;flex:1;min-width:200px;max-width:320px}
.tsearch .ic{position:absolute;left:12px;top:10px;color:var(--mut)}
.tsearch input{padding-left:36px;border-radius:999px}

/* login */
.bo-login{height:100%;display:flex;align-items:center;justify-content:center;padding:20px}
.bo-login .card{width:min(470px,100%);padding:34px 32px 28px;text-align:center;position:relative;overflow:hidden;border-radius:26px}
.bo-login .card:before{content:"";position:absolute;inset:0 0 auto;height:3px;background:var(--btn)}
.bo-login .card:after{content:"";position:absolute;width:300px;height:300px;left:50%;top:-190px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(235,192,98,.18),transparent);pointer-events:none}
.bo-login img{height:66px;filter:drop-shadow(0 6px 24px rgba(235,192,98,.25));position:relative}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0;text-align:left}
.roles div{padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid var(--line);font-size:13px;color:var(--ink2)}
.roles b{display:block;color:var(--ink);font-size:14.5px}
.corner{position:fixed;top:14px;right:16px;z-index:45}

/* composer */
.comp{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);border-top:1px solid var(--line);margin-top:12px}
.comp .l{padding:14px 22px 16px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:11px}
.comp .r{padding:14px 22px 16px;background:rgba(255,255,255,.015);display:flex;flex-direction:column;gap:7px}
.f3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rcp{display:flex;align-items:center;gap:10px;padding:7px 10px;border:1px solid var(--line2);border-radius:12px;cursor:pointer}
.rcp:has(input:checked){border-color:var(--goldln);background:var(--goldbg)}
.rcp.dis{opacity:.45;cursor:not-allowed}
.rcp input{width:17px;height:17px;accent-color:var(--gold);flex:none}
.rcp .q{margin-left:auto;text-align:right;font-size:12.5px;flex:none}
.risk{display:flex;gap:14px;flex-wrap:wrap;padding:9px 12px;border-radius:12px;background:rgba(255,255,255,.035);border:1px solid var(--line);font-size:13px}
.range{display:flex;align-items:center;gap:12px}
.range input{padding:0;accent-color:var(--gold);background:none;border:none;box-shadow:none}
.shx{display:none}
#lastpx{display:flex;align-items:center;gap:6px;min-height:20px}

@media (max-width:1280px){.k6 .kpi .v{font-size:17px}}
@media (max-width:1020px){.v-clients{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:1180px){.tbl .opt{display:none}}
@media (max-width:1100px){.k6{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:1180px){
  .shell{grid-template-columns:70px minmax(0,1fr)}
  .sbar{padding:12px 9px}.sbar .lg{padding:0 0 10px;align-items:center}.sbar .lg img{height:24px}.sbar .lg div,.sbar .grp,.sbar nav .l,.sbar .who div{display:none}
  .sbar nav button{justify-content:center;padding:11px}.sbar nav button.on:before{left:-9px}.sbar nav .n{position:absolute;top:2px;right:2px;margin:0;padding:0 5px}
  .sbar .who{padding:6px;justify-content:center;flex-direction:column}
  .v-desk{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,.9fr)}
  .top{padding:0 18px}.view{padding:2px 18px 16px}
}
@media (max-width:700px){
  .comp{grid-template-columns:minmax(0,1fr)}.comp .l{border-right:none;border-bottom:1px solid var(--line)}
  #kind{display:grid;grid-template-columns:1fr 1fr;border-radius:16px}#kind button{justify-content:center;border-radius:12px}
}
@media (max-width:900px){
  input,textarea,select{font-size:16px}
  .shell{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  .sbar{flex-direction:row;align-items:center;padding:4px;gap:4px;border:1px solid var(--line);border-radius:20px;margin:0 8px calc(8px + env(safe-area-inset-bottom));order:2;background:var(--glass)}
  .sbar .lg{display:none}.sbar nav{flex-direction:row;gap:2px;flex:1;justify-content:space-around}
  .sbar nav button{flex-direction:column;gap:1px;font-size:10.5px;padding:5px 6px;width:auto;flex:1;border-radius:16px}.sbar nav .l{display:block}.sbar nav button.on:before{display:none}
  .sbar .who{margin:0;padding:2px;background:none;border:none;flex-direction:row}
  .main{order:1}
  .top{height:52px;padding:0 10px;gap:8px}.top h1{font-size:18px}.top .mkt,.top .dl{display:none}.top .btn .l{display:none}
  .view{padding:2px 8px 10px;gap:10px}
  .kstrip{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mx .os,.cell .s,.colh span,.colh small,.oh .side,.mx .opt,.oh .tag{display:none}.cell{min-width:0;padding:2px}.cell .d{width:24px;height:24px}.mx td,.mx th{padding:4px 2px}.oh .slg{--s:24px!important}
  .vd{grid-template-columns:110px minmax(0,1fr)}
  .roles{grid-template-columns:1fr}
  .v-clients:not(.cs){grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
  .k6{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.k6 .kpi{padding:7px 9px;border-radius:14px}.k6 .kpi .v{font-size:15px}.k6 .kpi .v .xs,.k6 .kpi .s,.k6 .kpi .k .ic{display:none}.k6 .kpi .k{font-size:11.5px}
  .grow{grid-template-columns:3px 28px minmax(0,1fr)}.grow .acts{grid-column:2/-1;justify-content:flex-end;flex-wrap:wrap}
  .v-verify .vh>.muted{display:none}.v-verify .chips{flex-wrap:nowrap;overflow:hidden}.v-verify .chip{padding:4px 9px;font-size:12.5px}
  .vd{grid-template-columns:96px minmax(0,1fr);gap:10px}.vd-slip .xs,.qchips{display:none}.cmpt td,.cmpt th{padding:4px 6px;font-size:12.5px}
  .vd-info>.row{display:grid;grid-template-columns:1fr 1fr;gap:6px}.vd-info>.row .btn{padding:7px 8px;font-size:13px}.vd-info .lgx{display:none}.vd-info .shx{display:inline}
  .modal{align-items:flex-end;padding:0}.mbox{border-radius:22px 22px 0 0;max-height:100dvh}
  .arow{grid-template-columns:70px minmax(0,1fr)}.arow .who,.tbl .opt2{display:none}
  #toasts{left:10px;right:10px;bottom:84px}
}

/* Port 1M mockup: data and helpers shared by the client journal and the back office.
   Both pages keep one dataset in localStorage (KEY), so an order a coach sends shows up
   on the client's journal and the client's fills land in the coach's queue.
   Everything typed by a user is validated on the way in and escaped on the way out. */

const KEY = 'p1m-mockup-v3';
const GOAL = 1000000;
const TZ = 7 * 3600e3, DAY = 86400e3, HR = 3600e3, MIN = 60e3;
const BASE = Date.UTC(2026, 9, 7, 3, 42);   // พ. 7 ต.ค. 2569 10:42 เวลาไทย = "ตอนนี้" ของเดโม
const COURSE_START = Date.UTC(2026, 6, 1);  // 1 ก.ค. 2569
const HOLIDAYS = ['2026-07-28', '2026-08-12', '2026-10-13'];
const FEATURED = 'u01';                      // ลูกค้าตัวอย่างที่ใช้ในหน้าบ้าน
const MARKET_CLOSE = [16, 30];
const STAFF_IDLE = 30 * MIN;                 // หลังบ้านออกจากระบบเองเมื่อไม่ใช้งาน

/* ---------- format ---------- */
const TH_M = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
const TH_D = ['อา.', 'จ.', 'อ.', 'พ.', 'พฤ.', 'ศ.', 'ส.'];
const TH_DAY = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์'];
const pad = n => String(n).padStart(2, '0');
const fmt = (n, d = 0) => Number(n).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const px = n => fmt(n, 2);
const baht = n => fmt(Math.round(n));
const sgn = n => (n > 0 ? '+' : n < 0 ? '−' : '');
const signed = n => sgn(n) + baht(Math.abs(n));
const pct = (n, d = 1) => sgn(n) + fmt(Math.abs(n * 100), d) + '%';
const kb = n => n >= 1e6 ? fmt(n / 1e6, n % 1e6 ? 2 : 0) + 'M' : n >= 1e3 ? fmt(n / 1e3, n % 1e3 ? 1 : 0) + 'K' : fmt(n);
const tz = ms => new Date(ms + TZ);
const dstr = ms => { const d = tz(ms); return d.getUTCDate() + ' ' + TH_M[d.getUTCMonth()]; };

      if (st === 'pend' || st === 'cancel') continue;

      else if (st === 'skip') { f += .4; skip++; } else exp++;

    const off = mine.filter(e => !e.order && e.side === 'buy').length;

    const follow = n ? f / n : 1, acc = ex ? exOk / ex : 1, offF = Math.max(0, 1 - off / 3), proof = (proofEx + proofSnap) / 2;

/* ---------- fit-to-screen paging: long lists flip pages instead of scrolling ---------- */
const PG = {}, PGN = {};
function fitPagers(root = document) {
  $$('[data-pg]', root).forEach(box => {
    const key = box.dataset.pg, rows = [...box.children];
    if (!box.offsetParent && !box.getClientRects().length) return;   // panel hidden behind a tab
    const area = box.closest('.pb') || box.parentElement;
    const limit = () => area.getBoundingClientRect().bottom - (parseFloat(getComputedStyle(area).paddingBottom) || 0);
    const gap = parseFloat(getComputedStyle(box).rowGap) || 0;
    const nav = document.querySelector(`[data-pgn="${key}"]`);
    const setNav = () => { if (nav) nav.innerHTML = n > 1 ? `<button data-pgp="${key}" ${p ? '' : 'disabled'} aria-label="หน้าก่อน">${ic('back', 15)}</button><span class="num">${p + 1}/${n}</span><button data-pgx="${key}" ${p < n - 1 ? '' : 'disabled'} aria-label="หน้าถัดไป">${ic('chev', 15)}</button>` : ''; };
    let pages, n, p, slack = 0;
    // the page buttons and table re-flow can change the room left, so check the page really fits and re-split if not
    for (let tries = 0; tries < 4; tries++) {
      rows.forEach(r => { r.hidden = false; });
      const avail = limit() - box.getBoundingClientRect().top - slack;
      pages = [];
      let cur = [], used = 0;
      for (const r of rows) {
        const h = r.getBoundingClientRect().height;
        if (cur.length && used + h > avail + .5) { pages.push(cur); cur = []; used = 0; }
        cur.push(r); used += h + gap;
      }
      if (cur.length) pages.push(cur);
      n = Math.max(1, pages.length); p = Math.max(0, Math.min(PG[key] || 0, n - 1));
      rows.forEach(r => { r.hidden = true; });
      (pages[p] || []).forEach(r => { r.hidden = false; });
      setNav();
      const over = box.getBoundingClientRect().bottom - limit();
      if (over <= .5 || (pages[p] || []).length < 2) break;
      slack += over;
    }
    PG[key] = p; PGN[key] = n;
  });
}
function pageTo(key, d) { const n = PGN[key] || 1, p = Math.max(0, Math.min((PG[key] || 0) + d, n - 1)); if (p === PG[key]) return; PG[key] = p; fitPagers(); }
// jump a pager to the page that holds a given row
function pageOf(key, sel) {
  const box = $(`[data-pg="${key}"]`); if (!box || !$(sel, box)) return;
  for (let i = 0; i < (PGN[key] || 1); i++) { PG[key] = i; fitPagers(); if (!$(sel, box).hidden) return; }
}
document.addEventListener('click', e => {
  const p = e.target.closest('[data-pgp],[data-pgx]'); if (!p) return;
  e.stopPropagation();
  pageTo(p.dataset.pgp || p.dataset.pgx, p.dataset.pgp ? -1 : 1);
}, true);
// the mouse wheel flips pages too, so nothing needs a scrollbar
let wheelAt = 0;
document.addEventListener('wheel', e => {
  if ($('#modal')?.innerHTML) return;
  const box = e.target.closest?.('.pb')?.querySelector('[data-pg]'); if (!box || (PGN[box.dataset.pg] || 1) < 2) return;
  if (Date.now() - wheelAt < 380 || Math.abs(e.deltaY) < 8) return;
  wheelAt = Date.now(); pageTo(box.dataset.pg, e.deltaY > 0 ? 1 : -1);
}, { passive: true });

const PT = {};
function panelTabs(root, narrow) {

  });
}

// accept only real images up to 8 MB; re-drawing on a canvas drops EXIF (location) data
function readImage(file) {
  return new Promise((res, rej) => {
    if (!file || !IMG_TYPES.includes(file.type)) return rej(new Error('รองรับเฉพาะไฟล์ภาพ PNG, JPG, WEBP'));
    if (file.size > 8 * 1024 * 1024) return rej(new Error('ไฟล์ใหญ่เกิน 8 MB'));
    const fr = new FileReader();
    fr.onerror = () => rej(new Error('อ่านไฟล์ไม่ได้'));
    fr.onload = () => {
      const im = new Image();
      im.onerror = () => rej(new Error('ไฟล์นี้ไม่ใช่ภาพที่เปิดได้'));
      im.onload = () => { const s = Math.min(1, 720 / Math.max(im.width, im.height)), cv = document.createElement('canvas'); cv.width = Math.max(1, im.width * s); cv.height = Math.max(1, im.height * s); cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height); res(cv.toDataURL('image/jpeg', .72)); };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* ---------- CS: all clients ---------- */
function allClientsView() {
  const al = alerts();
  let list = S.clients.filter(c => (!fCoach || c.coach === fCoach) && (!q || (cname(c) + ' ' + c.email).toLowerCase().includes(q.toLowerCase())));
  if (fStat === 'low') list = list.filter(c => discipline(c.id).score < 75);
  if (fStat === 'open') list = list.filter(c => al.some(a => a.cl === c.id));
  if (fStat === 'mile') list = list.filter(c => eqNow(c) >= 250000);
  const SORT = { score: (a, b) => discipline(a.id).score - discipline(b.id).score, ret: (a, b) => retPct(b) - retPct(a), eq: (a, b) => eqNow(b) - eqNow(a), name: (a, b) => a.id.localeCompare(b.id, undefined, { numeric: true }) };
  list.sort(SORT[sortBy] || SORT.score);
  const body = narrow() ? pnl({ t: 'ลูกค้า', sub: `${list.length} จาก ${S.clients.length} คน`, key: 'all', cls: 'tight', rows: list.map(clientRow).join(''), empty: 'ไม่พบลูกค้าตามเงื่อนไข' }) : null;
  return `<div class="vh"><div class="tsearch">${ic('search', 16)}<input id="q" value="${esc(q)}" maxlength="60" placeholder="ค้นหาชื่อหรืออีเมล" aria-label="ค้นหาลูกค้า"></div>
    <select id="fcoach" style="width:auto;border-radius:999px" aria-label="กรองตามโค้ช"><option value="">โค้ชทุกคน</option>${S.coaches.map(co => `<option value="${co.id}" ${fCoach === co.id ? 'selected' : ''}>${co.name}</option>`).join('')}</select>
    <div class="chips">${[['all', 'ทั้งหมด'], ['open', 'มีเรื่องค้าง'], ['low', 'วินัยต่ำกว่า 75'], ['mile', 'ถึง 250K']].map(([k, l]) => `<button class="chip ${fStat === k ? 'on' : ''}" data-fs="${k}">${l}</button>`).join('')}</div>
    <span class="sp"></span><select id="sort" style="width:auto;border-radius:999px" aria-label="เรียงลำดับ">${[['score', 'วินัยต่ำสุดก่อน'], ['ret', 'ผลตอบแทนสูงสุด'], ['eq', 'พอร์ตใหญ่สุด'], ['name', 'รหัสลูกค้า']].map(([k, l]) => `<option value="${k}" ${sortBy === k ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
  ${body || `<section class="pnl"><div class="ph"><h3>ลูกค้า</h3><span class="sub">แสดง ${list.length} จาก ${S.clients.length} คน</span><div class="pgn" data-pgn="all"></div></div><div class="pb">${list.length ? `<table class="tbl"><thead><tr><th>ลูกค้า</th><th>โค้ช</th><th class="r">ทุนเริ่ม</th><th class="r">พอร์ตตอนนี้</th><th>ทางสู่ 1 ล้าน</th><th class="r">ผลตอบแทน</th><th class="r">วินัย</th><th>เรื่องค้าง</th><th>เข้าระบบ</th></tr></thead><tbody data-pg="all">
    ${list.map(c => { const d = discipline(c.id), v = eqNow(c), r = retPct(c), fl = flagsOf(c); return `<tr class="click" data-act="open" data-id="${esc(c.id)}"><td><div class="row" style="gap:8px">${avatar(c, 'sm')}<div style="min-width:0"><b>${esc(cname(c))}</b><div class="xs muted">${esc(c.email)}</div></div></div></td><td>${coach(c.coach).name}</td>
      <td class="r num">${baht(c.cap)}</td><td class="r num"><b>${baht(v)}</b></td><td style="min-width:110px"><div class="bar" style="height:6px"><i style="width:${v / GOAL * 100}%"></i></div><div class="xs muted num">${fmt(v / GOAL * 100, 1)}%</div></td>
      <td class="r num ${r >= 0 ? 'up' : 'dn'}">${pct(r)}</td><td class="r"><span class="tag ${scoreTone(d.score)} num">${d.score}</span></td><td><div class="flags">${fl.slice(0, 2).join('') || '<span class="muted xs">—</span>'}${fl.length > 2 ? `<span class="tag">+${fl.length - 2}</span>` : ''}</div></td><td class="xs muted">${seenTxt(c)}</td></tr>`; }).join('')}</tbody></table>` : '<div class="empty">ไม่พบลูกค้าตามเงื่อนไข</div>'}</div></section>`}`;
}

/* ---------- CS: team, permissions, activity log ---------- */
function teamView() {
  const n = now(), tabs = [['staff', 'ทีมงาน'], ['perm', 'สิทธิ์ตามบทบาท'], ['log', 'ประวัติการใช้งาน']];
  let body;
  if (teamTab === 'staff') {
    const staff = [{ ...S.cs, role: 'CS', cnt: 'ทั้ง 50 คน' }, ...S.coaches.map(co => ({ ...co, role: 'โค้ช', cnt: `${S.clients.filter(c => c.coach === co.id).length}/5` }))];
    body = `<section class="pnl"><div class="ph"><h3>ทีมงาน</h3><span class="sub">ล็อกอินด้วย Google · บังคับเปิด 2-Step Verification</span><button class="btn ghost sm" data-act="addstaff" style="margin-left:auto">${ic('plus', 15)} เพิ่มทีมงาน</button><div class="pgn" data-pgn="st"></div></div><div class="pb"><table class="tbl"><thead><tr><th>ชื่อ</th><th class="opt">อีเมล Google</th><th>บทบาท</th><th class="r">ลูกค้า</th><th class="opt">สถานะ</th><th class="opt">เข้าระบบล่าสุด</th></tr></thead><tbody data-pg="st">
      ${staff.map(s => `<tr><td><div class="row" style="gap:8px"><span class="av ${s.role === 'CS' ? '' : 'gold'} sm">${s.role === 'CS' ? 'CS' : s.no}</span><b>${esc(s.name)}</b></div></td><td class="muted opt">${esc(s.email)}</td><td><span class="tag ${s.role === 'CS' ? 'blue' : 'gold'}">${s.role}</span></td><td class="r num">${s.cnt}</td><td class="opt"><span class="tag ok">ใช้งาน</span></td><td class="xs muted opt">${when(s.seen, n)}</td></tr>`).join('')}</tbody></table></div></section>`;
  } else if (teamTab === 'perm') {
    const P = [['ดูข้อมูลลูกค้า', 'ของตัวเอง', 'ลูกค้าของตัวเอง 5 คน', 'ทั้ง 50 คน'], ['ส่งหรือยกเลิกคำสั่งซื้อขาย', '—', '✓', '—'], ['บันทึกออเดอร์และแนบภาพ', '✓', '—', '—'], ['ตรวจหลักฐาน ยืนยัน/ขอแก้', '—', '✓', 'ดูได้'], ['ส่งยอดพอร์ต / แจ้งฝากถอน', '✓', 'ดูได้', 'ตรวจและอนุมัติ'], ['โน้ตทีมงาน', '—', '✓', '✓'], ['เพิ่มลูกค้า จับคู่/เปลี่ยนโค้ช', '—', '—', '✓'], ['เพิ่ม/ปิดบัญชีทีมงาน', '—', '—', '✓'], ['ดูรายงานรวมและประวัติการใช้งาน', '—', 'เฉพาะของตัวเอง', '✓']];
    body = `<section class="pnl"><div class="ph"><h3>สิทธิ์ตามบทบาท</h3><span class="sub">ระบบจริงเช็กสิทธิ์ที่เซิร์ฟเวอร์ทุกครั้งที่ดึงหรือแก้ข้อมูล ไม่ใช่แค่ซ่อนเมนู</span><div class="pgn" data-pgn="pm"></div></div><div class="pb"><table class="tbl perm"><thead><tr><th>ทำอะไรได้</th><th>ลูกค้า</th><th>โค้ช</th><th>CS</th></tr></thead><tbody data-pg="pm">
      ${P.map(r => `<tr><td>${r[0]}</td>${r.slice(1).map(x => `<td class="${x === '—' ? 'muted' : x === '✓' ? 'up' : ''}">${x === '✓' ? ic('check', 16, 2.4) : x}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section>`;
  } else {
    const log = S.feed.slice().reverse();
    const who = f => f.who === 'cs' ? '<span class="tag blue">CS</span>' : f.by === 'coach' ? `<span class="tag gold">${esc(coach(f.who)?.name || 'โค้ช')}</span>` : '<span class="tag">ลูกค้า</span>';
    body = pnl({ t: 'ประวัติการใช้งาน', sub: 'ใคร ทำอะไร เมื่อไหร่ · เก็บทุกการเปลี่ยนแปลงสำคัญ', key: 'lg', cls: 'tight', empty: 'ยังไม่มีประวัติ', rows: log.map(f => `<div class="arow"><span class="xs muted num">${dt(f.at)}</span><span class="who">${who(f)}</span><span class="ell" title="${esc(f.text)}">${esc(f.text)}</span></div>`).join('') });
  }
  return `<div class="vh"><div class="seg">${tabs.map(([k, l]) => `<button class="${teamTab === k ? 'on' : ''}" data-ttab="${k}">${l}</button>`).join('')}</div></div>${body}`;
}

/* ---------- modals ---------- */
function callModal(k, cl) {
  const list = cl ? myAlerts().filter(x => x.cl === cl) : alerts().filter(x => x.k === k);
  const a = list[0]; if (!a || !canSee(a.cl)) return;
  const c = client(a.cl);
  const box = openModal(mhead(`บันทึกการติดต่อ · ${esc(cname(c))}`, `โทร ${esc(c.phone)} · ${list.map(x => esc(x.title)).join(' · ')}`) + `<div class="mbd">
    <div class="radio">${['คุยแล้ว เข้าใจและจะแก้', 'ไม่รับสาย ส่ง LINE แล้ว', 'นัดคุยใหม่'].map((r, i) => `<label><input type="radio" name="r" value="${r}" ${i ? '' : 'checked'}> ${r}</label>`).join('')}</div>
    <div class="field" style="margin-top:10px"><label for="nt">รายละเอียด</label><input id="nt" maxlength="300" placeholder="คุยอะไร ลูกค้าตอบว่าอย่างไร"></div>
    <div class="xs muted" style="margin-top:8px">"คุยแล้ว" จะปิด ${list.length} เรื่องของคนนี้ · ตัวเลือกอื่นเก็บเรื่องไว้ในคิว</div>
  </div><div class="mft"><button class="btn ghost" data-act="close">ยกเลิก</button><button class="btn" id="save">บันทึก</button></div>`);
  $('#save', box).addEventListener('click', () => {
    const r = $('input[name=r]:checked', box).value, t = clean($('#nt', box).value, 300);
    S.notes.push({ id: nid('n'), cl: c.id, by: ME().id, role: isCS() ? 'cs' : 'coach', at: now(), text: `${r}${t ? ' · ' + t : ''}` });
    if (r.startsWith('คุยแล้ว')) list.forEach(x => { S.done[x.k] = { by: ME().id, at: now(), note: t }; });
    pushFeed({ by: isCS() ? 'cs' : 'coach', who: ME().id, cl: c.id, coach: c.coach, kind: 'contact', text: `${ME().name} บันทึกการติดต่อ${c.name}: ${r}` });
    if (!save()) return;
    closeModal(); render(); toast(`${ic('check', 18)}<div><b>บันทึกแล้ว</b><div class="muted sm">${r.startsWith('คุยแล้ว') ? `ปิด ${list.length} เรื่อง` : 'เก็บเรื่องไว้ในคิว'}</div></div>`, 'ok');
  });
}
function flowModal(cid, fid) {
  if (!isCS()) return;
  const c = client(cid), f = c?.flows.find(x => x.id === fid);
  if (!f || !f.pend) return;
  const img = safeImg(f.img);
  const box = openModal(mhead(`${f.amt > 0 ? 'ฝาก' : 'ถอน'}เงิน ${baht(Math.abs(f.amt))} บาท · ${esc(cname(c))}`, `แจ้งเมื่อ ${dt(f.at)} · อนุมัติแล้วจึงนับเข้าพอร์ต ไม่นับเป็นกำไรขาดทุน`) + `<div class="mbd" style="display:grid;grid-template-columns:180px 1fr;gap:16px">
    <div style="height:240px;border-radius:12px;background:var(--bg3);display:flex;align-items:center;justify-content:center">${img ? `<img class="slip" src="${img}" alt="สลิปโอนเงิน">` : '<span class="muted xs" style="padding:12px;text-align:center">ข้อมูลตัวอย่างไม่มีภาพสลิป</span>'}</div>
    <div style="display:flex;flex-direction:column;gap:10px"><div class="pstrip"><div><span>มูลค่าพอร์ตตอนนี้</span><b class="num">${baht(eqNow(c))}</b></div><div><span>หลังอนุมัติ</span><b class="num">${baht(eqNow(c) + f.amt)}</b></div></div>
      <div class="field"><label for="why">เหตุผล (ถ้าไม่อนุมัติ)</label><input id="why" maxlength="200" placeholder="เช่น ยอดในสลิปไม่ตรง"></div></div>
  </div><div class="mft"><span class="ferr" id="err"></span><span class="sp"></span><button class="btn bad" id="rej">ไม่อนุมัติ</button><button class="btn ok" id="ok">${ic('check', 16)} อนุมัติ</button></div>`, 'mid');
  const done = (ok, why) => {
    f.pend = false;
    if (ok) { f.ok = now(); c.eq[c.eq.length - 1] += f.amt; } else f.rej = { at: now(), why };
    S.notes.push({ id: nid('n'), cl: c.id, by: 'cs', role: 'cs', at: now(), text: `${ok ? 'อนุมัติ' : 'ไม่อนุมัติ'}${f.amt > 0 ? 'ฝาก' : 'ถอน'}เงิน ${baht(Math.abs(f.amt))} บาท${why ? ' · ' + why : ''}` });
    pushFeed({ by: 'cs', who: 'cs', cl: c.id, coach: c.coach, kind: 'flow', text: `CS ${ok ? 'อนุมัติ' : 'ไม่อนุมัติ'}การ${f.amt > 0 ? 'ฝาก' : 'ถอน'}เงินของ${c.name} ${baht(Math.abs(f.amt))} บาท` });
    if (!save()) return;
    closeModal(); render(); toast(`${ic(ok ? 'check' : 'x', 18)}<div><b>${ok ? 'อนุมัติแล้ว' : 'ไม่อนุมัติ'}</b></div>`, ok ? 'ok' : '');
  };
  $('#ok', box).addEventListener('click', () => done(true));
  $('#rej', box).addEventListener('click', () => { const why = clean($('#why', box).value, 200); if (!why) { $('#err', box).textContent = 'ใส่เหตุผลที่ไม่อนุมัติ'; return; } done(false, why); });
}

    if (!save()) return;
    closeModal(); render(); toast(`${ic('check', 18)}<div><b>เปลี่ยนเป็น${coach(to).name}แล้ว</b></div>`, 'ok');
  });
}

  if (!isCS()) return;
  const box = openModal(mhead('เพิ่มทีมงาน', 'เพิ่มอีเมล Google แล้วเลือกบทบาท') + `<div class="mbd"><div class="fgrid"><div class="field"><label for="em">อีเมล Google</label><input id="em" maxlength="120" placeholder="name@company.com"></div><div class="field"><label for="rl">บทบาท</label><select id="rl"><option>โค้ช</option><option>CS</option></select></div></div>
    <div class="xs muted" style="margin-top:8px">ต้นแบบ: ยังไม่บันทึกจริง · ระบบจริงส่งคำเชิญ และบังคับเปิด 2-Step Verification ก่อนเข้าได้</div></div>
    <div class="mft"><span class="ferr" id="err"></span><span class="sp"></span><button class="btn ghost" data-act="close">ปิด</button><button class="btn" id="save">ส่งคำเชิญ</button></div>`);
  $('#save', box).addEventListener('click', () => { const em = clean($('#em', box).value, 120).toLowerCase(); if (!EMAIL_RE.test(em)) { $('#err', box).textContent = 'อีเมลไม่ถูกต้อง'; return; } closeModal(); toast(`${ic('send', 18)}<div><b>ส่งคำเชิญแล้ว (จำลอง)</b><div class="muted sm">${esc(em)}</div></div>`); });
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]'); if (g) { if (ME()) go(g.dataset.go); return; }
  const sel = e.target.closest('[data-sel]'); if (sel) { selEx = sel.dataset.sel; if (narrow()) PT.verify = 'ตรวจ'; return render(); }
  const vf = e.target.closest('[data-vf]'); if (vf) { vFilter = vf.dataset.vf; selEx = null; PG.vq = 0; return render(); }
  const tf = e.target.closest('[data-tf]'); if (tf) { tFilter = tf.dataset.tf; PG.tk = 0; return render(); }
  const fs = e.target.closest('[data-fs]'); if (fs) { fStat = fs.dataset.fs; PG.all = 0; return render(); }
  const ct = e.target.closest('[data-ctab]'); if (ct) { clTab = ct.dataset.ctab; return render(); }
  const tt = e.target.closest('[data-ttab]'); if (tt) { teamTab = tt.dataset.ttab; return render(); }
  const pt = e.target.closest('[data-ptk]'); if (pt) { PT[pt.dataset.ptk] = pt.dataset.ptv; return render(); }
  const qb = e.target.closest('[data-q]'); if (qb) { $('#vnote').value = qb.dataset.q; return; }
  const a = e.target.closest('[data-act]');
  if (!a) { if (menu && !e.target.closest('.menu')) { menu = null; render(); } return; }
  const act = a.dataset.act, id = a.dataset.id;
  if (act === 'close') return closeModal();
  if (act === 'menu') { menu = menu === a.dataset.m ? null : a.dataset.m; return render(); }
  menu = null;
  if (act === 'glogin') {
    const accs = [{ name: 'ทีม CS', email: S.cs.email, id: 'cs', color: '#1565c0' }, ...S.coaches.map(c => ({ name: c.name, email: c.email, id: c.id, color: '#8d6e1f' })), { name: 'บัญชีส่วนตัว', email: 'someone@gmail.com', id: null, color: '#5f6368' }];
    return googleChooser(accs, acc => {
      if (!acc.id) return 'อีเมลนี้ไม่มีสิทธิ์เข้าหลังบ้าน ให้ CS เพิ่มบัญชีก่อน';
      sessionStorage.setItem('p1m-bo', acc.id); sessionStorage.setItem(ACT, String(Date.now()));
      const me = ME(); me.seen = now(); pushFeed({ by: isCS() ? 'cs' : 'coach', who: me.id, coach: isCS() ? undefined : me.id, kind: 'login', text: `${me.name} เข้าสู่ระบบ` }); save();
      closeModal(); view = null; render();
    }, 'หลังบ้าน ปั้นพอร์ต 1 ล้าน');
  }
  if (act === 'logout') return logout();
  if (act === 'as') { sessionStorage.setItem('p1m-bo', id); sessionStorage.setItem(ACT, String(Date.now())); view = null; selCl = null; return render(); }
  if (act === 'reset') { resetData(); view = null; selCl = null; render(); return toast('รีเซ็ตข้อมูลเดโมแล้ว'); }
  if (!ME()) return;
  if (act === 'open') { if (!canSee(id)) return; closeModal(); if (selCl !== id) { clTab = 'ov'; ['cal', 'cps', 'ctg', 'cex', 'csn', 'cfl', 'cno'].forEach(k => { PG[k] = 0; }); } selCl = id; return go('client'); }
  if (act === 'compose') return composeModal();
  if (act === 'cancelo') return cancelModal(a.dataset.o);
  if (act === 'cell') return cellModal(a.dataset.o, a.dataset.c);
  if (act === 'toverify') { selEx = id; vFilter = 'all'; go('verify'); return pageOf('vq', `[data-sel="${CSS.escape(id)}"]`); }
  if (act === 'vok' || act === 'vfix') {
    const ex = execOf(id); if (!ex || isCS() || !canSee(ex.cl) || ex.ver !== 'pend') return;
    const note = clean($('#vnote').value, 300);
    if (act === 'vfix' && !note) { $('#vnote').focus(); return toast('บอกลูกค้าว่าต้องแก้อะไร'); }
    Object.assign(ex, { ver: act === 'vok' ? 'ok' : 'fix', cnote: note || undefined, vat: now(), vby: ME().id });
    pushFeed({ by: 'coach', who: ME().id, coach: ME().id, cl: ex.cl, kind: 'verify', text: act === 'vok' ? `${ME().name} ยืนยันออเดอร์ ${ex.sym} แล้ว` : `${ME().name} ขอให้แนบภาพใหม่: ${ex.sym}` });
    if (!save()) return;
    selEx = null; render(); return toast(`${ic(act === 'vok' ? 'check' : 'upload', 18)}<div><b>${act === 'vok' ? 'ยืนยันแล้ว' : 'ส่งคำขอให้แก้แล้ว'}</b><div class="muted sm">${esc(cname(client(ex.cl)))} · ${esc(ex.sym)}</div></div>`, act === 'vok' ? 'ok' : '');
  }
  if (act === 'nudge' || act === 'nudgeall') {
    let names;
    if (act === 'nudgeall') { const o = order(a.dataset.o); if (!o || o.coach !== ME().id) return; names = Object.entries(o.tg).filter(([, t]) => tStatus(o, t) === 'pend').map(([c]) => client(c).name); }
    else { if (!canSee(a.dataset.c)) return; names = [client(a.dataset.c).name]; }
    pushFeed({ by: isCS() ? 'cs' : 'coach', who: ME().id, coach: ME().id, kind: 'nudge', text: `${ME().name} ส่งเตือนทาง LINE ถึง ${names.join(', ')}` }); save();
    return toast(`${ic('chat', 18)}<div><b>ส่งเตือนทาง LINE แล้ว</b><div class="muted sm">ถึง ${esc(names.join(', '))}</div></div>`, 'ok');
  }
  if (act === 'call') return callModal(a.dataset.k, a.dataset.cl);
  if (act === 'forward') {
    const c = client(a.dataset.cl); if (!isCS() || !c) return;
    const list = myAlerts().filter(x => x.cl === c.id), txt = list.map(x => x.title).join(' · ');
    S.notes.push({ id: nid('n'), cl: c.id, by: 'cs', role: 'cs', at: now(), text: `ส่งต่อให้โค้ช: ${txt}` });
    list.forEach(x => { S.done[x.k] = { by: 'cs', at: now(), note: 'ส่งต่อโค้ช' }; });
    pushFeed({ by: 'cs', who: 'cs', kind: 'forward', cl: c.id, coach: c.coach, text: `CS ส่งต่อเรื่องของ${c.name}ให้${coach(c.coach).name}: ${txt}` });
    if (!save()) return;
    render(); return toast(`${ic('send', 18)}<div><b>ส่งต่อให้${coach(c.coach).name}แล้ว</b><div class="muted sm">${esc(c.name)} · ${list.length} เรื่อง</div></div>`, 'ok');
  }
  if (act === 'flowrev') return flowModal(a.dataset.c, a.dataset.f);
  if (act === 'addnote') {
    if (!canSee(id)) return;
    const t = clean($('#newnote').value, 500); if (!t) return $('#newnote').focus();
    S.notes.push({ id: nid('n'), cl: id, by: ME().id, role: isCS() ? 'cs' : 'coach', at: now(), text: t });
    pushFeed({ by: isCS() ? 'cs' : 'coach', who: ME().id, cl: id, coach: client(id).coach, kind: 'note', text: `${ME().name} เพิ่มโน้ตของ${client(id).name}` });
    if (!save()) return;
    PG.cno = 0; return render();
  }
  if (act === 'note') return noteModal(id);
  if (act === 'line1') return toast(`${ic('chat', 18)}<div><b>เปิดแชต LINE</b><div class="muted sm">ระบบจริงเปิดห้องแชตกับ${esc(client(id)?.name || '')}ใน LINE OA</div></div>`);
  if (act === 'addcl') return addClientModal();
  if (act === 'recoach') return recoachModal(id);
  if (act === 'coachf') { if (!isCS()) return; fCoach = id; fStat = 'all'; PG.all = 0; return go('clients'); }
  if (act === 'addstaff') return addStaffModal();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'newnote') { e.preventDefault(); $('[data-act=addnote]')?.click(); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches?.('.ccard')) { e.preventDefault(); e.target.click(); }
});
document.addEventListener('input', e => { if (e.target.id === 'q') { q = clean(e.target.value, 60); PG.all = 0; const pos = e.target.selectionStart; render(); const i = $('#q'); if (i) { i.focus(); i.setSelectionRange(pos, pos); } } });
document.addEventListener('change', e => { if (e.target.id === 'fcoach') { fCoach = coach(e.target.value) ? e.target.value : ''; PG.all = 0; render(); } if (e.target.id === 'sort') { sortBy = e.target.value; PG.all = 0; render(); } });

// the client journal writes to the same storage; pick up its changes
window.addEventListener('storage', e => {
  if (e.key !== KEY) return;
  const seen = new Set(S.feed.map(f => f.id));
  S = load();
  const me = ME(); if (!me) return render();
  S.feed.filter(f => !seen.has(f.id) && f.by === 'client' && f.kind !== 'login' && f.kind !== 'logout' && (isCS() ? ['flow', 'snap'].includes(f.kind) : f.coach === me.id))
    .forEach(f => toast(`${ic(f.kind === 'off' ? 'flag' : f.kind === 'skip' ? 'alert' : 'inbox', 18)}<div><b>${esc(f.text)}</b><div class="muted sm">${['exec', 'off', 'fix'].includes(f.kind) ? 'เข้าคิวตรวจหลักฐาน' : 'อัปเดตแล้ว'}</div></div>`));
  if (!$('#modal').innerHTML && document.activeElement?.id !== 'q' && document.activeElement?.id !== 'newnote' && document.activeElement?.id !== 'vnote') render();
});
let rz;
addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (!$('#modal').innerHTML) render(); }, 150); });
setInterval(() => { idleCheck(); if (!$('#modal').innerHTML && ME() && !menu && !['q', 'newnote', 'vnote'].includes(document.activeElement?.id)) render(); }, 30000);
idleCheck();
render();
</script>
</body>
</html>
